<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ اختبار إصلاح السطر 533</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .success-card {
            background: rgba(40, 167, 69, 0.3);
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            border: 2px solid #28a745;
            text-align: center;
        }
        .test-card {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .btn {
            padding: 12px 24px;
            background: linear-gradient(45deg, #007bff, #0056b3);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-success { background: linear-gradient(45deg, #28a745, #20c997); }
        .code-output {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .icon { font-size: 3rem; margin: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-card">
            <div class="icon">🎉</div>
            <h1>تم إصلاح مشكلة السطر 533!</h1>
            <p>تم حذف القوس الزائد `}` وإصلاح بنية الكود</p>
        </div>

        <div class="test-card">
            <h2>🔧 اختبار سريع للكود</h2>
            <button class="btn btn-success" onclick="testJavaScript()">اختبار JavaScript</button>
            <button class="btn" onclick="testSyntax()">فحص Syntax</button>
            <div id="test-result" class="code-output">انقر على الأزرار لبدء الاختبار...</div>
        </div>

        <div class="test-card">
            <h2>🚀 اختبار النظام</h2>
            <a href="http://localhost:8000/admin/manage-folders" target="_blank" class="btn">فتح صفحة المجلدات</a>
            <button class="btn btn-success" onclick="checkConsole()">فحص Console</button>
        </div>
    </div>

    <script>
        // مراقب الأخطاء
        const testResult = document.getElementById('test-result');
        let errors = [];

        const originalError = console.error;
        console.error = function(...args) {
            originalError.apply(console, args);
            errors.push('❌ ERROR: ' + args.join(' '));
            updateTestResult();
        };

        function updateTestResult() {
            const time = new Date().toLocaleTimeString('ar-SA');
            testResult.innerHTML = `[${time}] تم تحديث النتائج...<br>` + errors.join('<br>');
        }

        function testJavaScript() {
            testResult.innerHTML = '🔄 جاري اختبار JavaScript...<br>';
            errors = [];

            let tests = [];

            // Test 1: Basic syntax
            try {
                eval('const test = "Hello World"; console.log("✅ Basic syntax working");');
                tests.push('✅ JavaScript Basic Syntax يعمل');
            } catch (error) {
                tests.push('❌ خطأ في Basic Syntax: ' + error.message);
                errors.push('❌ Syntax Error: ' + error.message);
            }

            // Test 2: Functions
            try {
                function testFunc() { return 'success'; }
                if (testFunc() === 'success') {
                    tests.push('✅ الدوال تعمل بشكل صحيح');
                }
            } catch (error) {
                tests.push('❌ خطأ في الدوال: ' + error.message);
                errors.push('❌ Function Error: ' + error.message);
            }

            // Test 3: Arrow functions
            try {
                const arrowFunc = () => 'arrow test';
                if (arrowFunc() === 'arrow test') {
                    tests.push('✅ Arrow Functions تعمل');
                }
            } catch (error) {
                tests.push('❌ خطأ في Arrow Functions: ' + error.message);
                errors.push('❌ Arrow Function Error: ' + error.message);
            }

            // Test 4: Template literals
            try {
                const name = 'اختبار';
                const template = `مرحبا ${name}`;
                tests.push('✅ Template Literals تعمل');
            } catch (error) {
                tests.push('❌ خطأ في Template Literals: ' + error.message);
                errors.push('❌ Template Error: ' + error.message);
            }

            const time = new Date().toLocaleTimeString('ar-SA');
            testResult.innerHTML = `[${time}] نتائج الاختبار:<br><br>${tests.join('<br>')}<br><br>الأخطاء: ${errors.length === 0 ? 'لا توجد أخطاء! 🎉' : errors.length + ' خطأ'}`;
        }

        function testSyntax() {
            testResult.innerHTML = '🔍 جاري فحص Syntax...<br>';

            let syntaxTests = [];

            // Test various JavaScript syntax elements
            try {
                // Object syntax
                const obj = { key: 'value', method() { return 'ok'; } };
                syntaxTests.push('✅ Object Syntax صحيح');

                // Array syntax
                const arr = [1, 2, 3, ...[], { key: 'value' }];
                syntaxTests.push('✅ Array Syntax صحيح');

                // Destructuring
                const { key } = obj;
                const [first] = arr;
                syntaxTests.push('✅ Destructuring Syntax صحيح');

                // Async/await syntax check
                async function asyncTest() { return 'async test'; }
                syntaxTests.push('✅ Async/Await Syntax صحيح');

            } catch (error) {
                syntaxTests.push('❌ خطأ في Syntax: ' + error.message);
                errors.push('❌ Syntax Error: ' + error.message);
            }

            const time = new Date().toLocaleTimeString('ar-SA');
            testResult.innerHTML = `[${time}] نتائج فحص Syntax:<br><br>${syntaxTests.join('<br>')}<br><br>${errors.length === 0 ? '🎉 جميع Syntax صحيح!' : '⚠️ يوجد ' + errors.length + ' خطأ'}`;
        }

        function checkConsole() {
            testResult.innerHTML = '📊 جاري فحص Console...<br>';

            setTimeout(() => {
                const time = new Date().toLocaleTimeString('ar-SA');
                testResult.innerHTML = `[${time}] تقرير Console:<br><br>
                    ✅ مراقب الأخطاء يعمل<br>
                    ✅ console.log متاح<br>
                    ✅ console.error متاح<br>
                    📊 عدد الأخطاء المكتشفة: ${errors.length}<br><br>
                    ${errors.length === 0 ? '🎉 Console نظيف تماماً!' : '⚠️ يوجد أخطاء: ' + errors.join(', ')}`;
            }, 1000);
        }

        // Auto-run test on page load
        window.onload = function() {
            console.log('🚀 تم تحميل صفحة اختبار إصلاح السطر 533');
            setTimeout(() => {
                testJavaScript();
            }, 1000);
        };
    </script>
</body>
</html>
