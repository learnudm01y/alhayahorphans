<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار البحث الشامل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .search-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .search-result-row { transition: all 0.3s ease; }
        .search-result-row:hover { background-color: #f8f9fa; transform: translateY(-2px); }
        .animate__fadeIn { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .badge { font-size: 0.85em; }
        .text-pink { color: #e91e63; }
        .search-stats { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container-fluid search-container">
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0"><i class="fas fa-search"></i> اختبار البحث الشامل</h3>
                    </div>
                    <div class="card-body">
                        <!-- شريط البحث -->
                        <div class="row mb-4">
                            <div class="col-md-8">
                                <div class="input-group">
                                    <input type="text" id="searchInput" class="form-control form-control-lg"
                                           placeholder="ابحث بالاسم الكامل مثل: سعاد صلاح رضوان بلال"
                                           value="سعاد صلاح رضوان بلال">
                                    <button class="btn btn-primary" type="button" onclick="performSearch()">
                                        <i class="fas fa-search"></i> بحث
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-success" onclick="performSearch('سعاد صلاح')">اختبار سريع 1</button>
                                <button class="btn btn-info ms-2" onclick="performSearch('سعاد')">اختبار سريع 2</button>
                            </div>
                        </div>

                        <!-- إحصائيات البحث -->
                        <div id="searchStats" class="search-stats" style="display: none;">
                            <div class="row">
                                <div class="col-md-4">
                                    <h5><i class="fas fa-chart-bar"></i> إحصائيات البحث</h5>
                                </div>
                                <div class="col-md-8" id="statsContent">
                                </div>
                            </div>
                        </div>

                        <!-- حالة التحميل -->
                        <div id="loadingState" class="text-center py-4" style="display: none;">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">جاري البحث...</span>
                            </div>
                            <p class="mt-2">جاري البحث الشامل في قاعدة البيانات...</p>
                        </div>

                        <!-- النتائج -->
                        <div id="searchResults" class="table-responsive" style="display: none;">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th><i class="fas fa-user"></i> الاسم الكامل</th>
                                        <th><i class="fas fa-id-card"></i> رقم الهوية</th>
                                        <th><i class="fas fa-map-marker-alt"></i> المدينة</th>
                                        <th><i class="fas fa-female"></i> اسم الأم</th>
                                        <th><i class="fas fa-calendar"></i> تاريخ الميلاد</th>
                                        <th><i class="fas fa-cogs"></i> إجراءات</th>
                                    </tr>
                                </thead>
                                <tbody id="searchResultsBody">
                                </tbody>
                            </table>
                        </div>

                        <!-- عدم وجود نتائج -->
                        <div id="noResults" class="text-center py-5" style="display: none;">
                            <i class="fas fa-search-minus fa-3x text-muted mb-3"></i>
                            <h4 class="text-muted">لا توجد نتائج</h4>
                            <p class="text-muted">جرب البحث بكلمات مختلفة أو تأكد من الإملاء</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let searchTimeout;

        // البحث الفوري مع تأخير
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const query = this.value.trim();

            if (query.length >= 2) {
                searchTimeout = setTimeout(() => {
                    performSearch(query);
                }, 500);
            } else {
                hideResults();
            }
        });

        // تنفيذ البحث
        async function performSearch(query = null) {
            const searchInput = document.getElementById('searchInput');
            const searchQuery = query || searchInput.value.trim();

            if (searchQuery.length < 2) {
                alert('يرجى إدخال حرفين على الأقل للبحث');
                return;
            }

            console.log('🔍 بدء البحث عن:', searchQuery);
            showLoading();

            try {
                const startTime = performance.now();

                const response = await fetch(`/api/scout/instant-search?query=${encodeURIComponent(searchQuery)}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                const endTime = performance.now();
                const requestTime = Math.round(endTime - startTime);

                console.log('📡 استجابة الخادم:', response);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('📊 بيانات البحث:', data);

                hideLoading();
                displayResults(data);
                updateStats(data, requestTime);

            } catch (error) {
                console.error('❌ خطأ في البحث:', error);
                hideLoading();
                showError('حدث خطأ في البحث: ' + error.message);
            }
        }

        // عرض النتائج
        function displayResults(response) {
            console.log('🎯 عرض النتائج:', response);

            const resultsContainer = document.getElementById('searchResults');
            const resultsBody = document.getElementById('searchResultsBody');
            const noResults = document.getElementById('noResults');

            // دعم تنسيقات متعددة
            let data = response.data || response.results || response;

            if (data && typeof data === 'object' && !Array.isArray(data)) {
                if (data.results && Array.isArray(data.results)) {
                    data = data.results;
                } else if (data.data && Array.isArray(data.data)) {
                    data = data.data;
                } else {
                    data = [data];
                }
            }

            if (!data || (Array.isArray(data) && data.length === 0)) {
                resultsContainer.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            resultsContainer.style.display = 'block';

            let html = '';
            const results = Array.isArray(data) ? data : [data];

            results.forEach((person, index) => {
                const fullName = person.full_name ||
                               [person.CI_FIRST_ARB, person.CI_FATHER_ARB, person.CI_GRAND_FATHER_ARB, person.CI_FAMILY_ARB]
                               .filter(name => name && name.trim()).join(' ') || 'غير محدد';

                const idNum = person.CI_ID_NUM || person.id_num || 'غير محدد';
                const city = person.CITY || person.city || 'غير محدد';
                const motherName = person.MOTHER_NAME1 || person.mother_name || 'غير محدد';
                const birthDate = person.CI_BIRTH_DT || person.birth_date || 'غير محدد';
                const gender = person.gender || (person.CI_SEX_CD == 1 ? 'ذكر' : person.CI_SEX_CD == 2 ? 'أنثى' : 'غير محدد');

                html += `
                    <tr class="search-result-row animate__fadeIn" style="animation-delay: ${index * 0.1}s;">
                        <td>
                            <strong class="text-primary">${fullName}</strong>
                            ${gender !== 'غير محدد' ? `<br><small class="text-muted"><i class="fas fa-user"></i> ${gender}</small>` : ''}
                        </td>
                        <td>
                            <span class="badge bg-secondary">${idNum}</span>
                        </td>
                        <td>
                            <i class="fas fa-map-marker-alt text-info"></i> ${city}
                        </td>
                        <td>
                            <i class="fas fa-female text-pink"></i> ${motherName}
                        </td>
                        <td>
                            <i class="fas fa-calendar text-success"></i> ${birthDate}
                        </td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="selectPerson(${person.ID || person.id || index})">
                                <i class="fas fa-check"></i> اختيار
                            </button>
                        </td>
                    </tr>
                `;
            });

            resultsBody.innerHTML = html;
        }

        // تحديث الإحصائيات
        function updateStats(response, requestTime) {
            const statsContainer = document.getElementById('searchStats');
            const statsContent = document.getElementById('statsContent');

            const count = response.total || (response.data ? response.data.length : 0);
            const searchTime = response.search_time || (requestTime / 1000).toFixed(2);

            statsContent.innerHTML = `
                <div class="row text-center">
                    <div class="col-md-4">
                        <h5><i class="fas fa-list"></i> ${count}</h5>
                        <small>نتيجة</small>
                    </div>
                    <div class="col-md-4">
                        <h5><i class="fas fa-clock"></i> ${searchTime}</h5>
                        <small>ثانية</small>
                    </div>
                    <div class="col-md-4">
                        <h5><i class="fas fa-database"></i> شامل</h5>
                        <small>جميع الحقول</small>
                    </div>
                </div>
            `;

            statsContainer.style.display = 'block';
        }

        // عرض حالة التحميل
        function showLoading() {
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('searchResults').style.display = 'none';
            document.getElementById('noResults').style.display = 'none';
            document.getElementById('searchStats').style.display = 'none';
        }

        // إخفاء حالة التحميل
        function hideLoading() {
            document.getElementById('loadingState').style.display = 'none';
        }

        // إخفاء النتائج
        function hideResults() {
            document.getElementById('searchResults').style.display = 'none';
            document.getElementById('noResults').style.display = 'none';
            document.getElementById('searchStats').style.display = 'none';
        }

        // عرض خطأ
        function showError(message) {
            const noResults = document.getElementById('noResults');
            noResults.innerHTML = `
                <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
                <h4 class="text-danger">حدث خطأ</h4>
                <p class="text-muted">${message}</p>
            `;
            noResults.style.display = 'block';
        }

        // اختيار شخص
        function selectPerson(personId) {
            console.log('تم اختيار الشخص:', personId);
            alert(`تم اختيار الشخص رقم: ${personId}`);
        }

        // تنفيذ بحث تلقائي عند تحميل الصفحة
        window.addEventListener('load', function() {
            console.log('🚀 تم تحميل صفحة الاختبار');
            // performSearch('سعاد صلاح رضوان بلال');
        });
    </script>
</body>
</html>
