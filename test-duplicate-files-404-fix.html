<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار إصلاح مسارات الملفات المكررة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .test-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-section {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .result {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

        .path-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 15px 0;
        }

        .path-box {
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .original-path {
            background: #ffebee;
            border: 1px solid #e57373;
        }

        .fixed-path {
            background: #e8f5e8;
            border: 1px solid #81c784;
        }

        .console-output {
            background: #000;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .path-comparison {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="text-center mb-4">
            <h1 class="text-primary">
                <i class="fas fa-bug"></i>
                اختبار إصلاح مسارات الملفات المكررة
            </h1>
            <p class="text-muted">تشخيص وإصلاح أخطاء 404 في نظام إدارة الملفات المكررة</p>
        </div>

        <!-- Console Monitor -->
        <div class="test-section">
            <h3><i class="fas fa-terminal"></i> مراقب الكونسول المباشر</h3>
            <div id="console-output" class="console-output">
                > بدء مراقبة أخطاء الكونسول...
            </div>
            <div class="mt-3">
                <button id="clear-console" class="btn btn-secondary btn-sm">
                    <i class="fas fa-eraser"></i> مسح الكونسول
                </button>
                <button id="test-api" class="btn btn-primary btn-sm">
                    <i class="fas fa-play"></i> اختبار API الملفات المكررة
                </button>
            </div>
        </div>

        <!-- Network Monitor -->
        <div class="test-section">
            <h3><i class="fas fa-network-wired"></i> مراقب الشبكة</h3>
            <div id="network-requests"></div>
        </div>

        <!-- Path Testing -->
        <div class="test-section">
            <h3><i class="fas fa-route"></i> اختبار إصلاح المسارات</h3>
            <div id="path-test-results"></div>
        </div>

        <!-- Statistics -->
        <div class="test-section">
            <h3><i class="fas fa-chart-bar"></i> إحصائيات</h3>
            <div class="row" id="statistics">
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h4 class="text-primary" id="total-requests">0</h4>
                            <p class="mb-0">إجمالي الطلبات</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h4 class="text-danger" id="error-requests">0</h4>
                            <p class="mb-0">طلبات خاطئة</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h4 class="text-warning" id="blocked-requests">0</h4>
                            <p class="mb-0">طلبات محجوبة</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h4 class="text-success" id="fixed-paths">0</h4>
                            <p class="mb-0">مسارات مُصلحة</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- تضمين مُصلح المسارات -->
    <script src="/js/file-path-fixer.js"></script>
    <script src="/js/openspeedtest-fix.js"></script>

    <script>
        let stats = {
            totalRequests: 0,
            errorRequests: 0,
            blockedRequests: 0,
            fixedPaths: 0
        };

        // مراقب الكونسول
        function initConsoleMonitor() {
            const consoleOutput = document.getElementById('console-output');
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;

            function logToMonitor(message, type = 'log') {
                const timestamp = new Date().toLocaleTimeString();
                const color = {
                    'log': '#00ff00',
                    'error': '#ff4444',
                    'warn': '#ffaa00'
                }[type];

                consoleOutput.innerHTML += `<span style="color: ${color}">[${timestamp}] ${message}</span>\n`;
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            }

            console.log = function(...args) {
                const message = args.join(' ');
                logToMonitor(`LOG: ${message}`, 'log');
                return originalLog.apply(console, args);
            };

            console.error = function(...args) {
                const message = args.join(' ');
                logToMonitor(`ERROR: ${message}`, 'error');

                // تتبع أخطاء 404
                if (message.includes('404') || message.includes('Not Found')) {
                    stats.errorRequests++;
                    updateStats();
                }

                return originalError.apply(console, args);
            };

            console.warn = function(...args) {
                const message = args.join(' ');
                logToMonitor(`WARN: ${message}`, 'warn');

                // تتبع الطلبات المحجوبة
                if (message.includes('حجب') || message.includes('blocked')) {
                    stats.blockedRequests++;
                    updateStats();
                }

                return originalWarn.apply(console, args);
            };
        }

        // مراقب الشبكة
        function initNetworkMonitor() {
            const originalFetch = window.fetch;
            const networkDiv = document.getElementById('network-requests');

            window.fetch = function(url, options) {
                stats.totalRequests++;
                updateStats();

                const startTime = Date.now();
                const requestDiv = document.createElement('div');
                requestDiv.className = 'result info';
                requestDiv.innerHTML = `
                    <i class="fas fa-spinner fa-spin"></i>
                    <strong>طلب جاري:</strong> ${url}
                `;
                networkDiv.appendChild(requestDiv);

                return originalFetch.apply(this, arguments)
                    .then(response => {
                        const duration = Date.now() - startTime;
                        requestDiv.className = `result ${response.ok ? 'success' : 'error'}`;
                        requestDiv.innerHTML = `
                            <i class="fas fa-${response.ok ? 'check' : 'times'}"></i>
                            <strong>${response.status} ${response.statusText}</strong> - ${url} (${duration}ms)
                        `;

                        if (!response.ok && (url.includes('storage/I:') || url.includes('storage/C:'))) {
                            stats.errorRequests++;
                            updateStats();
                        }

                        return response;
                    })
                    .catch(error => {
                        const duration = Date.now() - startTime;
                        requestDiv.className = 'result error';
                        requestDiv.innerHTML = `
                            <i class="fas fa-times"></i>
                            <strong>خطأ:</strong> ${error.message} - ${url} (${duration}ms)
                        `;
                        stats.errorRequests++;
                        updateStats();
                        throw error;
                    });
            };
        }

        // تحديث الإحصائيات
        function updateStats() {
            document.getElementById('total-requests').textContent = stats.totalRequests;
            document.getElementById('error-requests').textContent = stats.errorRequests;
            document.getElementById('blocked-requests').textContent = stats.blockedRequests;
            document.getElementById('fixed-paths').textContent = stats.fixedPaths;
        }

        // اختبار إصلاح المسارات
        function testPathFixing() {
            const pathTestDiv = document.getElementById('path-test-results');

            const testPaths = [
                'I:\\unit test\\ASO\\ASO - Copy\\storage\\app\\public\\temp\\duplicates\\dup_folder_123\\image.jpg',
                'C:\\projects\\storage\\app\\temp\\duplicates\\folder\\document.pdf',
                '/storage/I:/unit test/ASO/storage/app/public/temp/duplicates/test.png'
            ];

            pathTestDiv.innerHTML = '<h5>اختبار إصلاح المسارات:</h5>';

            testPaths.forEach((path, index) => {
                const fixed = window.FilePathFixer ?
                    window.FilePathFixer.fixFilePath(path, index + 1, 'image') :
                    'FilePathFixer غير متوفر';

                const isFixed = fixed && !fixed.includes('I:\\') && !fixed.includes('C:\\');

                if (isFixed) {
                    stats.fixedPaths++;
                }

                pathTestDiv.innerHTML += `
                    <div class="path-comparison">
                        <div class="path-box original-path">
                            <strong>قبل:</strong><br>${path}
                        </div>
                        <div class="path-box fixed-path">
                            <strong>بعد:</strong><br>${fixed}
                        </div>
                    </div>
                    <div class="result ${isFixed ? 'success' : 'error'}">
                        <i class="fas fa-${isFixed ? 'check' : 'times'}"></i>
                        ${isFixed ? 'تم إصلاح المسار بنجاح' : 'فشل في إصلاح المسار'}
                    </div>
                `;
            });

            updateStats();
        }

        // اختبار API
        function testDuplicateFilesAPI() {
            console.log('🧪 بدء اختبار API الملفات المكررة...');

            fetch('/admin/duplicate-files/paginated?per_page=5')
                .then(response => response.json())
                .then(data => {
                    console.log('✅ نجح استدعاء API:', data);

                    if (data.success && data.data.files) {
                        console.log(`📁 تم جلب ${data.data.files.length} ملف`);

                        // فحص المسارات
                        data.data.files.forEach((file, index) => {
                            if (file.temp_path && (file.temp_path.includes('I:\\') || file.temp_path.includes('C:\\'))) {
                                console.warn(`⚠️ ملف ${index + 1} يحتوي على مسار Windows مطلق: ${file.temp_path}`);
                            } else {
                                console.log(`✅ ملف ${index + 1} له مسار صحيح: ${file.temp_path}`);
                            }
                        });
                    }
                })
                .catch(error => {
                    console.error('❌ فشل في استدعاء API:', error);
                });
        }

        // تهيئة النظام
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 بدء تشخيص مسارات الملفات المكررة...');

            // تهيئة المراقبات
            initConsoleMonitor();
            initNetworkMonitor();

            // اختبار إصلاح المسارات
            testPathFixing();

            // ربط الأزرار
            document.getElementById('clear-console').addEventListener('click', function() {
                document.getElementById('console-output').innerHTML = '> تم مسح الكونسول...\n';
            });

            document.getElementById('test-api').addEventListener('click', testDuplicateFilesAPI);

            // فحص دوري للمشاكل
            setInterval(() => {
                if (stats.errorRequests > 0) {
                    console.warn(`⚠️ تم رصد ${stats.errorRequests} خطأ حتى الآن`);
                }
            }, 5000);

            console.log('✅ تم تفعيل نظام التشخيص');
        });
    </script>
</body>
</html>
