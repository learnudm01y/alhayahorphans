<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Syntax Validation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .success { color: green; }
        .error { color: red; }
        .test-result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        .code-block { background: #f5f5f5; padding: 10px; margin: 10px 0; border-left: 4px solid #007bff; }
    </style>
</head>
<body>
    <h1>JavaScript Syntax Validation Test</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        // Test 1: Object with property ending
        function testObjectSyntax() {
            try {
                const testObj = {
                    name: 'test',
                    size: 100,
                    type: 'file'
                };

                console.log('Test object:', testObj);
                results.innerHTML += '<div class="test-result success">✅ Object syntax test passed</div>';
            } catch (error) {
                results.innerHTML += '<div class="test-result error">❌ Object syntax test failed: ' + error.message + '</div>';
            }
        }

        // Test 2: Template literal with object property
        function testTemplateLiteral() {
            try {
                const fileData = {
                    file: {
                        name: 'test-file.pdf',
                        size: 1024
                    },
                    id: 1
                };

                const fileName = fileData.file.name;
                const result = `<td>` + fileName + `</td>
                               <td>` + fileData.file.size + `</td>
                               <td>
                                   <button onclick="test('` + fileData.id + `')">Test</button>
                               </td>`;

                console.log('Template result:', result);
                results.innerHTML += '<div class="test-result success">✅ Template literal test passed</div>';
            } catch (error) {
                results.innerHTML += '<div class="test-result error">❌ Template literal test failed: ' + error.message + '</div>';
            }
        }

        // Test 3: Event listener with object access
        function testEventListener() {
            try {
                const mockElement = {
                    addEventListener: function(event, callback) {
                        console.log('Event listener added:', event);
                        callback({ target: { checked: true } });
                    }
                };

                mockElement.addEventListener('change', (e) => {
                    const excelTargetOptions = document.getElementById('excelTargetOptions');
                    if (excelTargetOptions) {
                        excelTargetOptions.style.display = e.target.checked ? 'block' : 'none';
                    }
                });

                results.innerHTML += '<div class="test-result success">✅ Event listener test passed</div>';
            } catch (error) {
                results.innerHTML += '<div class="test-result error">❌ Event listener test failed: ' + error.message + '</div>';
            }
        }

        // Test 4: Complex object with nested properties
        function testComplexObject() {
            try {
                const analysis = {
                    totalFiles: 10,
                    folders: new Set(),
                    identityFolders: new Set(),
                    parentFolders: new Set(),
                    invalidFolders: new Set(),
                    fileTypes: {},
                    structure: {},
                    folderHierarchy: {}
                };

                console.log('Complex object:', analysis);
                results.innerHTML += '<div class="test-result success">✅ Complex object test passed</div>';
            } catch (error) {
                results.innerHTML += '<div class="test-result error">❌ Complex object test failed: ' + error.message + '</div>';
            }
        }

        // Test 5: Function with object parameter
        function testFunctionWithObject() {
            try {
                function processFile(file) {
                    const fileData = {
                        id: 1,
                        file: file,
                        status: 'pending',
                        progress: 0,
                        type: 'test',
                        preview: null,
                        processing: {
                            compression: false,
                            organization: true
                        }
                    };
                    return fileData;
                }

                const result = processFile({ name: 'test.pdf', size: 1024 });
                console.log('Function result:', result);
                results.innerHTML += '<div class="test-result success">✅ Function with object test passed</div>';
            } catch (error) {
                results.innerHTML += '<div class="test-result error">❌ Function with object test failed: ' + error.message + '</div>';
            }
        }

        // Run all tests
        window.onload = function() {
            results.innerHTML = '<h2>Running JavaScript Syntax Tests...</h2>';

            testObjectSyntax();
            testTemplateLiteral();
            testEventListener();
            testComplexObject();
            testFunctionWithObject();

            results.innerHTML += '<div class="test-result success">✅ All syntax tests completed</div>';

            // Summary
            const errorCount = document.querySelectorAll('.error').length;
            const successCount = document.querySelectorAll('.success').length;

            results.innerHTML += `<div class="code-block">
                <h3>Test Summary:</h3>
                <p>✅ Passed: ${successCount}</p>
                <p>❌ Failed: ${errorCount}</p>
                <p><strong>Overall Status: ${errorCount === 0 ? 'ALL TESTS PASSED' : 'SOME TESTS FAILED'}</strong></p>
            </div>`;
        };
    </script>
</body>
</html>
