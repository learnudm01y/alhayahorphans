<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تشخيص الملفات المكررة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .log-container {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            height: 400px;
            overflow-y: auto;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-stethoscope me-2"></i>تشخيص مشاكل الملفات المكررة</h3>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label>معرف الجلسة:</label>
                                <input type="text" id="sessionId" class="form-control" placeholder="اتركه فارغاً لإنشاء جلسة جديدة">
                            </div>
                            <div class="col-md-6 d-flex align-items-end">
                                <button id="createTestBtn" class="btn btn-success me-2">
                                    <i class="fas fa-plus"></i> إنشاء ملفات اختبارية
                                </button>
                                <button id="checkBtn" class="btn btn-primary me-2">
                                    <i class="fas fa-search"></i> فحص الملفات المكررة
                                </button>
                                <button id="clearBtn" class="btn btn-secondary">
                                    <i class="fas fa-trash"></i> مسح السجل
                                </button>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-8">
                                <div class="log-container" id="logContainer">جاري التحضير للاختبار...</div>
                            </div>
                            <div class="col-md-4">
                                <div class="card bg-light">
                                    <div class="card-header">النتائج</div>
                                    <div class="card-body">
                                        <div class="mb-2">
                                            <strong>الحالة:</strong> <span id="status" class="badge bg-secondary">جاهز</span>
                                        </div>
                                        <div class="mb-2">
                                            <strong>الملفات المكتشفة:</strong> <span id="filesCount">0</span>
                                        </div>
                                        <div class="mb-2">
                                            <strong>معرف الجلسة الحالي:</strong> <br>
                                            <small id="currentSessionId" class="text-muted">غير محدد</small>
                                        </div>
                                        <div class="mt-3">
                                            <button id="viewModalBtn" class="btn btn-outline-primary btn-sm" style="display:none;">
                                                <i class="fas fa-eye"></i> عرض Modal
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const logContainer = document.getElementById('logContainer');
        const statusEl = document.getElementById('status');
        const filesCountEl = document.getElementById('filesCount');
        const currentSessionIdEl = document.getElementById('currentSessionId');

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                info: '#17a2b8',
                success: '#28a745',
                error: '#dc3545',
                warning: '#ffc107'
            };

            logContainer.innerHTML += `[${timestamp}] ${message}\n`;
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateStatus(status, type = 'secondary') {
            statusEl.className = `badge bg-${type}`;
            statusEl.textContent = status;
        }

        async function createTestDuplicates() {
            addLog('🔧 إنشاء ملفات اختبارية للملفات المكررة...', 'info');
            updateStatus('جاري الإنشاء...', 'warning');

            try {
                const sessionId = document.getElementById('sessionId').value || undefined;
                const url = '/admin/file/create-test-duplicates' + (sessionId ? `?session_id=${sessionId}` : '');

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '',
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.success) {
                    addLog('✅ تم إنشاء الملفات الاختبارية بنجاح!', 'success');
                    addLog(`📁 معرف الجلسة: ${result.data.session_id}`, 'info');
                    addLog(`📄 الملفات المنشأة: ${result.data.files_created.join(', ')}`, 'info');
                    addLog(`💾 مسار التخزين: ${result.data.temp_path}`, 'info');

                    // تحديث معرف الجلسة في الواجهة
                    document.getElementById('sessionId').value = result.data.session_id;
                    currentSessionIdEl.textContent = result.data.session_id;

                    updateStatus('تم الإنشاء', 'success');

                    // فحص الملفات تلقائياً
                    setTimeout(() => checkDuplicates(), 1000);
                } else {
                    addLog('❌ فشل في إنشاء الملفات الاختبارية: ' + result.message, 'error');
                    updateStatus('فشل الإنشاء', 'danger');
                }
            } catch (error) {
                addLog('❌ خطأ في الاتصال: ' + error.message, 'error');
                updateStatus('خطأ في الاتصال', 'danger');
            }
        }

        async function checkDuplicates() {
            const sessionId = document.getElementById('sessionId').value;

            if (!sessionId) {
                addLog('⚠️ يرجى إدخال معرف الجلسة أو إنشاء ملفات اختبارية أولاً', 'warning');
                return;
            }

            addLog('🔍 فحص الملفات المكررة...', 'info');
            updateStatus('جاري الفحص...', 'warning');

            try {
                const response = await fetch(`/admin/file/duplicate-summary?session_id=${sessionId}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                const result = await response.json();

                if (result.success) {
                    addLog('✅ تم جلب الملفات المكررة بنجاح!', 'success');
                    addLog(`📊 إجمالي الملفات المكررة: ${result.data.total_duplicates}`, 'info');

                    filesCountEl.textContent = result.data.total_duplicates;
                    currentSessionIdEl.textContent = result.data.session_id;

                    if (result.data.files.length > 0) {
                        addLog('📋 تفاصيل الملفات المكررة:', 'info');
                        result.data.files.forEach((file, index) => {
                            addLog(`  ${index + 1}. ${file.original_name}`, 'info');
                            addLog(`     الحجم: ${(file.file_size / 1024).toFixed(2)} KB`, 'info');
                            addLog(`     النوع: ${file.mime_type}`, 'info');
                            addLog(`     الرابط: ${file.temp_url}`, 'info');
                        });

                        updateStatus('تم العثور على ملفات', 'success');
                        document.getElementById('viewModalBtn').style.display = 'inline-block';
                    } else {
                        addLog('ℹ️ لا توجد ملفات مكررة في هذه الجلسة', 'info');
                        updateStatus('لا توجد ملفات', 'warning');
                    }
                } else {
                    addLog('❌ فشل في جلب الملفات المكررة: ' + result.message, 'error');
                    updateStatus('فشل الفحص', 'danger');
                }
            } catch (error) {
                addLog('❌ خطأ في الاتصال: ' + error.message, 'error');
                updateStatus('خطأ في الاتصال', 'danger');
            }
        }

        function clearLog() {
            logContainer.innerHTML = 'تم مسح السجل...\n';
            updateStatus('جاهز', 'secondary');
            filesCountEl.textContent = '0';
            document.getElementById('viewModalBtn').style.display = 'none';
        }

        // ربط الأحداث
        document.getElementById('createTestBtn').addEventListener('click', createTestDuplicates);
        document.getElementById('checkBtn').addEventListener('click', checkDuplicates);
        document.getElementById('clearBtn').addEventListener('click', clearLog);

        // إضافة CSRF token إذا لم يكن موجوداً
        if (!document.querySelector('meta[name="csrf-token"]')) {
            const meta = document.createElement('meta');
            meta.name = 'csrf-token';
            meta.content = 'test-token'; // في بيئة الاختبار
            document.head.appendChild(meta);
        }

        // رسالة الترحيب
        addLog('🚀 أداة تشخيص الملفات المكررة جاهزة', 'info');
        addLog('💡 ابدأ بإنشاء ملفات اختبارية أو أدخل معرف جلسة موجود', 'info');
    </script>
</body>
</html>
