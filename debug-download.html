<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 إصلاح زر التنزيل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a1a; color: white; padding: 30px; }
        .test-btn { padding: 15px 30px; margin: 10px; font-size: 16px; }
        .result-box { background: #2a2a2a; padding: 20px; margin: 20px 0; border-radius: 10px; }
        .success { border-left: 5px solid #28a745; }
        .error { border-left: 5px solid #dc3545; }
        .warning { border-left: 5px solid #ffc107; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">🔧 إصلاح زر التنزيل</h1>

        <div class="text-center">
            <button class="btn btn-primary test-btn" onclick="testAPI()">اختبار API</button>
            <button class="btn btn-success test-btn" onclick="testDownload()">اختبار التنزيل</button>
            <button class="btn btn-warning test-btn" onclick="debugMode()">وضع التشخيص</button>
        </div>

        <div id="result" class="result-box">
            جاهز للاختبار...
        </div>

        <div class="alert alert-info">
            <strong>التشخيص السريع:</strong><br>
            1. فحص API endpoint<br>
            2. اختبار إنشاء ZIP<br>
            3. تجربة التنزيل المباشر
        </div>
    </div>

    <script>
        function updateResult(message, type = 'info') {
            const resultBox = document.getElementById('result');
            resultBox.className = `result-box ${type}`;
            resultBox.innerHTML = `
                <h5>النتيجة:</h5>
                ${message}
                <br><small>الوقت: ${new Date().toLocaleString('ar-SA')}</small>
            `;
        }

        async function testAPI() {
            updateResult('🔄 اختبار API...', 'warning');

            try {
                const url = 'http://127.0.0.1:8000/api/duplicate-files/download?session_id=test_debug_123';

                // اختبار HEAD request أولاً
                const headResponse = await fetch(url, { method: 'HEAD' });

                if (headResponse.ok) {
                    updateResult(`✅ API يعمل!
                        <br>Status: ${headResponse.status}
                        <br>Headers: ${Array.from(headResponse.headers.entries()).map(([k,v]) => `${k}: ${v}`).join('<br>')}`, 'success');
                } else {
                    updateResult(`❌ API خطأ: ${headResponse.status} ${headResponse.statusText}`, 'error');
                }
            } catch (error) {
                updateResult(`❌ خطأ في الاتصال: ${error.message}`, 'error');
            }
        }

        async function testDownload() {
            updateResult('📥 اختبار التنزيل...', 'warning');

            try {
                const url = 'http://127.0.0.1:8000/api/duplicate-files/download?session_id=test_debug_123';

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/octet-stream',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                if (response.ok) {
                    const blob = await response.blob();

                    // إنشاء رابط التنزيل
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    link.download = `debug_test_${Date.now()}.zip`;

                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    window.URL.revokeObjectURL(downloadUrl);

                    updateResult(`✅ التنزيل نجح!
                        <br>حجم الملف: ${blob.size} bytes
                        <br>نوع الملف: ${blob.type}
                        <br>تحقق من مجلد التنزيلات`, 'success');
                } else {
                    updateResult(`❌ فشل التنزيل: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                updateResult(`❌ خطأ في التنزيل: ${error.message}`, 'error');
            }
        }

        function debugMode() {
            updateResult('🐛 تشغيل وضع التشخيص...', 'warning');

            // فحص الدوال المطلوبة
            const checks = [];

            if (typeof fetch !== 'undefined') checks.push('✅ fetch API');
            else checks.push('❌ fetch API مفقود');

            if (typeof Blob !== 'undefined') checks.push('✅ Blob API');
            else checks.push('❌ Blob API مفقود');

            if (typeof URL !== 'undefined' && typeof URL.createObjectURL !== 'undefined') {
                checks.push('✅ URL.createObjectURL');
            } else {
                checks.push('❌ URL.createObjectURL مفقود');
            }

            // فحص Console للأخطاء
            checks.push('🔍 افتح Developer Console للمزيد من التفاصيل');

            updateResult(`🔧 نتائج التشخيص:
                <br>${checks.join('<br>')}
                <br><br>📋 معلومات إضافية:
                <br>User Agent: ${navigator.userAgent}
                <br>URL الحالي: ${window.location.href}`, 'warning');
        }

        // تشغيل اختبار تلقائي
        window.addEventListener('load', function() {
            updateResult('🎯 أدوات التشخيص جاهزة - اختبر الأزرار أعلاه', 'info');
        });
    </script>
</body>
</html>
