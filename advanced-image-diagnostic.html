<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 فحص عرض الصور المتقدم</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            direction: rtl;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
        }
        .test-section {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }
        .file-item {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .image-preview {
            width: 150px;
            height: 150px;
            border: 2px solid #ddd;
            border-radius: 8px;
            object-fit: cover;
            background: #f0f0f0;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .warning { color: #ffc107; }
        .btn {
            padding: 8px 15px;
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            margin: 5px;
        }
        .path-test {
            font-family: monospace;
            font-size: 11px;
            background: rgba(0,0,0,0.2);
            padding: 5px;
            border-radius: 4px;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 فحص عرض الصور المتقدم</h1>

        <div class="test-section">
            <h2>📊 اختبار API محتويات المجلد</h2>
            <button onclick="testFolderAPI()" class="btn">اختبار API المجلد 001447</button>
            <div id="api-results"></div>
        </div>

        <div class="test-section">
            <h2>🖼️ اختبار عرض الصور</h2>
            <div id="image-gallery"></div>
        </div>

        <div class="test-section">
            <h2>🛠️ اختبار مسارات الملفات</h2>
            <div id="path-tests"></div>
        </div>
    </div>

    <script>
        async function testFolderAPI() {
            const resultsDiv = document.getElementById('api-results');
            resultsDiv.innerHTML = '<div>جاري الاختبار...</div>';

            try {
                // Test the actual API endpoint
                const response = await fetch('/admin/folders/contents?folder=001447&type=images');
                const data = await response.json();

                console.log('API Response:', data);

                if (data.success) {
                    resultsDiv.innerHTML = `
                        <div class="success">✅ API يعمل بنجاح</div>
                        <div>عدد الملفات: ${data.files ? data.files.length : 0}</div>
                        <div>اسم المجلد: ${data.folder_name}</div>
                    `;

                    // Display images
                    displayImages(data.files);
                    testFilePaths(data.files);
                } else {
                    resultsDiv.innerHTML = `<div class="error">❌ خطأ في API: ${data.message || 'غير محدد'}</div>`;
                }
            } catch (error) {
                console.error('API Error:', error);
                resultsDiv.innerHTML = `<div class="error">❌ خطأ في الاتصال: ${error.message}</div>`;
            }
        }

        function displayImages(files) {
            const gallery = document.getElementById('image-gallery');

            if (!files || files.length === 0) {
                gallery.innerHTML = '<div class="warning">⚠️ لا توجد ملفات</div>';
                return;
            }

            let html = '';
            files.forEach((file, index) => {
                const isImage = file.is_image || ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'].includes(file.extension?.toLowerCase());

                html += `
                    <div class="file-item">
                        <div>
                            ${isImage ?
                                `<img src="${file.download_url}"
                                     class="image-preview"
                                     alt="${file.original_file_name}"
                                     onload="console.log('✅ صورة محملة:', this.src)"
                                     onerror="console.error('❌ فشل تحميل صورة:', this.src); this.style.background='#ffebee'; this.alt='فشل التحميل';"
                                     onclick="window.open(this.src, '_blank')">` :
                                `<div class="image-preview" style="display: flex; align-items: center; justify-content: center; background: #f5f5f5; color: #666;">
                                    📄 ملف غير مرئي
                                 </div>`
                            }
                        </div>
                        <div style="flex: 1;">
                            <h4>${file.original_file_name}</h4>
                            <div><strong>المسار:</strong> ${file.download_url}</div>
                            <div><strong>النوع:</strong> ${file.extension} (${file.mime_type})</div>
                            <div><strong>الحجم:</strong> ${file.formatted_size}</div>
                            <div><strong>هو صورة:</strong> ${isImage ? 'نعم' : 'لا'}</div>
                            <a href="${file.download_url}" target="_blank" class="btn">فتح الملف</a>
                        </div>
                    </div>
                `;
            });

            gallery.innerHTML = html;
        }

        function testFilePaths(files) {
            const pathTests = document.getElementById('path-tests');

            if (!files || files.length === 0) {
                pathTests.innerHTML = '<div class="warning">⚠️ لا توجد ملفات للاختبار</div>';
                return;
            }

            let html = '<h3>اختبار مسارات الملفات:</h3>';

            files.slice(0, 5).forEach((file, index) => {
                const fileName = file.stored_file_name || file.original_file_name;

                // Test different path patterns
                const pathsToTest = [
                    `http://127.0.0.1:8000/storage/uploads/001447/${fileName}`,
                    `http://127.0.0.1:8000/storage/uploads/001447/images/${fileName}`,
                    `http://127.0.0.1:8000/storage/uploads/001447/documents/${fileName}`,
                    file.download_url
                ];

                html += `
                    <div class="file-item">
                        <div style="flex: 1;">
                            <h4>📄 ${file.original_file_name}</h4>
                            <div><strong>اسم الملف المحفوظ:</strong> ${file.stored_file_name}</div>
                            <div><strong>مسار قاعدة البيانات:</strong> ${file.file_path || 'غير محدد'}</div>

                            <h5>اختبار المسارات:</h5>
                `;

                pathsToTest.forEach((path, pathIndex) => {
                    html += `
                        <div class="path-test">
                            <strong>مسار ${pathIndex + 1}:</strong> ${path}
                            <button onclick="testImagePath('${path}', 'result-${index}-${pathIndex}')" class="btn" style="font-size: 10px; padding: 3px 8px;">اختبار</button>
                            <span id="result-${index}-${pathIndex}"></span>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            pathTests.innerHTML = html;
        }

        async function testImagePath(url, resultId) {
            const resultSpan = document.getElementById(resultId);
            resultSpan.innerHTML = '⏳ جاري الاختبار...';

            try {
                const response = await fetch(url, { method: 'HEAD' });
                if (response.ok) {
                    resultSpan.innerHTML = '<span class="success">✅ موجود</span>';
                } else {
                    resultSpan.innerHTML = `<span class="error">❌ غير موجود (${response.status})</span>`;
                }
            } catch (error) {
                resultSpan.innerHTML = `<span class="error">❌ خطأ: ${error.message}</span>`;
            }
        }

        // Auto-run test on page load
        window.onload = function() {
            console.log('🚀 بدء فحص عرض الصور');
            testFolderAPI();
        };
    </script>
</body>
</html>
