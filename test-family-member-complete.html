<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار نموذج أفراد الأسرة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">اختبار نموذج أفراد الأسرة</h2>

        <!-- محاكاة هيكل familyMember.blade.php -->
        <div class="tab-pane fade show active" id="family-members" role="tabpanel" aria-labelledby="family-members-tab">
            <div class="row g-3">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="card-title mb-0">بيانات أفراد الأسرة</h5>
                            </div>
                            <div id="familyMembersContainer">
                                <!-- نموذج إضافة فرد (مخفي كقالب فقط) -->
                                <div class="family-member-form border rounded p-3 mb-3 d-none" data-member-index="template" id="familyMemberTemplate" data-upload-zone="template">
                                    <div class="row g-3">
                                        <!-- حقول النموذج -->
                                        <div class="col-md-6">
                                            <label class="form-label">الاسم الأول</label>
                                            <input type="text" class="form-control" name="family_members[template][first_name]" placeholder="الاسم الأول">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">اسم العائلة</label>
                                            <input type="text" class="form-control" name="family_members[template][last_name]" placeholder="اسم العائلة">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">رقم الهوية</label>
                                            <input type="text" class="form-control" name="family_members[template][person_id]" placeholder="رقم هوية اليتيم">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">تاريخ الميلاد</label>
                                            <input type="date" class="form-control" name="family_members[template][person_birth_date]">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">الجنس</label>
                                            <select class="form-select" name="family_members[template][person_gender]">
                                                <option value="">اختر الجنس</option>
                                                <option value="male">ذكر</option>
                                                <option value="female">أنثى</option>
                                            </select>
                                        </div>

                                        <!-- قسم رفع الوثائق -->
                                        <div class="col-12">
                                            <label class="form-label">نوع الوثيقة</label>
                                            <select class="form-select mainDocumentTypeSelect">
                                                <option value="">اختر نوع الوثيقة</option>
                                                <option value="id_card">بطاقة هوية</option>
                                                <option value="passport">جواز سفر</option>
                                                <option value="birth_certificate">شهادة ميلاد</option>
                                            </select>
                                        </div>
                                        <div class="col-12">
                                            <input type="file" class="form-control mainDocumentFileInput" accept="image/*,application/pdf" style="display: none;">
                                        </div>
                                        <div class="col-12">
                                            <div class="mainDocumentPreview" style="display: none;"></div>
                                            <div class="mainDocumentNames"></div>
                                        </div>

                                        <!-- حقول مخفية -->
                                        <input type="hidden" name="family_members[template][file_id]" value="12345">
                                        <input type="hidden" name="family_members[template][registration_id]" value="REG2025">
                                    </div>
                                </div>
                            </div>
                            <button type="button" class="btn btn-primary" id="addFamilyMember">
                                <i class="fas fa-plus me-2"></i>إضافة فرد
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- منطقة المراقبة -->
        <div class="mt-4">
            <div class="card">
                <div class="card-header">
                    <h5>مراقبة الحالة</h5>
                </div>
                <div class="card-body">
                    <div id="statusLog" class="bg-light p-3" style="height: 300px; overflow-y: auto;">
                        <div class="text-muted">جاهز للاختبار...</div>
                    </div>
                    <div class="mt-3">
                        <button class="btn btn-secondary btn-sm" onclick="clearLog()">مسح السجل</button>
                        <button class="btn btn-info btn-sm" onclick="checkState()">فحص الحالة</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // إعداد نظام المراقبة
        function log(message, type = 'info') {
            const logDiv = document.getElementById('statusLog');
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            const colorClass = type === 'error' ? 'text-danger' : type === 'success' ? 'text-success' : 'text-primary';
            logDiv.innerHTML += `<div class="${colorClass}"><strong>[${timestamp}]</strong> ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('statusLog').innerHTML = '<div class="text-muted">تم مسح السجل...</div>';
        }

        function checkState() {
            const container = document.getElementById('familyMembersContainer');
            const forms = container.querySelectorAll('.family-member-form:not(.d-none)');
            const template = document.getElementById('familyMemberTemplate');

            log(`📊 الحالة الحالية:`, 'info');
            log(`   - عدد النماذج النشطة: ${forms.length}`, 'info');
            log(`   - القالب موجود: ${template ? 'نعم' : 'لا'}`, template ? 'success' : 'error');
            log(`   - window.allDocs موجود: ${window.allDocs ? 'نعم' : 'لا'}`, window.allDocs ? 'success' : 'error');
            log(`   - addFamilyMember موجود: ${typeof window.addFamilyMember === 'function' ? 'نعم' : 'لا'}`, typeof window.addFamilyMember === 'function' ? 'success' : 'error');
        }

        // تهيئة window.allDocs
        window.allDocs = new Map();
        log('✅ تم تهيئة window.allDocs', 'success');

        // دالة إضافة فرد جديد
        window.addFamilyMember = function addFamilyMember() {
            log('🚀 بدء تنفيذ addFamilyMember', 'info');

            const container = document.getElementById('familyMembersContainer');
            if (!container) {
                log('❌ لم يتم العثور على familyMembersContainer', 'error');
                return;
            }

            let forms = container.querySelectorAll('.family-member-form:not(.d-none)');
            let template = document.getElementById('familyMemberTemplate');

            if (!template) {
                log('❌ لم يتم العثور على familyMemberTemplate', 'error');
                return;
            }

            let newIndex = forms.length;
            log(`📝 إنشاء نموذج جديد برقم: ${newIndex}`, 'info');

            let clone = template.cloneNode(true);
            clone.classList.remove('d-none');
            clone.removeAttribute('id');
            clone.setAttribute('data-member-index', newIndex);

            // تحديث أسماء الحقول والفهارس
            clone.querySelectorAll('[name]').forEach(function(input) {
                const oldName = input.name;
                input.name = input.name.replace(/family_members\[template\]/g, `family_members[${newIndex}]`);
                log(`🔄 تحديث اسم الحقل: ${oldName} → ${input.name}`, 'info');

                if (input.name.endsWith('[file_id]')) {
                    let fileIdInput = template.querySelector('[name$="[file_id]"]');
                    if (fileIdInput) input.value = fileIdInput.value;
                } else if (input.name.endsWith('[registration_id]')) {
                    let regIdInput = template.querySelector('[name$="[registration_id]"]');
                    if (regIdInput) {
                        input.value = regIdInput.value;
                        input.readOnly = true;
                        input.classList.add('bg-secondary', 'bg-opacity-10');
                    }
                } else if (input.type === 'text' || input.type === 'number' || input.type === 'date') {
                    input.value = '';
                } else if (input.tagName === 'SELECT') {
                    input.selectedIndex = 0;
                }
            });

            // تحديث data-upload-zone
            const uploadZone = clone.querySelector('[data-upload-zone]');
            if (uploadZone) {
                uploadZone.setAttribute('data-upload-zone', `family_${newIndex}`);
                log(`📂 تحديث data-upload-zone إلى: family_${newIndex}`, 'info');
            }

            // تحديث معرفات العناصر
            const docType = clone.querySelector('.mainDocumentTypeSelect');
            if (docType) docType.id = `mainDocumentTypeSelect_${newIndex}`;
            const fileInput = clone.querySelector('.mainDocumentFileInput');
            if (fileInput) fileInput.id = `mainDocumentFileInput_${newIndex}`;
            const preview = clone.querySelector('.mainDocumentPreview');
            if (preview) preview.id = `mainDocumentPreview_${newIndex}`;
            const names = clone.querySelector('.mainDocumentNames');
            if (names) names.id = `mainDocumentNames_${newIndex}`;

            // مسح المحتوى السابق
            clone.querySelectorAll('.mainDocumentPreview, .mainDocumentNames').forEach(div => div.innerHTML = '');

            // تهيئة window.allDocs
            if (window.allDocs && window.allDocs instanceof Map) {
                window.allDocs.set(`family_${newIndex}`, []);
                log(`📋 إضافة مفتاح جديد إلى allDocs: family_${newIndex}`, 'success');
            }

            // إضافة header وزر حذف
            let cardHeader = clone.querySelector('.card-header');
            if (!cardHeader) {
                cardHeader = document.createElement('div');
                cardHeader.className = 'card-header bg-gradient-primary text-dark py-3 d-flex justify-content-between align-items-center';
                cardHeader.innerHTML = `
                    <h5 class="card-title mb-0 d-flex align-items-center">
                        <i class="fas fa-user fs-4 me-2"></i>
                        بيانات فرد الأسرة #${newIndex + 1}
                    </h5>
                    <button type="button" class="btn btn-danger btn-sm delete-member">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                clone.insertBefore(cardHeader, clone.firstChild);
                log('🎨 إضافة header وزر حذف', 'info');
            }

            // ربط زر الحذف
            cardHeader.querySelector('.delete-member').onclick = function(e) {
                e.preventDefault();
                const uploadZone = clone.querySelector('[data-upload-zone]');
                const personKey = uploadZone ? uploadZone.getAttribute('data-upload-zone') : `family_${newIndex}`;

                log(`🗑️ محاولة حذف فرد العائلة: ${personKey}`, 'info');

                Swal.fire({
                    title: 'هل أنت متأكد؟',
                    text: 'سيتم حذف هذا الفرد من القائمة مع جميع وثائقه',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#dc3545',
                    cancelButtonColor: '#6c757d',
                    confirmButtonText: 'نعم، احذف',
                    cancelButtonText: 'إلغاء'
                }).then((result) => {
                    if (result.isConfirmed) {
                        log(`✅ تأكيد حذف فرد العائلة: ${personKey}`, 'success');

                        // حذف من window.allDocs
                        if (window.allDocs && window.allDocs instanceof Map && window.allDocs.has(personKey)) {
                            const deletedDocs = window.allDocs.get(personKey);
                            window.allDocs.delete(personKey);
                            log(`🗑️ تم حذف ${deletedDocs.length} وثيقة من allDocs`, 'success');
                        }

                        // تأثير الحذف البصري
                        clone.style.transition = 'all 0.6s ease';
                        clone.style.transform = 'scale(0.8)';
                        clone.style.opacity = '0';

                        setTimeout(() => {
                            clone.remove();
                            window.reindexFamilyMembers();
                            log('✅ تم حذف النموذج وإعادة الفهرسة', 'success');
                        }, 600);
                    }
                });
            };

            container.appendChild(clone);
            log(`✅ تم إضافة النموذج بنجاح: family_${newIndex}`, 'success');

            if (typeof window.reindexFamilyMembers === 'function') {
                window.reindexFamilyMembers();
            }
        };

        // دالة إعادة الفهرسة
        window.reindexFamilyMembers = function reindexFamilyMembers() {
            const forms = document.querySelectorAll('#familyMembersContainer .family-member-form:not(.d-none)');
            log(`🔄 إعادة فهرسة ${forms.length} نموذج`, 'info');

            forms.forEach(function(form, idx) {
                form.setAttribute('data-member-index', idx);

                // تحديث أسماء الحقول
                form.querySelectorAll('[name]').forEach(function(input) {
                    input.name = input.name.replace(/family_members\[\d+\]/g, `family_members[${idx}]`);
                });

                // تحديث data-upload-zone
                const uploadZone = form.querySelector('[data-upload-zone]');
                if (uploadZone) {
                    uploadZone.setAttribute('data-upload-zone', `family_${idx}`);
                }

                // تحديث العنوان
                const header = form.querySelector('.card-header h5');
                if (header) {
                    header.innerHTML = `<i class="fas fa-user fs-4 me-2"></i>بيانات فرد الأسرة #${idx + 1}`;
                }
            });

            log('✅ اكتملت إعادة الفهرسة', 'success');
        };

        // ربط زر إضافة فرد
        document.addEventListener('DOMContentLoaded', function() {
            const addBtn = document.getElementById('addFamilyMember');
            if (addBtn) {
                addBtn.addEventListener('click', function() {
                    log('🖱️ تم الضغط على زر إضافة فرد', 'info');
                    window.addFamilyMember();
                });
                log('✅ تم ربط زر إضافة فرد بنجاح', 'success');
            } else {
                log('❌ لم يتم العثور على زر إضافة فرد', 'error');
            }

            checkState();
        });
    </script>
</body>
</html>
