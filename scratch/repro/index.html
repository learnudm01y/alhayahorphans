<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<link href="bootstrap.css" rel="stylesheet">
<link href="sweetalert2.css" rel="stylesheet">
</head>
<body>
<button type="button" class="btn btn-secondary btn-sm" id="openBtn" data-bs-toggle="modal" data-bs-target="#bulkStatusModal">
    تغيير الحالة
</button>

<div class="modal fade" id="bulkStatusModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="bulkStatusForm">
                <div class="modal-body">
                    <select id="bulk_status_id" class="form-select">
                        <option value="">اختر الحالة</option>
                        <option value="2">منتهية</option>
                    </select>
                    <div class="modal-backdrop-holder"></div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary" id="bulk_status_submit_btn" disabled>تنفيذ</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="stage">placeholder</div>

<script src="jquery.js"></script>
<script src="bootstrap.bundle.js"></script>
<script src="sweetalert2.js"></script>
<script>
function cleanupModalBackdrop() {
    $('.modal-backdrop').remove();
    $('body').removeClass('modal-open');
    $('body').css('padding-right', '');
    $('body').css('overflow', '');
}

function resetBulkStatusPreview() {
    $('#bulk_status_submit_btn').prop('disabled', true);
}

$('#bulkStatusModal').on('show.bs.modal', function() {
    resetBulkStatusPreview();
    $('#bulk_status_id').val('2').trigger('change');
    $('#bulk_status_submit_btn').prop('disabled', false);
});

$('#bulkStatusModal').on('hidden.bs.modal', function() {
    $('#bulkStatusForm')[0].reset();
    resetBulkStatusPreview();
});

$('#bulkStatusForm').on('submit', function(e) {
    e.preventDefault();
    Swal.fire({
        title: 'تغيير حالة الكفالات',
        html: 'النطاق: المعروضون في الشاشة',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'نعم، غيّر الحالة',
        cancelButtonText: 'إلغاء'
    }).then((result) => {
        if (!result.isConfirmed) {
            return;
        }
        // simulated ajax
        setTimeout(function() {
            $('#bulkStatusModal').modal('hide');
            Swal.fire({
                icon: 'success',
                title: 'تم التحديث',
                html: 'السجلات المتأثرة: <strong>10</strong>',
                timer: 3000,
                showConfirmButton: false
            }).then(function() {
                cleanupModalBackdrop();
            });
        }, 300);
    });
});

window.__state = function(label) {
    var el = document.getElementById('bulkStatusModal');
    var inst = bootstrap.Modal.getInstance(el);
    var bd = document.querySelectorAll('.modal-backdrop');
    var dlg = el.querySelector('.modal-dialog');
    var cs = window.getComputedStyle(dlg);
    return {
        label: label,
        modalClasses: el.className,
        modalDisplay: el.style.display,
        modalAriaHidden: el.getAttribute('aria-hidden'),
        backdropCount: bd.length,
        backdropShow: bd.length ? bd[0].className : null,
        bodyClass: document.body.className,
        bodyOverflow: document.body.style.overflow,
        bodyPaddingRight: document.body.style.paddingRight,
        dialogOpacity: cs.opacity,
        dialogTransform: cs.transform,
        isShown: inst ? inst._isShown : null,
        isTransitioning: inst ? inst._isTransitioning : null,
        backdropAppended: inst ? inst._backdrop._isAppended : null,
        swalOpen: !!document.querySelector('.swal2-container'),
        rectTop: el.getBoundingClientRect().top
    };
};
</script>
</body>
</html>
