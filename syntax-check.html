<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Syntax Check</title>
</head>
<body>
    <div id="result"></div>
    <script>
        // Test the fixed JavaScript syntax
        try {
            // Simulate the function that was causing the error
            function checkExcelFiles(files) {
                const hasExcelFiles = files.some(file => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    return ['xlsx', 'xls', 'csv', 'zip', 'rar', '7z'].includes(ext);
                });
                return hasExcelFiles;
            }

            // Test with sample files
            const testFiles = [
                { name: 'test.xlsx' },
                { name: 'document.pdf' },
                { name: 'data.csv' }
            ];

            const result = checkExcelFiles(testFiles);
            document.getElementById('result').innerHTML = `
                <h2 style="color: green;">✅ JavaScript Syntax Fixed!</h2>
                <p>No more "Unexpected identifier 'ext'" error</p>
                <p>Excel files detected: ${result}</p>
                <p>Test completed successfully at ${new Date().toLocaleString()}</p>
            `;
        } catch (error) {
            document.getElementById('result').innerHTML = `
                <h2 style="color: red;">❌ Syntax Error Still Exists</h2>
                <p>Error: ${error.message}</p>
            `;
        }
    </script>
</body>
</html>
