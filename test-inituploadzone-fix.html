<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار إصلاح initUploadZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            background: #f8f9fa;
        }
        .test-section h3 {
            color: #495057;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #dee2e6;
        }
        .log-container {
            background: #000;
            color: #00ff00;
            padding: 15px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-top: 15px;
        }
        .family-member-form {
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .btn-test {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 5px;
        }
        .btn-test:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            color: white;
        }
        .success-indicator {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border: 2px solid #28a745;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            animation: successPulse 2s infinite;
        }
        @keyframes successPulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
        .error-indicator {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            border: 2px solid #dc3545;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            animation: errorPulse 2s infinite;
        }
        @keyframes errorPulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="text-center mb-5">
            <h1 class="display-4 mb-3">
                <i class="fas fa-bug-slash text-primary me-3"></i>
                اختبار إصلاح initUploadZone
            </h1>
            <p class="lead text-muted">
                اختبار شامل لإصلاح مشكلة "initUploadZone is not defined" في نظام أفراد الأسرة
            </p>
        </div>

        <!-- قسم فحص الدوال -->
        <div class="test-section">
            <h3><i class="fas fa-code me-2"></i>فحص توفر الدوال</h3>
            <div class="row">
                <div class="col-md-6">
                    <button class="btn btn-test w-100" onclick="checkFunctionAvailability()">
                        <i class="fas fa-search me-2"></i>فحص توفر الدوال
                    </button>
                </div>
                <div class="col-md-6">
                    <button class="btn btn-test w-100" onclick="testInitUploadZone()">
                        <i class="fas fa-play me-2"></i>اختبار initUploadZone
                    </button>
                </div>
            </div>
            <div id="function-results" class="mt-3"></div>
        </div>

        <!-- قسم محاكاة النماذج -->
        <div class="test-section">
            <h3><i class="fas fa-users me-2"></i>محاكاة نماذج أفراد الأسرة</h3>
            <div class="row">
                <div class="col-md-4">
                    <button class="btn btn-test w-100" onclick="createTestFamilyMember()">
                        <i class="fas fa-plus me-2"></i>إنشاء نموذج اختبار
                    </button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-test w-100" onclick="simulateObserver()">
                        <i class="fas fa-eye me-2"></i>محاكاة Observer
                    </button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-test w-100" onclick="clearTests()">
                        <i class="fas fa-trash me-2"></i>مسح الاختبارات
                    </button>
                </div>
            </div>
            <div id="family-container" class="mt-3"></div>
        </div>

        <!-- قسم السجلات -->
        <div class="test-section">
            <h3><i class="fas fa-terminal me-2"></i>سجل الاختبارات</h3>
            <div class="log-container" id="test-log">
                <div>🚀 [Test System] نظام الاختبار جاهز - انتظار الاختبارات...</div>
            </div>
            <div class="text-center mt-3">
                <button class="btn btn-test" onclick="clearLog()">
                    <i class="fas fa-eraser me-2"></i>مسح السجل
                </button>
            </div>
        </div>
    </div>

    <script>
        // نظام السجلات
        function log(message, type = 'info') {
            const logContainer = document.getElementById('test-log');
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';

            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<span style="color: #666">[${timestamp}]</span> ${icon} ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function clearLog() {
            const logContainer = document.getElementById('test-log');
            logContainer.innerHTML = '<div>🚀 [Test System] تم مسح السجل...</div>';
        }

        // تهيئة window.allDocs
        if (!window.allDocs) {
            window.allDocs = new Map();
            log('تم تهيئة window.allDocs', 'success');
        }

        // محاكاة الدوال المطلوبة
        window.setupDocumentUploadHandlersForMember = function(form, idx) {
            log(`تم استدعاء setupDocumentUploadHandlersForMember للنموذج ${idx}`, 'success');
            form._familyUploadHandlersInitialized = true;
            return true;
        };

        // محاكاة initUploadZone من familyMember.blade.php
        window.initUploadZone = function(zone) {
            log(`🔧 [initUploadZone] استدعاء الدالة لمنطقة: ${zone ? zone.getAttribute('data-upload-zone') : 'غير محدد'}`, 'info');

            const personKey = zone ? zone.getAttribute('data-upload-zone') : '';
            if (!personKey || personKey.includes('template') || personKey === '') {
                log(`⚠️ [initUploadZone] تجاهل تهيئة منطقة رفع بقيمة template أو فارغة: ${personKey}`, 'warning');
                return;
            }

            log(`🔧 [initUploadZone] تهيئة منطقة رفع محلية للبوابة: ${personKey}`, 'info');

            // البحث عن النموذج المحتوي لهذه المنطقة
            const form = zone.closest('.family-member-form');
            if (!form) {
                log(`⚠️ [initUploadZone] لم يتم العثور على نموذج للبوابة: ${personKey}`, 'warning');
                return;
            }

            // استخراج فهرس النموذج
            const memberIndex = form.getAttribute('data-member-index');
            if (!memberIndex || memberIndex === 'template') {
                log(`⚠️ [initUploadZone] لم يتم العثور على فهرس صالح للنموذج: ${personKey}`, 'warning');
                return;
            }

            // تحويل إلى رقم للاستخدام مع النظام المحلي
            const formIndex = parseInt(memberIndex, 10);
            if (!isNaN(formIndex) && typeof window.setupDocumentUploadHandlersForMember === 'function') {
                log(`🔧 [initUploadZone] استخدام النظام المحلي المتطور للنموذج: ${formIndex}`, 'info');

                // التأكد من عدم التكرار
                if (!form._familyUploadHandlersInitialized) {
                    window.setupDocumentUploadHandlersForMember(form, formIndex);
                    zone.dataset.initialized = 'true';
                    log(`✅ [initUploadZone] تم تهيئة البوابة بنجاح: ${personKey}`, 'success');
                } else {
                    log(`ℹ️ [initUploadZone] البوابة مهيأة مسبقاً: ${personKey}`, 'info');
                }
            } else {
                log(`❌ [initUploadZone] دالة setupDocumentUploadHandlersForMember غير متوفرة أو فهرس غير صالح`, 'error');
            }
        };

        // فحص توفر الدوال
        function checkFunctionAvailability() {
            log('🔍 [Function Check] بدء فحص توفر الدوال...', 'info');

            const results = document.getElementById('function-results');
            let resultsHTML = '';

            const functions = [
                { name: 'window.initUploadZone', func: window.initUploadZone },
                { name: 'window.setupDocumentUploadHandlersForMember', func: window.setupDocumentUploadHandlersForMember },
                { name: 'window.allDocs', func: window.allDocs },
                { name: 'window.addFamilyMember', func: window.addFamilyMember }
            ];

            functions.forEach(item => {
                const available = typeof item.func !== 'undefined';
                const status = available ? 'success' : 'error';
                const icon = available ? '✅' : '❌';

                resultsHTML += `
                    <div class="alert alert-${available ? 'success' : 'danger'} d-flex align-items-center mb-2">
                        <span class="me-2">${icon}</span>
                        <strong>${item.name}:</strong> ${available ? 'متوفرة' : 'غير متوفرة'}
                    </div>
                `;

                log(`${icon} ${item.name}: ${available ? 'متوفرة' : 'غير متوفرة'}`, status);
            });

            results.innerHTML = resultsHTML;
            log('✅ [Function Check] اكتمل فحص الدوال', 'success');
        }

        // اختبار initUploadZone
        function testInitUploadZone() {
            log('🧪 [Test initUploadZone] بدء اختبار initUploadZone...', 'info');

            // إنشاء منطقة اختبار وهمية
            const testZone = document.createElement('div');
            testZone.setAttribute('data-upload-zone', 'family_0');
            testZone.innerHTML = `
                <div class="family-member-form" data-member-index="0">
                    <h5>نموذج اختبار - فرد الأسرة 0</h5>
                    <p>منطقة اختبار لـ initUploadZone</p>
                </div>
            `;

            // إضافة إلى الصفحة مؤقتاً
            document.body.appendChild(testZone);

            try {
                // محاولة استدعاء initUploadZone
                if (typeof window.initUploadZone === 'function') {
                    window.initUploadZone(testZone);
                    log('✅ [Test initUploadZone] نجح استدعاء initUploadZone', 'success');
                } else {
                    log('❌ [Test initUploadZone] دالة initUploadZone غير متوفرة', 'error');
                }
            } catch (error) {
                log(`❌ [Test initUploadZone] خطأ: ${error.message}`, 'error');
            } finally {
                // إزالة منطقة الاختبار
                document.body.removeChild(testZone);
                log('🧹 [Test initUploadZone] تم تنظيف منطقة الاختبار', 'info');
            }
        }

        // إنشاء نموذج اختبار
        function createTestFamilyMember() {
            log('👥 [Create Test] إنشاء نموذج اختبار...', 'info');

            const container = document.getElementById('family-container');
            const memberCount = container.querySelectorAll('.family-member-form').length;

            const testForm = document.createElement('div');
            testForm.className = 'family-member-form';
            testForm.setAttribute('data-member-index', memberCount);
            testForm.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5><i class="fas fa-user me-2"></i>نموذج اختبار - فرد ${memberCount}</h5>
                    <button class="btn btn-danger btn-sm" onclick="removeTestMember(this)">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
                <div data-upload-zone="family_${memberCount}" class="border p-3 rounded">
                    <p class="text-muted mb-0">منطقة رفع: family_${memberCount}</p>
                    <p class="text-muted mb-0">حالة التهيئة: <span class="badge bg-warning">غير مهيأة</span></p>
                </div>
            `;

            container.appendChild(testForm);
            log(`✅ [Create Test] تم إنشاء نموذج اختبار رقم ${memberCount}`, 'success');
        }

        // محاكاة Observer
        function simulateObserver() {
            log('👁️ [Observer Test] محاكاة Observer...', 'info');

            const zones = document.querySelectorAll('[data-upload-zone]');
            let successCount = 0;
            let errorCount = 0;

            zones.forEach(zone => {
                const personKey = zone.getAttribute('data-upload-zone');
                if (personKey && !personKey.includes('template')) {
                    try {
                        log(`🔄 [Observer] معالجة منطقة: ${personKey}`, 'info');

                        if (typeof window.initUploadZone === 'function') {
                            window.initUploadZone(zone);
                            successCount++;

                            // تحديث حالة التهيئة في الواجهة
                            const badge = zone.querySelector('.badge');
                            if (badge) {
                                badge.className = 'badge bg-success';
                                badge.textContent = 'مهيأة';
                            }
                        } else {
                            throw new Error('initUploadZone غير متوفرة');
                        }
                    } catch (error) {
                        log(`❌ [Observer] خطأ في معالجة ${personKey}: ${error.message}`, 'error');
                        errorCount++;
                    }
                }
            });

            log(`📊 [Observer Test] النتائج: ${successCount} نجح، ${errorCount} فشل`,
                errorCount > 0 ? 'warning' : 'success');
        }

        // إزالة نموذج اختبار
        function removeTestMember(button) {
            const form = button.closest('.family-member-form');
            const memberIndex = form.getAttribute('data-member-index');
            log(`🗑️ [Remove Test] إزالة النموذج ${memberIndex}`, 'info');
            form.remove();
        }

        // مسح جميع الاختبارات
        function clearTests() {
            const container = document.getElementById('family-container');
            container.innerHTML = '';
            log('🧹 [Clear Tests] تم مسح جميع نماذج الاختبار', 'info');
        }

        // فحص أولي عند تحميل الصفحة
        window.addEventListener('load', function() {
            log('🚀 [Page Load] تم تحميل الصفحة، بدء الفحص الأولي...', 'info');
            setTimeout(() => {
                checkFunctionAvailability();
            }, 500);
        });
    </script>
</body>
</html>
