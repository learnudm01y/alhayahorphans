<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a8b8b">
    <title>مراجعة التكرارات - v4</title>
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="header">
        <h1>مراجعة التكرارات المحتملة</h1>
        <div class="sub">Conflict Review Queue · <span id="mode-badge" class="badge badge-offline">Offline</span></div>
    </div>

    <nav class="nav-tabs container" style="margin-top:12px">
        <a href="../admin/dashboard.html">لوحة القيادة</a>
        <a href="../admin/sponsorships.html">الكفالات</a>
        <a href="../admin/reports.html">التقارير</a>
        <a href="../admin/permissions.html">الصلاحيات</a>
        <a href="../admin/files.html">الملفات</a>
        <a href="../admin/civil-registry.html">السجل المدني</a>
        <a href="conflict-review.html" class="active">مراجعة التكرارات</a>
        <a href="sync-health.html">صحة المزامنة</a>
    </nav>

    <div class="container">
        <div class="toolbar">
            <select id="status">
                <option value="open">مفتوحة</option>
                <option value="resolved">محسوسة</option>
                <option value="all">الكل</option>
            </select>
            <button class="btn" id="btn-load">تحديث</button>
            <span class="badge badge-info" id="total">0</span>
        </div>
        <div id="list"><div class="empty" id="msg">جاري التحميل…</div></div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/sync-client-v4.js"></script>
    <script src="../js/admin-api.js"></script>
    <script src="../js/crud-helper.js"></script>
    <script src="../js/admin-nav.js"></script>
    <script>
    AdminNav.mount('conflicts');
    (function () {
        function toast(m) {
            var t = document.getElementById('toast');
            t.textContent = m; t.style.display = 'block';
            setTimeout(function () { t.style.display = 'none'; }, 3500);
        }
        function setBadge() {
            var b = document.getElementById('mode-badge');
            if (navigator.onLine) { b.textContent = 'Online'; b.className = 'badge badge-ok'; }
            else { b.textContent = 'Offline'; b.className = 'badge badge-offline'; }
        }
        window.addEventListener('online', setBadge);
        window.addEventListener('offline', setBadge);
        setBadge();

        function sideHtml(label, obj) {
            if (!obj || typeof obj !== 'object') {
                return '<div class="side"><h4>' + label + '</h4>—</div>';
            }
            var html = '<div class="side"><h4>' + label + '</h4>';
            var keys = Object.keys(obj).slice(0, 10);
            keys.forEach(function (k) {
                var v = obj[k];
                if (v == null || typeof v === 'object') return;
                html += '<div><strong>' + k + ':</strong> ' + String(v) + '</div>';
            });
            html += '</div>';
            return html;
        }

        function load() {
            var status = document.getElementById('status').value;
            if (!window.SyncClientV4) {
                document.getElementById('msg').textContent = 'Bridge غير متاح.';
                return;
            }
            SyncClientV4.getConflicts(status).then(function (res) {
                var items = (res && res.data) || [];
                document.getElementById('total').textContent = (res && res.total) || items.length;
                if (res && res.offline) toast('وضع Offline — عرض آخر نسخة مخزّنة');
                if (!items.length) {
                    document.getElementById('list').innerHTML =
                        '<div class="empty">لا توجد تعارضات بهذه الحالة ✓</div>';
                    return;
                }
                var html = '';
                items.forEach(function (it) {
                    var incoming = {};
                    try { incoming = JSON.parse(it.incoming_payload_json || '{}'); } catch (e) {}
                    html += '<div class="conflict-card" data-id="' + it.id + '">' +
                        '<div class="meta">#' + it.id + ' · ' + (it.entity_type || '') +
                        ' · سبب: ' + (it.match_reason || '—') +
                        ' · ثقة: ' + (it.match_confidence != null ? it.match_confidence + '%' : '—') +
                        ' · مصدر: ' + (it.incoming_source || '—') +
                        ' · ' + (it.status || '') + '</div>' +
                        '<div class="compare">' +
                        sideHtml('السجل الموجود (existing #' + it.existing_record_id + ')',
                            { client_uuid: it.existing_record_uuid, id: it.existing_record_id }) +
                        sideHtml('السجل الوارد (incoming)', incoming) +
                        '</div>' +
                        (it.status === 'open' ?
                            '<div class="conflict-actions">' +
                            '<button class="btn btn-sm" data-act="merge">دمج</button>' +
                            '<button class="btn btn-sm btn-outline" data-act="keep_both">إبقاء كحالتين</button>' +
                            '<button class="btn btn-sm btn-danger" data-act="reject_incoming">تجاهل الوارد</button>' +
                            '</div>' : '<span class="badge badge-ok">محسوس</span>') +
                        '</div>';
                });
                document.getElementById('list').innerHTML = html;

                document.querySelectorAll('.conflict-card button[data-act]').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        if (!navigator.onLine) {
                            toast('الحسم يتطلب اتصالاً — لا دمج تلقائي offline');
                            return;
                        }
                        var card = btn.closest('.conflict-card');
                        var id = card.dataset.id;
                        btn.disabled = true;
                        SyncClientV4.resolveConflict(id, btn.dataset.act, 'من شاشة المراجعة v4')
                            .then(function (r) {
                                if (r && r.success) {
                                    toast('تم الحسم ✓');
                                    load();
                                } else {
                                    btn.disabled = false;
                                    toast((r && r.message) || 'فشل الحسم');
                                }
                            }).catch(function () {
                                btn.disabled = false;
                                toast('خطأ في الشبكة');
                            });
                    });
                });
            }).catch(function (e) {
                document.getElementById('list').innerHTML =
                    '<div class="empty">خطأ: ' + e.message + '</div>';
            });
        }

        document.getElementById('btn-load').addEventListener('click', load);
        document.getElementById('status').addEventListener('change', load);
        document.addEventListener('DOMContentLoaded', load);
    })();
    </script>
</body>
</html>
