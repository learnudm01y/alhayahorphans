<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a8b8b">
    <title>البحث الشامل - v4</title>
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/material-icons.css">
</head>
<body>
    <div class="header">
        <h1>البحث الشامل</h1>
        <div class="sub">متعدد الأنواع + فلاتر · v4 · <span id="mode-badge" class="badge badge-offline">Offline</span></div>
    </div>

    <nav class="nav-tabs container" style="margin-top:12px">
        <a href="dashboard.html">لوحة القيادة</a>
        <a href="records.html">السجلات</a>
        <a href="search-records.html" class="active">البحث الشامل</a>
        <a href="categories.html">التصنيفات</a>
        <a href="sponsorships.html">الكفالات</a>
        <a href="civil-registry.html">السجل المدني</a>
    </nav>

    <div class="container">
        <div class="toolbar">
            <input type="search" id="q" placeholder="اكتب للبحث… (اسم، هوية، رقم ملف)" autocomplete="off" />
            <button class="btn" id="btn-search">بحث</button>
            <button class="btn btn-outline" id="btn-clear">مسح</button>
        </div>

        <div class="filter-chips" id="type-chips">
            <button class="chip active" data-type="all">الكل</button>
            <button class="chip" data-type="main">الرئيسية</button>
            <button class="chip" data-type="family">أفراد الأسرة</button>
            <button class="chip" data-type="deceased">الوفيات</button>
        </div>

        <div class="card" style="margin-bottom:14px">
            <div style="font-size:13px;font-weight:700;margin-bottom:10px;color:var(--brand-700)">
                فلاتر متقدمة
                <button class="btn btn-sm btn-outline" id="btn-toggle-filters" style="margin-right:8px">إظهار/إخفاء</button>
            </div>
            <div id="filters-panel" class="v4-form" style="display:none">
                <div class="form-row">
                    <div class="form-group">
                        <label>القسم</label>
                        <select id="f-section"><option value="">الكل</option></select>
                    </div>
                    <div class="form-group">
                        <label>المدينة</label>
                        <select id="f-city"><option value="">الكل</option></select>
                    </div>
                    <div class="form-group">
                        <label>المحافظة</label>
                        <select id="f-province"><option value="">الكل</option></select>
                    </div>
                    <div class="form-group">
                        <label>الجنس</label>
                        <select id="f-gender">
                            <option value="">الكل</option>
                            <option value="M">ذكر</option>
                            <option value="F">أنثى</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>الحالة الاجتماعية</label>
                        <select id="f-marital"><option value="">الكل</option></select>
                    </div>
                    <div class="form-group">
                        <label>الحالة الصحية</label>
                        <select id="f-health"><option value="">الكل</option></select>
                    </div>
                    <div class="form-group">
                        <label>حالة الطلب</label>
                        <select id="f-status"><option value="">الكل</option></select>
                    </div>
                    <div class="form-group">
                        <label>الصلة القرابة</label>
                        <select id="f-relation"><option value="">الكل</option></select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>من تاريخ</label>
                        <input type="date" id="f-from" />
                    </div>
                    <div class="form-group">
                        <label>إلى تاريخ</label>
                        <input type="date" id="f-to" />
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn" id="btn-apply-filters">تطبيق الفلاتر</button>
                    <button class="btn btn-outline" id="btn-reset-filters">إعادة ضبط</button>
                </div>
            </div>
        </div>

        <div class="stats-inline">
            <span class="s">النتائج: <b id="total">0</b></span>
            <span class="s">زمن البحث: <b id="took">—</b></span>
            <span class="s">النوع: <b id="type-label">الكل</b></span>
        </div>

        <div id="results"><div class="empty" id="msg">ابدأ الكتابة واضغط بحث.</div></div>
        <div id="pager"></div>
        <div class="watermark" id="wm"></div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/admin-api.js"></script>
    <script src="../js/crud-helper.js"></script>
    <script src="../js/admin-nav.js"></script>
    <script>
    AdminNav.mount('search');
    (function () {
        var searchType = 'all', page = 1;
        CrudHelper.setOnlineBadge();

        // Suggestions (debounced)
        var sugTimer = null;
        document.getElementById('q').addEventListener('input', function () {
            var v = this.value.trim();
            clearTimeout(sugTimer);
            if (v.length < 2) return;
            sugTimer = setTimeout(function () {
                AdminAPI.searchSuggestions(v).then(function (res) {
                    // non-blocking: suggestions could be rendered as datalist
                    var list = (res && res.suggestions) || [];
                    if (!list.length) return;
                    var dl = document.getElementById('sug-dl');
                    if (!dl) {
                        dl = document.createElement('datalist');
                        dl.id = 'sug-dl';
                        document.body.appendChild(dl);
                        document.getElementById('q').setAttribute('list', 'sug-dl');
                    }
                    dl.innerHTML = list.map(function (s) {
                        return '<option value="' + String(s).replace(/"/g, '&quot;') + '">';
                    }).join('');
                }).catch(function () {});
            }, 300);
        });

        document.getElementById('btn-toggle-filters').addEventListener('click', function () {
            var p = document.getElementById('filters-panel');
            p.style.display = p.style.display === 'none' ? 'flex' : 'none';
        });

        // Load filter options from categories
        function fillFilter(id, catKey) {
            AdminAPI.getCategories(catKey, {}).then(function (res) {
                var rows = (res && (res.data || res.rows)) || [];
                var sel = document.getElementById(id);
                rows.forEach(function (r) {
                    var o = document.createElement('option');
                    o.value = r.id;
                    o.textContent = r.name || r.description;
                    sel.appendChild(o);
                });
            }).catch(function () {});
        }
        document.addEventListener('DOMContentLoaded', function () {
            fillFilter('f-section', 'general_category');
            fillFilter('f-city', 'city');
            fillFilter('f-province', 'provinces');
            fillFilter('f-marital', 'marital_status');
            fillFilter('f-health', 'health_statuses');
            fillFilter('f-status', 'request_status');
            fillFilter('f-relation', 'category_of_relations');
        });

        function collectFilters() {
            return {
                q: document.getElementById('q').value.trim(),
                type: searchType,
                page: page,
                section: document.getElementById('f-section').value,
                city: document.getElementById('f-city').value,
                province: document.getElementById('f-province').value,
                gender: document.getElementById('f-gender').value,
                marital: document.getElementById('f-marital').value,
                health: document.getElementById('f-health').value,
                status: document.getElementById('f-status').value,
                relation: document.getElementById('f-relation').value,
                from: document.getElementById('f-from').value,
                to: document.getElementById('f-to').value
            };
        }

        function doSearch() {
            var filters = collectFilters();
            document.getElementById('msg').textContent = 'جاري البحث…';
            document.getElementById('type-label').textContent =
                document.querySelector('#type-chips .chip.active').textContent;
            var t0 = performance.now();
            AdminAPI.search(filters).then(function (res) {
                var rows = (res && (res.data || res.results || res.rows)) || [];
                var took = ((performance.now() - t0) / 1000).toFixed(2);
                document.getElementById('took').textContent = took + ' ث';
                document.getElementById('total').textContent =
                    (res && res.total != null) ? res.total : rows.length;
                document.getElementById('wm').textContent =
                    res && res.offline ? 'وضع Offline — نتائج من الفهرس المحلي.' : '';

                if (!rows.length) {
                    document.getElementById('results').innerHTML =
                        '<div class="empty"><span class="material-icons">search_off</span><br>لا نتائج مطابقة.</div>';
                    return;
                }

                var html = '';
                rows.forEach(function (r) {
                    var name = r.data_first_name
                        ? [r.data_first_name, r.data_father_name, r.data_family_name].filter(Boolean).join(' ')
                        : (r.person_name || r.orphan_name || r.name || '—');
                    var idn = r.data_id_number || r.identity_number || r.person_id || '—';
                    var fid = r.file_id_number || r.registration_id || '—';
                    var extra = r.match_reason
                        ? '<span class="badge badge-info">' + r.match_reason + '</span>'
                        : (r.table || r.source || '');
                    html += '<div class="search-result">' +
                        '<h4>' + name + '</h4>' +
                        '<div class="meta">رقم الملف: ' + fid + ' · الهوية: ' + idn +
                        (extra ? ' · ' + extra : '') + '</div>' +
                        (r._snippet ? '<div class="meta">' + r._snippet + '</div>' : '') +
                        '<div class="row-actions" style="margin-top:8px">' +
                        (fid && fid !== '—'
                            ? '<a class="btn btn-sm btn-outline" href="record-show.html?id=' + encodeURIComponent(fid) + '" style="text-decoration:none">عرض</a>'
                            : '') +
                        '</div></div>';
                });
                document.getElementById('results').innerHTML = html;

                var tp = (res && res.total_pages) || 1;
                CrudHelper.renderPagination(document.getElementById('pager'), page, tp, function (p) {
                    page = p; doSearch();
                });
            }).catch(function (e) {
                document.getElementById('results').innerHTML =
                    '<div class="empty">خطأ: ' + e.message + '</div>';
            });
        }

        document.getElementById('btn-search').addEventListener('click', function () {
            page = 1; doSearch();
        });
        document.getElementById('q').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { page = 1; doSearch(); }
        });
        document.getElementById('btn-clear').addEventListener('click', function () {
            document.getElementById('q').value = '';
            document.getElementById('results').innerHTML =
                '<div class="empty">ابدأ الكتابة واضغط بحث.</div>';
            document.getElementById('total').textContent = '0';
        });
        document.getElementById('btn-apply-filters').addEventListener('click', function () {
            page = 1; doSearch();
        });
        document.getElementById('btn-reset-filters').addEventListener('click', function () {
            document.querySelectorAll('#filters-panel select').forEach(function (s) { s.value = ''; });
            document.querySelectorAll('#filters-panel input[type=date]').forEach(function (i) { i.value = ''; });
            page = 1; doSearch();
        });
        document.querySelectorAll('#type-chips .chip').forEach(function (chip) {
            chip.addEventListener('click', function () {
                document.querySelectorAll('#type-chips .chip').forEach(function (c) { c.classList.remove('active'); });
                chip.classList.add('active');
                searchType = chip.dataset.type;
                page = 1;
                doSearch();
            });
        });
    })();
    </script>
</body>
</html>
