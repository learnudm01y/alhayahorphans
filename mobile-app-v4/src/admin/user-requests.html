<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a8b8b">
    <title>طلبات المستخدمين - v4</title>
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/material-icons.css">
</head>
<body>
    <div class="header">
        <h1>إدارة طلبات المستخدمين</h1>
        <div class="sub">User Requests · v4 · <span id="mode-badge" class="badge badge-offline">Offline</span></div>
    </div>

    <nav class="nav-tabs container" style="margin-top:12px">
        <a href="dashboard.html">لوحة القيادة</a>
        <a href="records.html">السجلات</a>
        <a href="user-requests.html" class="active">طلبات المستخدمين</a>
        <a href="search-records.html">البحث الشامل</a>
        <a href="reports.html">التقارير</a>
    </nav>

    <div class="container">
        <div class="filter-chips" id="st-chips">
            <button class="chip active" data-st="">الكل</button>
            <button class="chip" data-st="1">جديد</button>
            <button class="chip" data-st="2">قيد المراجعة</button>
            <button class="chip" data-st="3">مقبول</button>
            <button class="chip" data-st="4">مرفوض</button>
        </div>

        <div class="toolbar">
            <input type="search" id="q" placeholder="بحث…" />
            <button class="btn" id="btn-search">بحث</button>
        </div>

        <div class="section-title">الطلبات <span class="badge badge-info" id="row-count">0</span></div>
        <div id="table-wrap"><div class="empty" id="msg">جاري التحميل…</div></div>
        <div id="pager"></div>
        <div class="watermark" id="wm"></div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/admin-api.js"></script>
    <script src="../js/crud-helper.js"></script>
    <script src="../js/admin-nav.js"></script>
    <script>
    AdminNav.mount('user-requests');
    (function () {
        var page = 1, status = '';
        CrudHelper.setOnlineBadge();

        var STATUS_MAP = {
            1: { label: 'جديد', cls: 'badge-info' },
            2: { label: 'قيد المراجعة', cls: 'badge-warn' },
            3: { label: 'مقبول', cls: 'badge-ok' },
            4: { label: 'مرفوض', cls: 'badge-err' }
        };

        var columns = [
            { key: 'id', label: '#' },
            { key: 'data_first_name', label: 'الاسم' },
            { key: 'data_id_number', label: 'الهوية' },
            { key: 'file_id_number', label: 'رقم الملف' },
            {
                key: 'data_request_status', label: 'الحالة', render: function (v) {
                    var s = STATUS_MAP[v] || { label: v || '—', cls: 'badge-info' };
                    return '<span class="badge ' + s.cls + '">' + s.label + '</span>';
                }
            },
            { key: 'created_at', label: 'التاريخ', render: function (v) { return v ? String(v).substring(0, 10) : '—'; } }
        ];

        function load() {
            AdminAPI.getUserRequests({
                q: document.getElementById('q').value.trim(),
                status: status,
                page: page
            }).then(function (res) {
                var rows = (res && (res.data || res.rows)) || [];
                document.getElementById('row-count').textContent =
                    (res && res.total != null) ? res.total : rows.length;
                document.getElementById('wm').textContent =
                    res && res.offline ? 'وضع Offline.' : '';

                CrudHelper.renderTable(document.getElementById('table-wrap'), columns, rows, {
                    emptyText: 'لا طلبات.',
                    actions: {
                        view: function (row) {
                            if (row.file_id_number) {
                                location.href = 'record-show.html?id=' + encodeURIComponent(row.file_id_number);
                            }
                        },
                        edit: function (row) { changeStatus(row); }
                    }
                });
                CrudHelper.renderPagination(document.getElementById('pager'), page,
                    (res && res.total_pages) || 1, function (p) { page = p; load(); });
            }).catch(function (e) {
                document.getElementById('table-wrap').innerHTML =
                    '<div class="empty">خطأ: ' + e.message + '</div>';
            });
        }

        function changeStatus(row) {
            var host = document.createElement('div');
            CrudHelper.renderForm(host, [
                {
                    name: 'status', label: 'حالة الطلب', type: 'select', required: true,
                    options: [
                        { value: 1, label: 'جديد' },
                        { value: 2, label: 'قيد المراجعة' },
                        { value: 3, label: 'مقبول' },
                        { value: 4, label: 'مرفوض' }
                    ]
                },
                { name: 'notes', label: 'ملاحظات', type: 'textarea' }
            ], { status: row.data_request_status || 1 }, function (data) {
                AdminAPI.changeUserRequestStatus(row.id, data.status).then(function (r) {
                    if (r && r.success) {
                        CrudHelper.toast('تم تحديث الحالة ✓', 'success');
                        modal.hide();
                        load();
                    } else {
                        CrudHelper.toast((r && r.message) || 'فشل', 'error');
                    }
                }).catch(function () {
                    CrudHelper.toast('يتطلب اتصالاً', 'error');
                });
            });
            var modal = CrudHelper.showModal('تغيير حالة الطلب #' + row.id, host, [
                { label: 'إلغاء', onClick: function (h) { h(); } }
            ]);
        }

        document.getElementById('btn-search').addEventListener('click', function () {
            page = 1; load();
        });
        document.querySelectorAll('#st-chips .chip').forEach(function (chip) {
            chip.addEventListener('click', function () {
                document.querySelectorAll('#st-chips .chip').forEach(function (c) { c.classList.remove('active'); });
                chip.classList.add('active');
                status = chip.dataset.st;
                page = 1;
                load();
            });
        });
        document.addEventListener('DOMContentLoaded', load);
    })();
    </script>
</body>
</html>
