<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a8b8b">
    <title>الملف الشخصي - v4</title>
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/material-icons.css">
</head>
<body>
    <div class="header">
        <h1>الملف الشخصي</h1>
        <div class="sub">Profile · v4 · <span id="mode-badge" class="badge badge-offline">Offline</span></div>
    </div>

    <nav class="nav-tabs container" style="margin-top:12px">
        <a href="dashboard.html">لوحة القيادة</a>
        <a href="profile.html" class="active">الملف الشخصي</a>
        <a href="settings.html">الإعدادات</a>
        <a href="users.html">المستخدمون</a>
    </nav>

    <div class="container">
        <div class="card" style="text-align:center;margin-bottom:16px">
            <div style="width:80px;height:80px;border-radius:50%;background:var(--brand-100);margin:0 auto 10px;display:flex;align-items:center;justify-content:center">
                <span class="material-icons" style="font-size:40px;color:var(--brand-700)">account_circle</span>
            </div>
            <div id="p-name" style="font-weight:700;font-size:18px">—</div>
            <div id="p-email" style="color:var(--ink-3);font-size:13px">—</div>
            <div id="p-roles" style="margin-top:6px"></div>
        </div>

        <div class="section-title">البيانات الشخصية</div>
        <div id="profile-form"></div>

        <div class="section-title" style="margin-top:20px">تغيير كلمة المرور</div>
        <div id="pw-form"></div>

        <div class="watermark" id="wm"></div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/admin-api.js"></script>
    <script src="../js/crud-helper.js"></script>
    <script src="../js/admin-nav.js"></script>
    <script>
    AdminNav.mount('profile');
    (function () {
        CrudHelper.setOnlineBadge();

        var profileFields = [
            { name: 'name', label: 'الاسم', required: true },
            { name: 'email', label: 'البريد الإلكتروني', type: 'email', required: true },
            { name: 'phone', label: 'الهاتف' },
            { name: 'phone2', label: 'هاتف بديل' },
            { name: 'country', label: 'الدولة' }
        ];

        var pwFields = [
            { name: 'current_password', label: 'كلمة المرور الحالية', type: 'password', required: true },
            { name: 'password', label: 'كلمة المرور الجديدة', type: 'password', required: true },
            { name: 'password_confirmation', label: 'تأكيد كلمة المرور', type: 'password', required: true }
        ];

        function load() {
            var cached = CrudHelper.cacheGet('profile');
            if (cached) render(cached);
            AdminAPI.http('GET', '/mobile/v4/profile').then(function (res) {
                var p = (res && res.data) || res || {};
                CrudHelper.cacheSet('profile', p);
                render(p);
            }).catch(function () {
                if (!cached) {
                    document.getElementById('profile-form').innerHTML =
                        '<div class="empty">يتطلب اتصالاً لتحميل الملف لأول مرة.</div>';
                }
            });
        }

        function render(p) {
            document.getElementById('p-name').textContent = p.name || '—';
            document.getElementById('p-email').textContent = p.email || '—';
            var roles = p.roles || [];
            document.getElementById('p-roles').innerHTML = roles.map(function (r) {
                return '<span class="badge badge-info">' + r + '</span>';
            }).join(' ');
            document.getElementById('wm').textContent =
                'معرف المستخدم: ' + (p.id || '—');

            CrudHelper.renderForm(document.getElementById('profile-form'), profileFields, p, function (data) {
                AdminAPI.updateProfile(data).then(function (r) {
                    if (r && r.success) CrudHelper.toast('تم التحديث ✓', 'success');
                    else CrudHelper.toast((r && r.message) || 'فشل', 'error');
                }).catch(function () {
                    CrudHelper.toast('يتطلب اتصالاً', 'error');
                });
            });

            CrudHelper.renderForm(document.getElementById('pw-form'), pwFields, {}, function (data) {
                if (data.password !== data.password_confirmation) {
                    CrudHelper.toast('كلمتا المرور غير متطابقتين', 'error');
                    return;
                }
                AdminAPI.updatePassword(data).then(function (r) {
                    if (r && r.success) {
                        CrudHelper.toast('تم تغيير كلمة المرور ✓', 'success');
                    } else {
                        CrudHelper.toast((r && r.message) || 'فشل', 'error');
                    }
                }).catch(function () {
                    CrudHelper.toast('يتطلب اتصالاً', 'error');
                });
            });
        }

        document.addEventListener('DOMContentLoaded', load);
    })();
    </script>
</body>
</html>
