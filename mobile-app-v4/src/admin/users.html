<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a8b8b">
    <title>المستخدمون - v4</title>
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/material-icons.css">
</head>
<body>
    <div class="header">
        <h1>إدارة المستخدمين</h1>
        <div class="sub">Authorization · v4 · <span id="mode-badge" class="badge badge-offline">Offline</span></div>
    </div>

    <nav class="nav-tabs container" style="margin-top:12px">
        <a href="dashboard.html">لوحة القيادة</a>
        <a href="permissions.html">Manifest</a>
        <a href="users.html" class="active">المستخدمون</a>
        <a href="roles.html">الأدوار</a>
        <a href="files.html">الملفات</a>
        <a href="reports.html">التقارير</a>
    </nav>

    <div class="container">
        <div class="filter-chips" id="role-chips">
            <button class="chip active" data-role="admin">الإداريون</button>
            <button class="chip" data-role="user">المستخدمون العاديون</button>
        </div>

        <div class="toolbar">
            <button class="btn" id="btn-new">+ إنشاء مستخدم</button>
            <input type="search" id="q" placeholder="بحث بالاسم أو البريد…" />
            <button class="btn btn-outline" id="btn-search">بحث</button>
        </div>

        <div class="section-title">المستخدمون <span class="badge badge-info" id="row-count">0</span></div>
        <div id="table-wrap"><div class="empty" id="msg">جاري التحميل…</div></div>
        <div id="pager"></div>
        <div class="watermark" id="wm"></div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/admin-api.js"></script>
    <script src="../js/crud-helper.js"></script>
    <script src="../js/admin-nav.js"></script>
    <script>
    AdminNav.mount('users');
    (function () {
        var page = 1, roleFilter = 'admin';
        CrudHelper.setOnlineBadge();

        var columns = [
            { key: 'id', label: '#' },
            { key: 'name', label: 'الاسم' },
            { key: 'email', label: 'البريد' },
            {
                key: 'roles', label: 'الأدوار', render: function (v) {
                    if (!v) return '—';
                    var arr = Array.isArray(v) ? v : String(v).split(',');
                    return arr.map(function (r) {
                        return '<span class="badge badge-info">' + r + '</span>';
                    }).join(' ');
                }
            },
            {
                key: 'created_at', label: 'أُنشئ', render: function (v) {
                    return v ? String(v).substring(0, 10) : '—';
                }
            }
        ];

        var createFields = [
            { name: 'name', label: 'الاسم', required: true },
            { name: 'email', label: 'البريد الإلكتروني', type: 'email', required: true },
            { name: 'password', label: 'كلمة المرور', type: 'password', required: true },
            { name: 'role', label: 'الدور', type: 'select', options: [] }
        ];

        function loadRoles() {
            AdminAPI.getRoles().then(function (res) {
                var rows = (res && (res.data || res.rows)) || [];
                var f = createFields.find(function (x) { return x.name === 'role'; });
                if (f) f.options = rows.map(function (r) {
                    return { value: r.name || r.id, label: r.name };
                });
            }).catch(function () {});
        }

        function load() {
            AdminAPI.getUsers({
                q: document.getElementById('q').value.trim(),
                role: roleFilter,
                page: page
            }).then(function (res) {
                var rows = (res && (res.data || res.rows)) || [];
                document.getElementById('row-count').textContent =
                    (res && res.total != null) ? res.total : rows.length;
                document.getElementById('wm').textContent =
                    res && res.offline ? 'وضع Offline.' : '';

                CrudHelper.renderTable(document.getElementById('table-wrap'), columns, rows, {
                    emptyText: 'لا مستخدمين بهذا الفلتر.'
                });
                CrudHelper.renderPagination(document.getElementById('pager'), page,
                    (res && res.total_pages) || 1, function (p) { page = p; load(); });
            }).catch(function (e) {
                document.getElementById('table-wrap').innerHTML =
                    '<div class="empty">خطأ: ' + e.message + '</div>';
            });
        }

        document.getElementById('btn-new').addEventListener('click', function () {
            var host = document.createElement('div');
            CrudHelper.renderForm(host, createFields, {}, function (data) {
                AdminAPI.createUser(data).then(function (r) {
                    if (r && (r.success || r.id)) {
                        CrudHelper.toast('تم الإنشاء ✓', 'success');
                        modal.hide();
                        load();
                    } else {
                        CrudHelper.toast((r && r.message) || 'فشل', 'error');
                    }
                }).catch(function () {
                    CrudHelper.toast('يتطلب اتصالاً', 'error');
                });
            });
            var modal = CrudHelper.showModal('إنشاء مستخدم', host, [
                { label: 'إلغاء', onClick: function (h) { h(); } }
            ]);
        });

        document.getElementById('btn-search').addEventListener('click', function () { page = 1; load(); });
        document.querySelectorAll('#role-chips .chip').forEach(function (chip) {
            chip.addEventListener('click', function () {
                document.querySelectorAll('#role-chips .chip').forEach(function (c) { c.classList.remove('active'); });
                chip.classList.add('active');
                roleFilter = chip.dataset.role;
                page = 1;
                load();
            });
        });
        document.addEventListener('DOMContentLoaded', function () {
            loadRoles();
            load();
        });
    })();
    </script>
</body>
</html>
