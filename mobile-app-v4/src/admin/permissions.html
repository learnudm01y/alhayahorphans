<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a8b8b">
    <title>الصلاحيات - v4</title>
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="header">
        <h1>إدارة الصلاحيات والأدوار</h1>
        <div class="sub">v4 Offline Admin · <span id="mode-badge" class="badge badge-offline">Offline</span></div>
    </div>

    <nav class="nav-tabs container" style="margin-top:12px">
        <a href="dashboard.html">لوحة القيادة</a>
        <a href="sponsorships.html">الكفالات</a>
        <a href="reports.html">التقارير</a>
        <a href="permissions.html" class="active">الصلاحيات</a>
        <a href="files.html">الملفات</a>
        <a href="civil-registry.html">السجل المدني</a>
        <a href="../screens/conflict-review.html">مراجعة التكرارات</a>
        <a href="../screens/sync-health.html">صحة المزامنة</a>
    </nav>

    <div class="container">
        <div class="section-title">Manifest الحالي <span class="badge badge-info" id="status-badge">…</span></div>
        <div id="perm-wrap"><div class="empty" id="msg">جاري التحميل…</div></div>
        <div class="section-title">الصلاحيات الممنوحة</div>
        <div id="perm-list"><div class="empty">—</div></div>
        <div class="watermark" id="wm"></div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/sync-client-v4.js"></script>
    <script src="../js/admin-api.js"></script>
    <script src="../js/crud-helper.js"></script>
    <script src="../js/admin-nav.js"></script>
    <script>
    AdminNav.mount('permissions');
    (function () {
        var USER_ID = 1; // في التطبيق الفعلي يُقرأ من جلسة الدخول
        function toast(m) {
            var t = document.getElementById('toast');
            t.textContent = m; t.style.display = 'block';
            setTimeout(function () { t.style.display = 'none'; }, 3500);
        }
        function setBadge() {
            var b = document.getElementById('mode-badge');
            if (navigator.onLine) { b.textContent = 'Online'; b.className = 'badge badge-ok'; }
            else { b.textContent = 'Offline'; b.className = 'badge badge-offline'; }
        }
        window.addEventListener('online', setBadge);
        window.addEventListener('offline', setBadge);
        setBadge();

        function load() {
            if (!window.SyncClientV4) {
                document.getElementById('msg').textContent = 'Bridge غير متاح.';
                return;
            }
            SyncClientV4.getPermissions(USER_ID).then(function (res) {
                var sb = document.getElementById('status-badge');
                if (!res || !res.success || !res.manifest) {
                    sb.textContent = 'غير متوفر';
                    sb.className = 'badge badge-warn';
                    document.getElementById('perm-wrap').innerHTML =
                        '<div class="empty">لا يوجد manifest مخزّن — يتطلب أول مزامنة.</div>';
                    document.getElementById('perm-list').innerHTML = '<div class="empty">—</div>';
                    return;
                }
                if (res.expired) {
                    sb.textContent = 'منتهي — العمليات الحسّاسة مقفلة';
                    sb.className = 'badge badge-err';
                } else if (res.near_expiry) {
                    sb.textContent = 'قريب الانتهاء';
                    sb.className = 'badge badge-warn';
                } else {
                    sb.textContent = 'سليم';
                    sb.className = 'badge badge-ok';
                }
                var m = res.manifest;
                document.getElementById('perm-wrap').innerHTML =
                    '<div class="card" style="margin-bottom:12px">' +
                    '<div><strong>المستخدم:</strong> ' + (m.user_name || '—') + '</div>' +
                    '<div><strong>الأدوار:</strong> ' +
                    ((m.roles || []).join('، ') || '—') + '</div>' +
                    '<div><strong>انتهاء:</strong> ' + (m.expires_at || '—') + '</div>' +
                    '<div><strong>توقيع HMAC:</strong> <code style="font-size:11px">' +
                    (res.manifest.signature || '').substring(0, 32) + '…</code></div>' +
                    '</div>';
                var perms = m.permissions || [];
                var html = '<div class="cards">';
                perms.forEach(function (p) {
                    html += '<div class="card"><div class="label" style="font-size:13px">' +
                        p + '</div></div>';
                });
                html += '</div>';
                if (!perms.length) html = '<div class="empty">لا صلاحيات في الـ manifest.</div>';
                document.getElementById('perm-list').innerHTML = html;
                document.getElementById('wm').textContent =
                    'مرآة محلية لـ spatie permissions — لا نظام موازٍ.';
            }).catch(function (e) {
                document.getElementById('perm-wrap').innerHTML =
                    '<div class="empty">خطأ: ' + e.message + '</div>';
            });
        }
        document.addEventListener('DOMContentLoaded', load);
    })();
    </script>
</body>
</html>
