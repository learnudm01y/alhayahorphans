<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a8b8b">
    <title>إدارة الكفالات - v4</title>
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="header">
        <h1>إدارة الكفالات</h1>
        <div class="sub">v4 Offline Admin · <span id="mode-badge" class="badge badge-offline">Offline</span></div>
    </div>

    <nav class="nav-tabs container" style="margin-top:12px">
        <a href="dashboard.html">لوحة القيادة</a>
        <a href="sponsorships.html" class="active">الكفالات</a>
        <a href="reports.html">التقارير</a>
        <a href="permissions.html">الصلاحيات</a>
        <a href="files.html">الملفات</a>
        <a href="civil-registry.html">السجل المدني</a>
        <a href="../screens/conflict-review.html">مراجعة التكرارات</a>
        <a href="../screens/sync-health.html">صحة المزامنة</a>
    </nav>

    <div class="container">
        <div class="filter-chips" id="tab-chips">
            <button class="chip active" data-tab="all">الكل</button>
            <button class="chip" data-tab="sponsored">الأشخاص المكفولون</button>
            <button class="chip" data-tab="unsponsored">غير المكفولين</button>
        </div>
        <div class="toolbar">
            <input type="search" id="q" placeholder="بحث بالاسم أو رقم الهوية…" />
            <button class="btn" id="btn-search">بحث</button>
            <button class="btn btn-outline" id="btn-pdf">توليد PDF محلي</button>
            <button class="btn btn-outline" id="btn-export">تصدير Excel</button>
        </div>
        <div class="section-title">الكفالات <span class="badge badge-info" id="row-count">0</span></div>
        <div id="table-wrap">
            <div class="empty" id="msg">جاري التحميل…</div>
        </div>
        <div class="watermark" id="wm"></div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/sync-client-v4.js"></script>
    <script src="../js/admin-api.js"></script>
    <script src="../js/crud-helper.js"></script>
    <script src="../js/admin-nav.js"></script>
    <script>
    AdminNav.mount('sponsorships');
    (function () {
        function toast(m) {
            var t = document.getElementById('toast');
            t.textContent = m; t.style.display = 'block';
            setTimeout(function () { t.style.display = 'none'; }, 3500);
        }
        function setBadge() {
            var b = document.getElementById('mode-badge');
            if (navigator.onLine) { b.textContent = 'Online'; b.className = 'badge badge-ok'; }
            else { b.textContent = 'Offline'; b.className = 'badge badge-offline'; }
        }
        window.addEventListener('online', setBadge);
        window.addEventListener('offline', setBadge);
        setBadge();

        var activeTab = 'all';
        function load(search) {
            if (!window.SyncClientV4) {
                document.getElementById('msg').textContent = 'Bridge غير متاح.';
                return;
            }
            // Prefer online filtered endpoints when available
            var online = null;
            if (navigator.onLine && window.AdminAPI) {
                if (activeTab === 'sponsored') online = AdminAPI.getSponsored({ q: search || '' });
                else if (activeTab === 'unsponsored') online = AdminAPI.getUnsponsored({ q: search || '' });
                else online = AdminAPI.getSponsorships({ q: search || '' });
            }
            var bridgeP = SyncClientV4.queryReports(
                activeTab === 'sponsored' ? 'sponsorships' :
                    activeTab === 'unsponsored' ? 'unsponsored' : 'sponsorships',
                search || ''
            );
            Promise.all([online ? online.catch(function () { return null; }) : Promise.resolve(null), bridgeP])
                .then(function (pair) {
                    var onlineRes = pair[0];
                    var bridgeRes = pair[1];
                    var rows = (onlineRes && (onlineRes.data || onlineRes.rows))
                        || (bridgeRes && bridgeRes.rows) || [];
                    document.getElementById('row-count').textContent = rows.length;
                    if (!rows.length) {
                        document.getElementById('table-wrap').innerHTML =
                            '<div class="empty">لا توجد كفالات مخزّنة — أول مزامنة ستجلبها.</div>';
                        document.getElementById('wm').textContent = '';
                        return;
                    }
                    var html = '<table class="data"><thead><tr>' +
                        '<th>#</th><th>الاسم</th><th>الوصي</th><th>رقم الهوية</th>' +
                        '<th>الحالة</th><th>البداية</th><th>الانتهاء</th></tr></thead><tbody>';
                    rows.forEach(function (r, i) {
                        var st = r.sponsorship_status || r.sponsorship_status_id;
                        var stBadge = st
                            ? '<span class="badge badge-info">' + st + '</span>' : '—';
                        html += '<tr><td>' + (i + 1) + '</td>' +
                            '<td>' + (r.orphan_name || '—') + '</td>' +
                            '<td>' + (r.guardian_name || '—') + '</td>' +
                            '<td>' + (r.identity_number || r.guardian_identity_number || '—') + '</td>' +
                            '<td>' + stBadge + '</td>' +
                            '<td>' + (r.sponsorship_start_date || '—') + '</td>' +
                            '<td>' + (r.sponsorship_end_date || '—') + '</td></tr>';
                    });
                    html += '</tbody></table>';
                    document.getElementById('table-wrap').innerHTML = html;
                    document.getElementById('wm').textContent =
                        (onlineRes && !onlineRes.offline)
                            ? 'مصدر: السيرفر المباشر.'
                            : 'بيانات محلية من admin_offline_v4.db — آخر سحب: ' +
                            (bridgeRes && bridgeRes.fetched_at
                                ? new Date(bridgeRes.fetched_at).toLocaleString('ar') : 'غير معروف');
                }).catch(function (e) {
                    document.getElementById('table-wrap').innerHTML =
                        '<div class="empty">خطأ: ' + e.message + '</div>';
                });
        }

        document.querySelectorAll('#tab-chips .chip').forEach(function (chip) {
            chip.addEventListener('click', function () {
                document.querySelectorAll('#tab-chips .chip').forEach(function (c) { c.classList.remove('active'); });
                chip.classList.add('active');
                activeTab = chip.dataset.tab;
                load(document.getElementById('q').value.trim());
            });
        });
        // Deep link ?tab=sponsored|unsponsored
        (function () {
            var t = new URLSearchParams(location.search).get('tab');
            if (t === 'sponsored' || t === 'unsponsored') {
                activeTab = t;
                document.querySelectorAll('#tab-chips .chip').forEach(function (c) {
                    c.classList.toggle('active', c.dataset.tab === t);
                });
            }
        })();

        document.getElementById('btn-search').addEventListener('click', function () {
            load(document.getElementById('q').value.trim());
        });
        document.getElementById('q').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') load(this.value.trim());
        });
        document.getElementById('btn-export').addEventListener('click', function () {
            if (!navigator.onLine) { toast('التصدير يتطلب اتصالاً'); return; }
            var base = (window.APP_CONFIG && window.APP_CONFIG.BASE_URL) || 'https://alhayahorphans.org';
            window.open(base + '/admin/sponsorships/export?tab=' + activeTab, '_blank');
        });
        document.getElementById('btn-pdf').addEventListener('click', function () {
            if (!window.SyncClientV4) return;
            SyncClientV4.generateReportPdf('sponsorships', 'تقرير الكفالات').then(function (res) {
                if (res && res.success) toast('تم إنشاء PDF محلياً: ' + res.path);
                else toast('فشل توليد PDF');
            }).catch(function () { toast('Bridge غير متاح'); });
        });

        document.addEventListener('DOMContentLoaded', function () { load(''); });
    })();
    </script>
</body>
</html>
