<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام البحث المحسن مع عرض النتائج في مودال</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }

        .search-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .search-header {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .search-body {
            padding: 40px;
        }

        .search-input {
            font-size: 18px;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 0.2rem rgba(76, 175, 80, 0.25);
        }

        .search-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .modal-content {
            border: none;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border-bottom: none;
            border-radius: 15px 15px 0 0;
        }

        .modal-body {
            padding: 30px;
        }

        .person-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .person-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .person-name {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }

        .person-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .detail-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
            font-size: 16px;
        }

        .detail-content h6 {
            margin: 0;
            color: #6c757d;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-content p {
            margin: 5px 0 0 0;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
        }

        .search-stats {
            background: #e3f2fd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .no-results i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="search-container">
            <div class="search-header">
                <h1><i class="fas fa-search me-3"></i>نظام البحث المتقدم</h1>
                <p class="mb-0">ابحث عن الأشخاص بدقة وسرعة</p>
            </div>

            <div class="search-body">
                <div class="row">
                    <div class="col-md-8">
                        <input type="text"
                               id="searchInput"
                               class="form-control search-input"
                               placeholder="أدخل الاسم الكامل (مثال: ديمو سليمان فيكتوري)"
                               value="ديمو سليمان فيكتوري">
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-success search-btn w-100" onclick="performSearch()">
                            <i class="fas fa-search me-2"></i>بحث دقيق
                        </button>
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-md-6">
                        <button class="btn btn-outline-primary w-100" onclick="performSearch('ultra-fast')">
                            <i class="fas fa-bolt me-2"></i>بحث سريع
                        </button>
                    </div>
                    <div class="col-md-6">
                        <button class="btn btn-outline-secondary w-100" onclick="clearSearch()">
                            <i class="fas fa-eraser me-2"></i>مسح
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال عرض النتائج -->
    <div class="modal fade" id="resultsModal" tabindex="-1" aria-labelledby="resultsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="resultsModalLabel">
                        <i class="fas fa-users me-2"></i>نتائج البحث
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="loadingSpinner" class="loading-spinner">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">جاري البحث...</span>
                        </div>
                        <p class="mt-3">جاري البحث، يرجى الانتظار...</p>
                    </div>

                    <div id="searchStats" class="search-stats" style="display: none;">
                        <div class="row">
                            <div class="col-md-4">
                                <strong id="resultCount">0</strong><br>
                                <small>النتائج</small>
                            </div>
                            <div class="col-md-4">
                                <strong id="searchTime">0</strong><br>
                                <small>الوقت (ms)</small>
                            </div>
                            <div class="col-md-4">
                                <strong id="searchEngine">-</strong><br>
                                <small>نوع البحث</small>
                            </div>
                        </div>
                    </div>

                    <div id="resultsContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // متغيرات عامة
        const searchInput = document.getElementById('searchInput');
        const resultsModal = new bootstrap.Modal(document.getElementById('resultsModal'));
        const loadingSpinner = document.getElementById('loadingSpinner');
        const searchStats = document.getElementById('searchStats');
        const resultsContainer = document.getElementById('resultsContainer');

        // البحث عند الضغط على Enter
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // دالة تنفيذ البحث
        async function performSearch(searchType = 'final-exact') {
            const query = searchInput.value.trim();

            if (!query) {
                alert('يرجى إدخال اسم للبحث');
                return;
            }

            // إظهار المودال والـ loading
            resultsModal.show();
            showLoading();

            try {
                const url = `http://127.0.0.1:8001/api/search/${searchType}?q=${encodeURIComponent(query)}&limit=10`;

                const response = await fetch(url);
                const data = await response.json();

                hideLoading();
                displayResults(data, query);

            } catch (error) {
                hideLoading();
                showError('حدث خطأ أثناء البحث: ' + error.message);
            }
        }

        // إظهار حالة التحميل
        function showLoading() {
            loadingSpinner.style.display = 'block';
            searchStats.style.display = 'none';
            resultsContainer.innerHTML = '';
        }

        // إخفاء حالة التحميل
        function hideLoading() {
            loadingSpinner.style.display = 'none';
            searchStats.style.display = 'block';
        }

        // عرض النتائج
        function displayResults(data, query) {
            // عرض الإحصائيات
            document.getElementById('resultCount').textContent = data.count || 0;
            document.getElementById('searchTime').textContent = data.search_time || 0;
            document.getElementById('searchEngine').textContent = data.engine || 'غير محدد';

            // مسح النتائج السابقة
            resultsContainer.innerHTML = '';

            if (!data.results || data.results.length === 0) {
                showNoResults(query);
                return;
            }

            // عرض النتائج
            data.results.forEach((person, index) => {
                const personCard = createPersonCard(person, index + 1);
                resultsContainer.appendChild(personCard);
            });
        }

        // إنشاء كارت الشخص
        function createPersonCard(person, index) {
            const card = document.createElement('div');
            card.className = 'person-card';

            card.innerHTML = `
                <div class="person-name">
                    <i class="fas fa-user me-2"></i>
                    ${person.full_name || 'غير محدد'}
                </div>

                <div class="person-details">
                    <div class="detail-item">
                        <div class="detail-icon" style="background: #e3f2fd; color: #1976d2;">
                            <i class="fas fa-id-card"></i>
                        </div>
                        <div class="detail-content">
                            <h6>رقم الهوية</h6>
                            <p>${person.id_num || 'غير محدد'}</p>
                        </div>
                    </div>

                    <div class="detail-item">
                        <div class="detail-icon" style="background: #f3e5f5; color: #7b1fa2;">
                            <i class="fas fa-venus-mars"></i>
                        </div>
                        <div class="detail-content">
                            <h6>الجنس</h6>
                            <p>${person.gender || 'غير محدد'}</p>
                        </div>
                    </div>

                    <div class="detail-item">
                        <div class="detail-icon" style="background: #e8f5e8; color: #388e3c;">
                            <i class="fas fa-calendar-alt"></i>
                        </div>
                        <div class="detail-content">
                            <h6>تاريخ الميلاد</h6>
                            <p>${person.birth_date || 'غير محدد'}</p>
                        </div>
                    </div>

                    <div class="detail-item">
                        <div class="detail-icon" style="background: #fff3e0; color: #f57c00;">
                            <i class="fas fa-map-marker-alt"></i>
                        </div>
                        <div class="detail-content">
                            <h6>المدينة</h6>
                            <p>${person.city || 'غير محدد'}</p>
                        </div>
                    </div>

                    <div class="detail-item">
                        <div class="detail-icon" style="background: #fce4ec; color: #c2185b;">
                            <i class="fas fa-female"></i>
                        </div>
                        <div class="detail-content">
                            <h6>اسم الأم</h6>
                            <p>${person.mother_name || 'غير محدد'}</p>
                        </div>
                    </div>

                    <div class="detail-item">
                        <div class="detail-icon" style="background: #e1f5fe; color: #0277bd;">
                            <i class="fas fa-hashtag"></i>
                        </div>
                        <div class="detail-content">
                            <h6>معرف السجل</h6>
                            <p>${person.id || 'غير محدد'}</p>
                        </div>
                    </div>
                </div>
            `;

            return card;
        }

        // عرض رسالة عدم وجود نتائج
        function showNoResults(query) {
            resultsContainer.innerHTML = `
                <div class="no-results">
                    <i class="fas fa-search-minus"></i>
                    <h4>لم يتم العثور على نتائج</h4>
                    <p>لم يتم العثور على أي شخص بالاسم: <strong>"${query}"</strong></p>
                    <small class="text-muted">جرب البحث بطريقة مختلفة أو تأكد من الإملاء</small>
                </div>
            `;
        }

        // عرض رسالة خطأ
        function showError(message) {
            resultsContainer.innerHTML = `
                <div class="alert alert-danger text-center">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    ${message}
                </div>
            `;
        }

        // مسح البحث
        function clearSearch() {
            searchInput.value = '';
            searchInput.focus();
        }

        // تشغيل بحث تجريبي عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            // يمكن تشغيل بحث تلقائي هنا إذا أردت
        });
    </script>
</body>
</html>
