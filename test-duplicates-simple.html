<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار سريع للملفات المكررة</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h3>اختبار سريع للملفات المكررة</h3>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <button id="createTestBtn" class="btn btn-success mb-3">إنشاء ملفات اختبارية</button>
                        <button id="testApiBtn" class="btn btn-primary mb-3">اختبار API</button>
                    </div>
                    <div class="col-md-6">
                        <div id="results" class="alert alert-info">
                            <strong>النتائج:</strong><br>
                            <span id="resultText">جاهز للاختبار...</span>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <div id="sessionInfo" style="display:none;" class="alert alert-success">
                            <strong>معرف الجلسة:</strong> <span id="sessionId"></span><br>
                            <button id="checkDuplicatesBtn" class="btn btn-sm btn-outline-primary mt-2">فحص الملفات المكررة</button>
                        </div>
                    </div>
                </div>

                <div id="duplicatesList" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        const resultsEl = document.getElementById('results');
        const resultTextEl = document.getElementById('resultText');
        const sessionInfoEl = document.getElementById('sessionInfo');
        const sessionIdEl = document.getElementById('sessionId');
        const duplicatesListEl = document.getElementById('duplicatesList');

        function updateResult(message, type = 'info') {
            resultsEl.className = `alert alert-${type}`;
            resultTextEl.innerHTML = message;
        }

        // إنشاء ملفات اختبارية
        document.getElementById('createTestBtn').addEventListener('click', async function() {
            updateResult('جاري إنشاء ملفات اختبارية...', 'warning');

            try {
                const response = await fetch('/admin/file/create-test-duplicates', {
                    method: 'POST',
                    headers: {
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]').getAttribute('content'),
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();
                console.log('Response:', result);

                if (result.success) {
                    updateResult(`
                        ✅ تم إنشاء ${result.data.files_created.length} ملف اختباري بنجاح!<br>
                        📁 الملفات: ${result.data.files_created.join(', ')}<br>
                        🆔 معرف الجلسة: ${result.data.session_id}
                    `, 'success');

                    // عرض معلومات الجلسة
                    sessionIdEl.textContent = result.data.session_id;
                    sessionInfoEl.style.display = 'block';

                } else {
                    updateResult(`❌ فشل في الإنشاء: ${result.message}`, 'danger');
                }
            } catch (error) {
                updateResult(`❌ خطأ في الاتصال: ${error.message}`, 'danger');
                console.error('Error:', error);
            }
        });

        // اختبار API العام
        document.getElementById('testApiBtn').addEventListener('click', async function() {
            updateResult('جاري اختبار API...', 'warning');

            try {
                // اختبار مسار بسيط أولاً
                const response = await fetch('/admin/file/duplicate-summary?session_id=test', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                const result = await response.json();
                console.log('API Response:', result);

                if (response.ok) {
                    updateResult(`
                        ✅ API يعمل بشكل صحيح!<br>
                        📊 الاستجابة: ${result.message}<br>
                        🔢 الملفات المكررة: ${result.data ? result.data.total_duplicates : 0}
                    `, 'success');
                } else {
                    updateResult(`⚠️ API يعمل لكن لا توجد بيانات: ${result.message}`, 'warning');
                }
            } catch (error) {
                updateResult(`❌ API لا يعمل: ${error.message}`, 'danger');
                console.error('API Error:', error);
            }
        });

        // فحص الملفات المكررة
        document.getElementById('checkDuplicatesBtn').addEventListener('click', async function() {
            const sessionId = sessionIdEl.textContent;
            updateResult('جاري فحص الملفات المكررة...', 'warning');

            try {
                const response = await fetch(`/admin/file/duplicate-summary?session_id=${sessionId}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                const result = await response.json();
                console.log('Duplicates Response:', result);

                if (result.success) {
                    updateResult(`
                        ✅ تم العثور على ${result.data.total_duplicates} ملف مكرر!
                    `, 'success');

                    // عرض قائمة الملفات
                    if (result.data.files && result.data.files.length > 0) {
                        let html = '<div class="mt-3"><h5>الملفات المكررة:</h5><ul class="list-group">';
                        result.data.files.forEach(file => {
                            html += `
                                <li class="list-group-item">
                                    <strong>${file.original_name}</strong><br>
                                    <small>الحجم: ${(file.file_size / 1024).toFixed(2)} KB | النوع: ${file.mime_type}</small><br>
                                    <a href="${file.temp_url}" target="_blank" class="btn btn-sm btn-outline-primary mt-1">تحميل</a>
                                </li>
                            `;
                        });
                        html += '</ul></div>';
                        duplicatesListEl.innerHTML = html;
                    }
                } else {
                    updateResult(`❌ فشل في جلب الملفات: ${result.message}`, 'danger');
                }
            } catch (error) {
                updateResult(`❌ خطأ في الفحص: ${error.message}`, 'danger');
                console.error('Check Error:', error);
            }
        });
    </script>
</body>
</html>
