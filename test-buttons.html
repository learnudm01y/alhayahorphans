<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الأزرار</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Arial', sans-serif; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .log { background: #f8f9fa; padding: 10px; border-radius: 4px; margin-top: 10px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">🧪 اختبار الأزرار</h1>

        <div class="test-section">
            <h3>📋 حالة العناصر</h3>
            <div id="elementsStatus" class="log"></div>
        </div>

        <div class="test-section">
            <h3>🖱️ اختبار الأزرار</h3>
            <div class="row">
                <div class="col-md-6">
                    <input type="file" id="fileInput" multiple style="display: none;">
                    <input type="file" id="folderInput" webkitdirectory style="display: none;">
                    <input type="file" id="imagesWithFolderInput" webkitdirectory style="display: none;">

                    <button id="selectFilesBtn" class="btn btn-primary mb-2 w-100">
                        <i class="fas fa-file"></i> اختيار ملفات
                    </button>

                    <button id="selectFilesDropBtn" class="btn btn-success mb-2 w-100">
                        <i class="fas fa-download"></i> منطقة السحب
                    </button>

                    <button id="selectFolderBtn" class="btn btn-warning mb-2 w-100">
                        <i class="fas fa-folder"></i> اختيار مجلد
                    </button>
                </div>
                <div class="col-md-6">
                    <button id="selectFolderWithImagesBtn" class="btn btn-info mb-2 w-100">
                        <i class="fas fa-images"></i> مجلد + صور
                    </button>

                    <button id="generateRecordBtn" class="btn btn-dark mb-2 w-100">
                        <i class="fas fa-hashtag"></i> إنشاء رقم ملف
                    </button>

                    <button id="clearAllBtn" class="btn btn-danger mb-2 w-100">
                        <i class="fas fa-trash"></i> مسح الكل
                    </button>
                </div>
            </div>
        </div>

        <div class="test-section">
            <h3>📝 سجل الأحداث</h3>
            <div id="eventLog" class="log"></div>
            <button onclick="clearLog()" class="btn btn-sm btn-outline-secondary mt-2">مسح السجل</button>
        </div>
    </div>

    <script>
        let eventCounter = 0;

        function log(message, type = 'info') {
            const eventLog = document.getElementById('eventLog');
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            const color = type === 'error' ? 'text-danger' :
                         type === 'success' ? 'text-success' :
                         type === 'warning' ? 'text-warning' : 'text-info';

            eventLog.innerHTML += `<div class="${color}">[${timestamp}] ${message}</div>`;
            eventLog.scrollTop = eventLog.scrollHeight;
            eventCounter++;
        }

        function clearLog() {
            document.getElementById('eventLog').innerHTML = '';
            eventCounter = 0;
        }

        function checkElements() {
            const elementsStatus = document.getElementById('elementsStatus');
            const elements = {
                'fileInput': document.getElementById('fileInput'),
                'folderInput': document.getElementById('folderInput'),
                'imagesWithFolderInput': document.getElementById('imagesWithFolderInput'),
                'selectFilesBtn': document.getElementById('selectFilesBtn'),
                'selectFilesDropBtn': document.getElementById('selectFilesDropBtn'),
                'selectFolderBtn': document.getElementById('selectFolderBtn'),
                'selectFolderWithImagesBtn': document.getElementById('selectFolderWithImagesBtn'),
                'generateRecordBtn': document.getElementById('generateRecordBtn'),
                'clearAllBtn': document.getElementById('clearAllBtn')
            };

            let statusHTML = '<table class="table table-sm table-striped">';
            statusHTML += '<thead><tr><th>العنصر</th><th>موجود</th><th>النوع</th><th>الفئات</th></tr></thead><tbody>';

            Object.entries(elements).forEach(([id, element]) => {
                const exists = !!element;
                const type = element?.tagName || 'N/A';
                const classes = element?.className || 'N/A';
                const statusIcon = exists ? '✅' : '❌';

                statusHTML += `<tr>
                    <td>${id}</td>
                    <td>${statusIcon}</td>
                    <td>${type}</td>
                    <td>${classes}</td>
                </tr>`;
            });

            statusHTML += '</tbody></table>';
            elementsStatus.innerHTML = statusHTML;
        }

        function setupEventListeners() {
            // Setup button event listeners
            const buttons = [
                'selectFilesBtn', 'selectFilesDropBtn', 'selectFolderBtn',
                'selectFolderWithImagesBtn', 'generateRecordBtn', 'clearAllBtn'
            ];

            buttons.forEach(buttonId => {
                const button = document.getElementById(buttonId);
                if (button) {
                    button.addEventListener('click', function() {
                        log(`تم النقر على الزر: ${buttonId}`, 'success');

                        // Handle specific actions
                        if (buttonId.includes('selectFiles') || buttonId.includes('selectFolder')) {
                            const inputId = buttonId.includes('Folder') ?
                                (buttonId.includes('Images') ? 'imagesWithFolderInput' : 'folderInput') :
                                'fileInput';
                            const input = document.getElementById(inputId);
                            if (input) {
                                input.click();
                                log(`تم فتح نافذة اختيار: ${inputId}`, 'info');
                            }
                        } else if (buttonId === 'generateRecordBtn') {
                            log('تم إنشاء رقم ملف تجريبي: ASO' + Date.now(), 'warning');
                        } else if (buttonId === 'clearAllBtn') {
                            log('تم مسح جميع البيانات', 'warning');
                        }
                    });

                    // Add visual feedback
                    button.addEventListener('mouseenter', function() {
                        this.style.transform = 'scale(1.05)';
                        this.style.transition = 'transform 0.2s';
                    });

                    button.addEventListener('mouseleave', function() {
                        this.style.transform = 'scale(1)';
                    });

                    log(`تم ربط event listener للزر: ${buttonId}`, 'info');
                } else {
                    log(`الزر غير موجود: ${buttonId}`, 'error');
                }
            });
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            log('تم تحميل الصفحة، بدء الفحص...', 'info');
            checkElements();
            setupEventListeners();
            log('تم الانتهاء من الإعداد. جرب النقر على الأزرار!', 'success');
        });

        // Global error handler
        window.addEventListener('error', function(e) {
            log(`خطأ JavaScript: ${e.message}`, 'error');
        });
    </script>

    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
