[program:laravel-worker-documents]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/alhayahorphans/artisan queue:work database --queue=documents --sleep=3 --tries=3 --max-time=3600 --timeout=120 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/alhayahorphans/storage/logs/worker-documents.log
stopwaitsecs=150
