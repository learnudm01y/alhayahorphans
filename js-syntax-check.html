<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Syntax Check</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .success { color: green; }
        .error { color: red; }
        .test-result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>JavaScript Syntax Check</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        // اختبار 1: الدالة showDuplicateFilesModal
        function testShowDuplicateFilesModal() {
            try {
                // محاكاة البيانات
                const testData = [
                    {
                        id: 1,
                        original_name: 'test_file.pdf',
                        duplicate_name: 'test_file_copy.pdf',
                        file_size: 1024,
                        created_at: '2025-07-17 10:00:00'
                    }
                ];

                // إنشاء عنصر مؤقت للاختبار
                const tempDiv = document.createElement('div');
                tempDiv.id = 'duplicateFilesModal';
                const modalBody = document.createElement('div');
                modalBody.className = 'modal-body';
                tempDiv.appendChild(modalBody);
                document.body.appendChild(tempDiv);

                // اختبار الدالة
                showDuplicateFilesModal(testData);

                // التحقق من النتيجة
                const content = modalBody.innerHTML;
                if (content.includes('test_file.pdf') && content.includes('1 KB')) {
                    results.innerHTML += '<div class="test-result success">✅ اختبار showDuplicateFilesModal نجح</div>';
                } else {
                    results.innerHTML += '<div class="test-result error">❌ اختبار showDuplicateFilesModal فشل</div>';
                }

                // تنظيف
                document.body.removeChild(tempDiv);

            } catch (error) {
                results.innerHTML += '<div class="test-result error">❌ خطأ في اختبار showDuplicateFilesModal: ' + error.message + '</div>';
            }
        }

        // اختبار 2: دالة formatFileSize
        function testFormatFileSize() {
            try {
                const tests = [
                    { input: 0, expected: '0 Bytes' },
                    { input: 1024, expected: '1 KB' },
                    { input: 1048576, expected: '1 MB' },
                    { input: 1073741824, expected: '1 GB' }
                ];

                let allPassed = true;
                for (const test of tests) {
                    const result = formatFileSize(test.input);
                    if (result !== test.expected) {
                        allPassed = false;
                        break;
                    }
                }

                if (allPassed) {
                    results.innerHTML += '<div class="test-result success">✅ اختبار formatFileSize نجح</div>';
                } else {
                    results.innerHTML += '<div class="test-result error">❌ اختبار formatFileSize فشل</div>';
                }

            } catch (error) {
                results.innerHTML += '<div class="test-result error">❌ خطأ في اختبار formatFileSize: ' + error.message + '</div>';
            }
        }

        // نسخ الدوال من الملف الأصلي
        function showDuplicateFilesModal(duplicatesData) {
            const modalBody = document.querySelector('#duplicateFilesModal .modal-body');

            if (!duplicatesData || duplicatesData.length === 0) {
                modalBody.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
                        <h4>لا توجد ملفات مكررة</h4>
                        <p class="text-muted">جميع الملفات في النظام فريدة</p>
                    </div>
                `;
                return;
            }

            let tableContent = `
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>اسم الملف</th>
                                <th>الحجم</th>
                                <th>تاريخ الرفع</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            duplicatesData.forEach(file => {
                const fileName = file.original_name || file.duplicate_name || 'غير محدد';
                tableContent += `
                    <tr>
                        <td>` + fileName + `</td>
                        <td>` + formatFileSize(file.file_size || 0) + `</td>
                        <td>` + (file.created_at || 'غير محدد') + `</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deleteDuplicateFile('` + file.id + `')">
                                <i class="fas fa-trash"></i> حذف
                            </button>
                        </td>
                    </tr>
                `;
            });

            tableContent += `
                        </tbody>
                    </table>
                </div>
            `;

            modalBody.innerHTML = tableContent;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // تشغيل الاختبارات
        window.onload = function() {
            results.innerHTML = '<h2>نتائج الاختبارات:</h2>';
            testFormatFileSize();
            testShowDuplicateFilesModal();
            results.innerHTML += '<div class="test-result success">✅ جميع الاختبارات مكتملة</div>';
        };
    </script>
</body>
</html>
