<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص مسارات الملفات</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🔍 فحص مسارات الملفات</h1>
    <div id="results"></div>

    <script>
        async function checkFilePaths() {
            try {
                const response = await fetch('/file-management/folders-management/folder-contents?record_number=000010');
                const data = await response.json();

                let html = '<div class="debug success">✅ تم تحميل البيانات بنجاح</div>';
                html += '<div class="debug info">📊 عدد الملفات: ' + data.files.length + '</div>';

                if (data.files && data.files.length > 0) {
                    html += '<h2>📄 تفاصيل الملفات:</h2>';

                    data.files.forEach((file, index) => {
                        html += '<div class="debug">';
                        html += '<h3>ملف #' + (index + 1) + '</h3>';
                        html += '<p><strong>الاسم:</strong> ' + (file.file_name || 'غير محدد') + '</p>';
                        html += '<p><strong>الاسم المخزن:</strong> ' + (file.stored_file_name || 'غير محدد') + '</p>';
                        html += '<p><strong>المسار:</strong> ' + (file.file_path || 'غير محدد') + '</p>';
                        html += '<p><strong>URL التحميل:</strong> ' + (file.download_url || 'غير محدد') + '</p>';
                        html += '<p><strong>الامتداد:</strong> ' + (file.extension || file.file_extension || 'غير محدد') + '</p>';
                        html += '<p><strong>النوع:</strong> ' + (file.file_type || 'غير محدد') + '</p>';
                        html += '<p><strong>صورة؟:</strong> ' + (file.is_image ? 'نعم' : 'لا') + '</p>';

                        // Test if URL is accessible
                        html += '<p><strong>اختبار الرابط:</strong> <span id="test_' + index + '">جاري الاختبار...</span></p>';

                        html += '</div>';
                    });

                    // Test URLs
                    setTimeout(() => {
                        data.files.forEach(async (file, index) => {
                            if (file.download_url) {
                                try {
                                    const testResponse = await fetch(file.download_url, { method: 'HEAD' });
                                    const statusElement = document.getElementById('test_' + index);
                                    if (testResponse.ok) {
                                        statusElement.innerHTML = '<span style="color: green;">✅ متاح (' + testResponse.status + ')</span>';
                                    } else {
                                        statusElement.innerHTML = '<span style="color: red;">❌ غير متاح (' + testResponse.status + ')</span>';
                                    }
                                } catch (error) {
                                    const statusElement = document.getElementById('test_' + index);
                                    statusElement.innerHTML = '<span style="color: red;">❌ خطأ في الاتصال</span>';
                                }
                            }
                        });
                    }, 1000);
                }

                document.getElementById('results').innerHTML = html;

            } catch (error) {
                document.getElementById('results').innerHTML = '<div class="debug error">❌ خطأ: ' + error.message + '</div>';
            }
        }

        // تشغيل الفحص عند تحميل الصفحة
        window.onload = checkFilePaths;
    </script>
</body>
</html>
