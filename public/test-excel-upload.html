<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار رفع ملف Excel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #f9f9f9;
        }
        .error {
            background: #fee;
            border-color: #fcc;
        }
        .success {
            background: #efe;
            border-color: #cfc;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #progress {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>اختبار رفع ملف Excel للكفالات</h1>

    <form id="testForm">
        <div>
            <label>المؤسسة الكافلة:</label>
            <input type="number" name="sponsor_id" value="1" required>
        </div>
        <div>
            <label>نوع الكفالة:</label>
            <input type="number" name="sponsorship_type_id" value="1" required>
        </div>
        <div>
            <label>حالة الكفالة:</label>
            <input type="number" name="sponsorship_status_id" value="4" required>
        </div>
        <div>
            <label>ملف Excel:</label>
            <input type="file" name="excel_file" accept=".xlsx,.xls" required>
        </div>
        <div>
            <button type="submit">فحص الملف</button>
        </div>
        <div id="progress">
            <p>جاري الفحص...</p>
        </div>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const resultDiv = document.getElementById('result');
            const progressDiv = document.getElementById('progress');

            resultDiv.innerHTML = '';
            progressDiv.style.display = 'block';

            const formData = new FormData(this);
            formData.append('check_only', '1');

            // Add CSRF token (get from meta tag or cookie)
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
            if (csrfToken) {
                formData.append('_token', csrfToken);
            }

            try {
                console.log('🚀 Sending request...');
                const response = await fetch('/admin/sponsorships/import', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'Accept': 'application/json'
                    }
                });

                console.log('📥 Response status:', response.status);
                const data = await response.json();
                console.log('📊 Response data:', data);

                progressDiv.style.display = 'none';

                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ نجح الفحص</h3>
                        <p><strong>إجمالي السجلات:</strong> ${data.validation.total_rows}</p>
                        <p><strong>أشخاص مفقودين:</strong> ${data.validation.missing_persons?.length || 0}</p>
                        <p><strong>بنوك مفقودة:</strong> ${data.validation.missing_banks?.length || 0}</p>
                        <p><strong>أرقام محدثة:</strong> ${data.validation.updated_phones?.length || 0}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ فشل الفحص</h3>
                        <p>${data.message || 'حدث خطأ غير معروف'}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                console.error('❌ Error:', error);
                progressDiv.style.display = 'none';
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ خطأ في الطلب</h3>
                    <p>${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
