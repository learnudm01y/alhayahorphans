; إعدادات PHP لدعم الملفات الكبيرة
upload_max_filesize = 1024M
post_max_size = 1024M
memory_limit = 2048M
max_execution_time = 3600
max_input_time = 3600
max_file_uploads = 100
file_uploads = On
max_input_vars = 10000
default_socket_timeout = 3600
realpath_cache_size = 4096K
realpath_cache_ttl = 600
