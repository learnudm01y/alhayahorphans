<!DOCTYPE html>
<html>
<head>
    <title>اختبار API الإحصائيات الحقيقية</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; direction: rtl; }
        .result { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>🔍 اختبار API الإحصائيات الحقيقية</h1>

    <button onclick="testAPI()">اختبار API</button>
    <button onclick="clearResults()">مسح النتائج</button>

    <div id="results"></div>

    <script>
        function addResult(message, type = 'result') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testAPI() {
            clearResults();
            addResult('🔄 بدء اختبار API...', 'loading');

            try {
                const url = '/admin/duplicate-files/real-statistics';
                addResult(`📡 استدعاء: ${url}`, 'result');

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                        'Content-Type': 'application/json'
                    }
                });

                addResult(`📊 حالة الاستجابة: ${response.status} ${response.statusText}`, 'result');

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                addResult(`✅ البيانات المستلمة:`, 'success');
                addResult(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'result');

                if (data.success && data.data) {
                    const stats = data.data;
                    addResult(`
                        📈 الإحصائيات:
                        <ul>
                            <li>إجمالي الملفات: ${stats.total_files}</li>
                            <li>الملفات النشطة: ${stats.active_files}</li>
                            <li>الملفات المنتهية: ${stats.expired_files}</li>
                            <li>الصور: ${stats.total_images}</li>
                            <li>المستندات: ${stats.total_documents}</li>
                            <li>المساحة: ${formatFileSize(stats.total_size)}</li>
                        </ul>
                    `, 'success');
                }

            } catch (error) {
                addResult(`❌ خطأ: ${error.message}`, 'error');
                console.error('Error:', error);
            }
        }

        function formatFileSize(bytes) {
            if (!bytes || bytes === 0) return '0 بايت';
            const sizes = ['بايت', 'كيلوبايت', 'ميجابايت', 'جيجابايت'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }

        // اختبار تلقائي عند تحميل الصفحة
        window.onload = function() {
            testAPI();
        };
    </script>
</body>
</html>
