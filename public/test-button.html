<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الزر</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 50px; direction: rtl; }
        .log { background: #000; color: #0f0; padding: 20px; margin: 20px 0; font-family: monospace; min-height: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>اختبار زر إضافة جمعية</h1>

        <button type="button" class="btn btn-primary btn-lg" id="testBtn">
            اضغط هنا للاختبار
        </button>

        <div class="log" id="log">جاهز...</div>

        <!-- Modal -->
        <div class="modal fade" id="testModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">نجح! ✅</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        الزر يعمل بشكل صحيح!
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function addLog(msg) {
            $('#log').append(msg + '\n');
        }

        $(document).ready(function() {
            addLog('✅ jQuery loaded: ' + $.fn.jquery);
            addLog('✅ Bootstrap loaded');
            addLog('✅ Button exists: ' + $('#testBtn').length);
            addLog('✅ Modal exists: ' + $('#testModal').length);
            addLog('-----------------------------------');

            $('#testBtn').on('click', function() {
                addLog('🖱️  Button clicked!');

                const modalElement = document.getElementById('testModal');
                addLog('📦 Modal element: ' + (modalElement ? 'Found' : 'Not found'));

                if (modalElement) {
                    const modal = new bootstrap.Modal(modalElement);
                    addLog('🚀 Opening modal...');
                    modal.show();
                    addLog('✅ Modal opened!');
                }
            });

            addLog('✅ Event listener attached');
            addLog('👆 اضغط الزر الأزرق أعلاه');
        });
    </script>
</body>
</html>
