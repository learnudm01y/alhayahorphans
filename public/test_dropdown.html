<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار Dropdown</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    <h3>اختبار Dropdown للتصدير</h3>

    <div class="btn-group mt-3" role="group">
        <button type="button" class="btn btn-success dropdown-toggle" data-bs-toggle="dropdown" data-bs-auto-close="true" aria-expanded="false">
            تصدير Excel
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li>
                <a class="dropdown-item" href="javascript:void(0);" id="test_btn_1">
                    تصدير كامل البيانات
                </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <a class="dropdown-item" href="javascript:void(0);" id="test_btn_2">
                    تصدير بيانات تسجيل الدخول
                </a>
            </li>
        </ul>
    </div>

    <div class="alert alert-info mt-3" id="result">
        اضغط على أحد الخيارات...
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            console.log('✅ jQuery loaded');

            $('#test_btn_1').on('click', function(e) {
                e.preventDefault();
                console.log('✅ Clicked: Full Export');
                $('#result').html('تم الضغط على: <strong>تصدير كامل البيانات</strong>');
            });

            $('#test_btn_2').on('click', function(e) {
                e.preventDefault();
                console.log('✅ Clicked: Login Export');
                $('#result').html('تم الضغط على: <strong>تصدير بيانات تسجيل الدخول</strong>');
            });
        });
    </script>
</body>
</html>
