<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta name="theme-color" content="#2a8b8b">
    <meta name="apple-mobile-web-app-capable" content="yes">

        <!-- Filter Section -->

            </div>

            <!-- Bank Account Data Section -->

                <h3 class="data-section-title">بيانات الحساب البنكي</h3>
                <div class="data-section-content" id="bankData">
                    <!-- Data will be loaded dynamically -->
                </div>
            </div>
        </div>
    </div>

        document.addEventListener('DOMContentLoaded', function() {
            // Filter buttons
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    this.classList.toggle('active');
                });
            });

            // Search functionality
            document.getElementById('searchInput').addEventListener('input', function() {
                const searchTerm = this.value;
                // Search logic will be added
                console.log('Searching for:', searchTerm);
            });

            // Load data function (placeholder)
            function loadOrphanData(orphanId) {

                console.log('Loading orphan data for ID:', orphanId);
            }

            function loadGuardianData(guardianId) {
                // API call will be added here
                console.log('Loading guardian data for ID:', guardianId);
            }

            function loadBankData(bankId) {
                // API call will be added here
                console.log('Loading bank data for ID:', bankId);
            }
        });
    </script>

</html>
