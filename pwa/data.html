<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2a8b8b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="الحياة">
    <meta name="description" content="تطبيق الحياة لتنمية الأسرة - البيانات">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo01.png">
    <link rel="apple-touch-icon" href="logo01.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/custom-select.css">

    <title>الحياة - بيانات</title>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-logo">
                <img src="logo01.png" alt="شعار الحياة">
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <a href="data.html" class="nav-tab active">بيانات</a>
            <a href="photography.html" class="nav-tab inactive">تصوير</a>
        </nav>

        <!-- Filter Section -->
        <div class="filter-section">
            <div class="select-wrapper">
                <select class="filter-select custom-select" id="filterOrg">
                    <option value="" disabled selected>المؤسسة</option>
                    <option value="org1">مؤسسة الحياة</option>
                    <option value="org2">مؤسسة الأمل</option>
                    <option value="org3">مؤسسة النور</option>
                    <option value="org4">مؤسسة الرحمة</option>
                    <option value="org5">مؤسسة الخير</option>
                </select>
            </div>
            <div class="select-wrapper">
                <select class="filter-select custom-select" id="filterStatus">
                    <option value="" disabled selected>الحالة</option>
                    <option value="active">نشط</option>
                    <option value="inactive">غير نشط</option>
                    <option value="pending">قيد المراجعة</option>
                    <option value="approved">معتمد</option>
                    <option value="rejected">مرفوض</option>
                </select>
            </div>
            <button class="filter-action-btn" id="filterBtn">
                <svg class="filter-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>

        <!-- Search Box -->
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="البحث الإسم">
        </div>

        <!-- Data Sections -->
        <div class="data-sections">
            <!-- Orphan Data Section -->
            <div class="data-section" id="orphanSection">
                <h3 class="data-section-title">بيانات اليتيم</h3>
                <div class="data-section-content" id="orphanData">
                    <!-- Data will be loaded dynamically -->
                </div>
            </div>

            <!-- Guardian Data Section -->
            <div class="data-section" id="guardianSection">
                <h3 class="data-section-title">بيانات المعيل</h3>
                <div class="data-section-content" id="guardianData">
                    <!-- Data will be loaded dynamically -->
                </div>
            </div>

            <!-- Bank Account Data Section -->
            <div class="data-section" id="bankSection">
                <h3 class="data-section-title">بيانات الحساب البنكي</h3>
                <div class="data-section-content" id="bankData">
                    <!-- Data will be loaded dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Basic functionality placeholder
        document.addEventListener('DOMContentLoaded', function() {
            // Filter logic
            document.getElementById('filterBtn').addEventListener('click', function() {
                const org = document.getElementById('filterOrg').value;
                const status = document.getElementById('filterStatus').value;
                // Filter logic will be added here
                console.log('Filter applied:', { org, status });
            });

            // Search functionality
            document.getElementById('searchInput').addEventListener('input', function() {
                const searchTerm = this.value;
                // Search logic will be added
                console.log('Searching for:', searchTerm);
            });

            // Load data function (placeholder)
            function loadOrphanData(orphanId) {
                // API call will be added here
                console.log('Loading orphan data for ID:', orphanId);
            }

            function loadGuardianData(guardianId) {
                // API call will be added here
                console.log('Loading guardian data for ID:', guardianId);
            }

            function loadBankData(bankId) {
                // API call will be added here
                console.log('Loading bank data for ID:', bankId);
            }

            // Initialize Custom Selects
            CustomSelect.initAll('.custom-select', {
                placeholder: 'اختر...',
                searchPlaceholder: 'بحث...',
                noResults: 'لا توجد نتائج'
            });
        });
    </script>
    <script src="js/custom-select.js"></script>
</body>
</html>
