<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2a8b8b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="الحياة">
    <meta name="description" content="تطبيق الحياة لتنمية الأسرة - التصوير">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo01.png">
    <link rel="apple-touch-icon" href="logo01.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <title>الحياة - تصوير</title>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-logo">
                <img src="logo01.png" alt="شعار الحياة">
                <div class="header-text">
                    <span class="header-text-arabic">الحياة لتنمية الأسرة</span>
                    <span class="header-text-english">Al Hayah For Family Development</span>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <a href="data.html" class="nav-tab inactive">بيانات</a>
            <a href="photography.html" class="nav-tab active">تصوير</a>
        </nav>

        <!-- Filter Section -->
        <div class="filter-section">
            <button class="filter-btn" id="filterOrg">المؤسسة</button>
            <button class="filter-btn" id="filterStatus">الحالة</button>
            <button class="filter-btn" id="filterBtn">فلتر</button>
        </div>

        <!-- Search Box -->
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="البحث الإسم">
        </div>

        <!-- Names List -->
        <div class="names-list-container">
            <div class="names-list" id="namesList">
                <div class="names-list-placeholder">
                    قائمة الأسماء
                </div>
            </div>
        </div>

        <!-- Selected Name -->
        <div class="selected-name-box">
            <input type="text" class="selected-name-input" id="selectedName" placeholder="الإسم المختار" readonly>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="action-btn photo" id="photoBtn">صورة</button>
            <button class="action-btn video" id="videoBtn">فيديو</button>
        </div>
    </div>

    <script>
        // Basic functionality placeholder
        document.addEventListener('DOMContentLoaded', function() {
            // Filter buttons
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    this.classList.toggle('active');
                });
            });

            // Photo button
            document.getElementById('photoBtn').addEventListener('click', function() {
                const selectedName = document.getElementById('selectedName').value;
                if (!selectedName) {
                    alert('الرجاء اختيار اسم أولاً');
                    return;
                }
                // Photo capture logic will be added
                console.log('Capture photo for:', selectedName);
            });

            // Video button
            document.getElementById('videoBtn').addEventListener('click', function() {
                const selectedName = document.getElementById('selectedName').value;
                if (!selectedName) {
                    alert('الرجاء اختيار اسم أولاً');
                    return;
                }
                // Video capture logic will be added
                console.log('Capture video for:', selectedName);
            });

            // Search functionality
            document.getElementById('searchInput').addEventListener('input', function() {
                const searchTerm = this.value;
                // Search logic will be added
                console.log('Searching for:', searchTerm);
            });
        });
    </script>
</body>
</html>
