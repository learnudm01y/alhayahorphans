<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار زر التنزيل البسيط</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { padding: 50px; background-color: #f8f9fa; }
        .test-card { max-width: 600px; margin: 0 auto; }
        .download-btn {
            background: linear-gradient(45deg, #28a745, #20c997);
            border: none;
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
            color: white;
        }
        .log {
            background: #000;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card test-card">
        <div class="card-header bg-primary text-white text-center">
            <h3><i class="fas fa-download"></i> اختبار زر التنزيل البسيط</h3>
        </div>
        <div class="card-body text-center">
            <p class="mb-4">اضغط على الزر أدناه لاختبار تنزيل الملفات المكررة</p>

            <button class="download-btn" onclick="simpleDownloadTest()">
                <i class="fas fa-download me-2"></i>
                تحميل الملفات المكررة
            </button>

            <div class="mt-4">
                <small class="text-muted">
                    <strong>رابط التنزيل:</strong><br>
                    <code id="downloadUrl">جاري التحديد...</code>
                </small>
            </div>

            <div class="log" id="log"></div>

            <div class="mt-3">
                <button class="btn btn-secondary btn-sm" onclick="clearLog()">
                    <i class="fas fa-eraser"></i> مسح السجل
                </button>
                <button class="btn btn-info btn-sm" onclick="openDirectLink()">
                    <i class="fas fa-external-link-alt"></i> فتح الرابط مباشرة
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// إعداد Session ID
const sessionId = 'simple_test_' + Date.now();
const downloadUrl = `http://127.0.0.1:8000/api/duplicate-files/download?session_id=${sessionId}`;

// عرض الرابط
document.getElementById('downloadUrl').textContent = downloadUrl;

// دالة التسجيل
function log(message) {
    const logEl = document.getElementById('log');
    const timestamp = new Date().toLocaleTimeString('ar-SA');
    logEl.innerHTML += `[${timestamp}] ${message}\n`;
    logEl.scrollTop = logEl.scrollHeight;
    console.log(message);
}

// مسح السجل
function clearLog() {
    document.getElementById('log').innerHTML = '';
}

// فتح الرابط مباشرة في نافذة جديدة
function openDirectLink() {
    log('🔗 فتح الرابط في نافذة جديدة...');
    window.open(downloadUrl, '_blank');
}

// اختبار التنزيل البسيط
function simpleDownloadTest() {
    log('🚀 بدء اختبار التنزيل البسيط');
    log('📋 Session ID: ' + sessionId);
    log('🌐 رابط التنزيل: ' + downloadUrl);

    // الطريقة الأولى: استخدام رابط a مخفي
    log('🔗 الطريقة 1: إنشاء رابط مخفي...');
    const link = document.createElement('a');
    link.href = downloadUrl;
    link.download = `duplicate_files_${sessionId}.zip`;
    link.target = '_blank';
    link.style.display = 'none';

    document.body.appendChild(link);
    log('➕ تم إضافة الرابط إلى DOM');

    link.click();
    log('👆 تم النقر على الرابط');

    document.body.removeChild(link);
    log('➖ تم إزالة الرابط من DOM');

    log('✅ انتهت الطريقة الأولى');

    log('📥 تحقق من مجلد التنزيلات للملفات المحملة');
}

// بدء التشغيل
document.addEventListener('DOMContentLoaded', function() {
    log('🎬 تم تحميل الصفحة بنجاح');
    log('🆔 Session ID: ' + sessionId);
    log('💡 اضغط على الزر الأخضر لبدء الاختبار');
});
</script>

</body>
</html>
