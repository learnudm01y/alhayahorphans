<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار بسيط لزر التحميل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { padding: 50px; background: #f8f9fa; }
        .test-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .btn-test {
            margin: 10px;
            padding: 15px 30px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="test-box">
            <h2 class="mb-4">🔍 اختبار بسيط لزر التحميل</h2>

            <div class="alert alert-info">
                <strong>الهدف:</strong> التأكد من ظهور زر التحميل في Modal
            </div>

            <button type="button" class="btn btn-primary btn-test" data-bs-toggle="modal" data-bs-target="#duplicateFilesModal">
                <i class="fas fa-eye me-2"></i>
                فتح Modal مباشرة
            </button>

            <div id="testResult" class="mt-4" style="display: none;"></div>
        </div>
    </div>

    <!-- Modal مباشر من الملف الأصلي -->
    <div class="modal fade" id="duplicateFilesModal" tabindex="-1" aria-labelledby="duplicateFilesModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-warning-subtle">
                    <h5 class="modal-title" id="duplicateFilesModalLabel">
                        <i class="fas fa-clone text-warning me-2"></i>
                        الملفات/المجلدات المكررة المكتشفة أثناء الرفع
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
                </div>
                <div class="modal-body">
                    <div id="duplicateFilesList">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle me-2"></i>
                            اختبار Modal - تحقق من الأزرار أدناه
                        </div>
                    </div>
                    <div class="alert alert-info mt-3" id="duplicateFilesNote">
                        يمكنك تحميل جميع الملفات المكررة كملف مضغوط أو مراجعتها بشكل فردي.
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                    <button type="button" id="deleteDuplicatesBtn" class="btn btn-danger">
                        <i class="fas fa-trash-alt me-1"></i> حذف جميع الملفات المكررة
                    </button>
                    <a href="/api/duplicate-files/download?session_id=test123" id="downloadDuplicatesBtn" class="btn btn-warning">
                        <i class="fas fa-download me-1"></i> تحميل جميع الملفات المكررة
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('duplicateFilesModal');
            const testResult = document.getElementById('testResult');

            modal.addEventListener('shown.bs.modal', function () {
                // فحص الأزرار
                const downloadBtn = document.getElementById('downloadDuplicatesBtn');
                const deleteBtn = document.getElementById('deleteDuplicatesBtn');

                let result = '<div class="alert alert-success"><h5>🔍 نتائج الفحص:</h5><ul class="text-start">';

                if (downloadBtn) {
                    const isVisible = window.getComputedStyle(downloadBtn).display !== 'none';
                    result += `<li>زر التحميل: ${isVisible ? '✅ يظهر' : '❌ مخفي'}</li>`;
                    result += `<li>نص الزر: "${downloadBtn.textContent.trim()}"</li>`;
                    result += `<li>الرابط: "${downloadBtn.href}"</li>`;
                    result += `<li>CSS Classes: "${downloadBtn.className}"</li>`;
                } else {
                    result += '<li>❌ زر التحميل غير موجود في DOM</li>';
                }

                if (deleteBtn) {
                    const isVisible = window.getComputedStyle(deleteBtn).display !== 'none';
                    result += `<li>زر الحذف: ${isVisible ? '✅ يظهر' : '❌ مخفي'}</li>`;
                } else {
                    result += '<li>❌ زر الحذف غير موجود في DOM</li>';
                }

                result += '</ul></div>';
                testResult.innerHTML = result;
                testResult.style.display = 'block';
            });

            // تفعيل زر التحميل
            const downloadBtn = document.getElementById('downloadDuplicatesBtn');
            if (downloadBtn) {
                downloadBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    alert('🎉 زر التحميل يعمل!\nسيتم تنزيل الملفات المكررة...');

                    // تنزيل فعلي
                    const link = document.createElement('a');
                    link.href = this.href;
                    link.download = 'duplicate_files.zip';
                    link.click();
                });
            }
        });
    </script>
</body>
</html>
