<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Search Functions</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="public/js/search-results.js"></script>
</head>
<body>
    <h1>JavaScript Function Test</h1>
    <div id="test-results"></div>
    <div id="resultsCount"></div>
    <div id="resultsTableBody"></div>

    <script>
        console.log('Testing search functionality...');

        // Wait for DOM to be ready
        $(document).ready(function() {
            // Test if functions are available immediately
            setTimeout(function() {
                console.log('=== Function Availability Test ===');
                console.log('displayResultsAsTable:', typeof window.displayResultsAsTable);
                console.log('showRecordDetails:', typeof window.showRecordDetails);
                console.log('getStatusBadgeClass:', typeof window.getStatusBadgeClass);
                console.log('displayResults:', typeof window.displayResults);

                if (typeof window.displayResultsAsTable === 'function') {
                    $('#test-results').append('<p style="color: green;">✅ displayResultsAsTable is available</p>');
                } else {
                    $('#test-results').append('<p style="color: red;">❌ displayResultsAsTable is NOT available</p>');
                }

                if (typeof window.displayResults === 'function') {
                    $('#test-results').append('<p style="color: green;">✅ displayResults is available</p>');
                } else {
                    $('#test-results').append('<p style="color: red;">❌ displayResults is NOT available</p>');
                }

                // Test actual function call
                if (typeof window.displayResultsAsTable === 'function') {
                    console.log('=== Testing Function Call ===');
                    try {
                        const testData = {
                            main_records: [
                                {
                                    id: 1,
                                    full_name: 'أحمد محمد علي',
                                    identity_number: '123456789',
                                    phone: '0501234567',
                                    age: 35,
                                    gender: 'ذكر',
                                    city_name: 'الرياض',
                                    province_name: 'الرياض',
                                    request_status: 'مقبول'
                                }
                            ],
                            family_members: [],
                            deceased: []
                        };

                        window.displayResultsAsTable(testData);
                        $('#test-results').append('<p style="color: green;">✅ Function call successful - check table below</p>');
                    } catch (error) {
                        console.error('Error calling function:', error);
                        $('#test-results').append('<p style="color: red;">❌ Function call failed: ' + error.message + '</p>');
                    }
                }
            }, 500);
        });
    </script>
</body>
</html>
