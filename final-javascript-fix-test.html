<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 اختبار إصلاح JavaScript النهائي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            direction: rtl;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .test-card {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .success { background: rgba(40, 167, 69, 0.3); border-color: #28a745; }
        .error { background: rgba(220, 53, 69, 0.3); border-color: #dc3545; }
        .warning { background: rgba(255, 193, 7, 0.3); border-color: #ffc107; }
        .btn {
            padding: 12px 24px;
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-danger { background: linear-gradient(45deg, #dc3545, #e74c3c); }
        .btn-warning { background: linear-gradient(45deg, #ffc107, #f39c12); }
        .btn-info { background: linear-gradient(45deg, #17a2b8, #3498db); }
        .status-icon { font-size: 2rem; margin-left: 15px; }
        .result-text { font-size: 1.1rem; line-height: 1.6; }
        .code-output {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; margin-bottom: 30px;">
            🔧 اختبار إصلاح JavaScript النهائي
        </h1>

        <div class="test-card">
            <h2><span class="status-icon">🟡</span>فحص Syntax JavaScript</h2>
            <button class="btn" onclick="testJavaScriptSyntax()">تشغيل فحص Syntax</button>
            <div id="syntax-result"></div>
        </div>

        <div class="test-card">
            <h2><span class="status-icon">🟡</span>اختبار الدوال والوظائف</h2>
            <button class="btn btn-info" onclick="testFunctions()">اختبار الدوال</button>
            <div id="functions-result"></div>
        </div>

        <div class="test-card">
            <h2><span class="status-icon">🟡</span>اختبار النظام المباشر</h2>
            <button class="btn btn-warning" onclick="testLiveSystem()">اختبار النظام</button>
            <a href="http://localhost:8000/admin/manage-folders" target="_blank" class="btn">فتح صفحة المجلدات</a>
            <div id="system-result"></div>
        </div>

        <div class="test-card">
            <h2><span class="status-icon">📊</span>مراقب الأخطاء المباشر</h2>
            <button class="btn btn-danger" onclick="clearErrorMonitor()">مسح الأخطاء</button>
            <div class="code-output" id="error-monitor">
                جاري مراقبة الأخطاء...
            </div>
        </div>
    </div>

    <script>
        // Error monitoring setup
        const errorMonitor = document.getElementById('error-monitor');
        let errorCount = 0;

        const originalError = console.error;
        const originalWarn = console.warn;
        const originalLog = console.log;

        function addToErrorMonitor(type, message) {
            const time = new Date().toLocaleTimeString('ar-SA');
            const icon = type === 'error' ? '❌' : type === 'warn' ? '⚠️' : '✅';
            errorMonitor.innerHTML += `<div>[${time}] ${icon} ${type.toUpperCase()}: ${message}</div>`;
            errorMonitor.scrollTop = errorMonitor.scrollHeight;

            if (type === 'error') errorCount++;
        }

        console.error = function(...args) {
            originalError.apply(console, args);
            addToErrorMonitor('error', args.join(' '));
        };

        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addToErrorMonitor('warn', args.join(' '));
        };

        console.log = function(...args) {
            originalLog.apply(console, args);
            addToErrorMonitor('log', args.join(' '));
        };

        // Global error handler
        window.addEventListener('error', function(e) {
            addToErrorMonitor('error', `Script Error: ${e.message} at ${e.filename}:${e.lineno}`);
        });

        function clearErrorMonitor() {
            errorMonitor.innerHTML = 'تم مسح مراقب الأخطاء...<br>';
            errorCount = 0;
        }

        function testJavaScriptSyntax() {
            const resultDiv = document.getElementById('syntax-result');
            resultDiv.innerHTML = '<div style="text-align: center;"><span style="animation: spin 1s linear infinite; display: inline-block;">🔄</span> جاري الفحص...</div>';

            let tests = [];
            let passedTests = 0;

            setTimeout(() => {
                // Test 1: Basic syntax
                try {
                    eval('const testVar = "syntax test"; console.log("Syntax test passed");');
                    tests.push('✅ JavaScript Basic Syntax يعمل بشكل صحيح');
                    passedTests++;
                } catch (error) {
                    tests.push('❌ خطأ في JavaScript Syntax: ' + error.message);
                }

                // Test 2: Arrow functions
                try {
                    const arrowFunc = () => 'arrow function test';
                    if (arrowFunc() === 'arrow function test') {
                        tests.push('✅ Arrow Functions تعمل بشكل صحيح');
                        passedTests++;
                    }
                } catch (error) {
                    tests.push('❌ خطأ في Arrow Functions: ' + error.message);
                }

                // Test 3: Template literals
                try {
                    const name = 'اختبار';
                    const template = `مرحبا ${name}`;
                    if (template.includes('اختبار')) {
                        tests.push('✅ Template Literals تعمل بشكل صحيح');
                        passedTests++;
                    }
                } catch (error) {
                    tests.push('❌ خطأ في Template Literals: ' + error.message);
                }

                // Test 4: Event listeners
                try {
                    document.addEventListener('test-event', function() {});
                    tests.push('✅ Event Listeners تعمل بشكل صحيح');
                    passedTests++;
                } catch (error) {
                    tests.push('❌ خطأ في Event Listeners: ' + error.message);
                }

                // Test 5: DOM manipulation
                try {
                    const testDiv = document.createElement('div');
                    testDiv.innerHTML = 'test content';
                    if (testDiv.innerHTML === 'test content') {
                        tests.push('✅ DOM Manipulation يعمل بشكل صحيح');
                        passedTests++;
                    }
                } catch (error) {
                    tests.push('❌ خطأ في DOM Manipulation: ' + error.message);
                }

                const isSuccess = passedTests === tests.length;
                const cardClass = isSuccess ? 'success' : 'error';

                resultDiv.innerHTML = `
                    <div class="test-card ${cardClass}">
                        <h3>${isSuccess ? '🎉' : '⚠️'} نتيجة فحص JavaScript Syntax</h3>
                        <div class="result-text">
                            <strong>النتيجة: ${passedTests}/${tests.length} اختبار نجح</strong><br><br>
                            ${tests.join('<br>')}
                        </div>
                        ${errorCount === 0 ? '<br><div style="color: #28a745;">✅ لا توجد أخطاء في Console!</div>' : `<br><div style="color: #dc3545;">❌ تم اكتشاف ${errorCount} خطأ في Console</div>`}
                    </div>
                `;
            }, 1000);
        }

        function testFunctions() {
            const resultDiv = document.getElementById('functions-result');
            resultDiv.innerHTML = '<div style="text-align: center;"><span style="animation: spin 1s linear infinite; display: inline-block;">🔄</span> جاري اختبار الدوال...</div>';

            let functionTests = [];
            let passedFunctions = 0;

            setTimeout(() => {
                // Test function definition
                try {
                    function testFunction() {
                        return 'function test successful';
                    }

                    if (testFunction() === 'function test successful') {
                        functionTests.push('✅ تعريف الدوال العادية يعمل');
                        passedFunctions++;
                    }
                } catch (error) {
                    functionTests.push('❌ خطأ في تعريف الدوال: ' + error.message);
                }

                // Test anonymous functions
                try {
                    const anonymousFunc = function() { return 'anonymous test'; };
                    if (anonymousFunc() === 'anonymous test') {
                        functionTests.push('✅ الدوال المجهولة تعمل');
                        passedFunctions++;
                    }
                } catch (error) {
                    functionTests.push('❌ خطأ في الدوال المجهولة: ' + error.message);
                }

                // Test callbacks
                try {
                    function testCallback(callback) {
                        return callback('callback test');
                    }

                    const result = testCallback(function(msg) { return msg + ' successful'; });
                    if (result === 'callback test successful') {
                        functionTests.push('✅ Callback Functions تعمل');
                        passedFunctions++;
                    }
                } catch (error) {
                    functionTests.push('❌ خطأ في Callbacks: ' + error.message);
                }

                // Test promises
                try {
                    new Promise((resolve) => resolve('promise test'))
                        .then(result => {
                            if (result === 'promise test') {
                                functionTests.push('✅ Promises تعمل بشكل صحيح');
                                passedFunctions++;
                            }

                            const isSuccess = passedFunctions === functionTests.length;
                            const cardClass = isSuccess ? 'success' : 'warning';

                            resultDiv.innerHTML = `
                                <div class="test-card ${cardClass}">
                                    <h3>${isSuccess ? '🎉' : '⚠️'} نتيجة اختبار الدوال</h3>
                                    <div class="result-text">
                                        <strong>النتيجة: ${passedFunctions}/${functionTests.length} دالة تعمل</strong><br><br>
                                        ${functionTests.join('<br>')}
                                    </div>
                                </div>
                            `;
                        });
                } catch (error) {
                    functionTests.push('❌ خطأ في Promises: ' + error.message);
                }
            }, 800);
        }

        function testLiveSystem() {
            const resultDiv = document.getElementById('system-result');
            resultDiv.innerHTML = '<div style="text-align: center;"><span style="animation: spin 1s linear infinite; display: inline-block;">🔄</span> جاري اختبار النظام المباشر...</div>';

            // Test Laravel server connection
            fetch('http://localhost:8000/admin/manage-folders')
                .then(response => {
                    if (response.ok) {
                        return response.text();
                    } else {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                })
                .then(html => {
                    // Check for common JavaScript errors in the response
                    const hasJSErrors = html.includes('Unexpected token') || html.includes('SyntaxError');
                    const hasBootstrap = html.includes('bootstrap');
                    const hasJQuery = html.includes('jquery') || html.includes('jQuery');

                    let systemTests = [];

                    if (!hasJSErrors) {
                        systemTests.push('✅ لا توجد أخطاء JavaScript في الصفحة');
                    } else {
                        systemTests.push('❌ تم اكتشاف أخطاء JavaScript في الصفحة');
                    }

                    if (hasBootstrap) {
                        systemTests.push('✅ Bootstrap متاح في الصفحة');
                    } else {
                        systemTests.push('⚠️ Bootstrap قد لا يكون متاحاً');
                    }

                    systemTests.push('✅ الخادم يعمل بشكل صحيح');
                    systemTests.push('✅ يمكن الوصول لصفحة المجلدات');

                    const isSuccess = !hasJSErrors;
                    const cardClass = isSuccess ? 'success' : 'warning';

                    resultDiv.innerHTML = `
                        <div class="test-card ${cardClass}">
                            <h3>${isSuccess ? '🎉' : '⚠️'} نتيجة اختبار النظام المباشر</h3>
                            <div class="result-text">
                                ${systemTests.join('<br>')}<br><br>
                                <strong>الحالة: ${isSuccess ? 'النظام يعمل بشكل مثالي' : 'يحتاج مراجعة'}</strong>
                            </div>
                        </div>
                    `;
                })
                .catch(error => {
                    resultDiv.innerHTML = `
                        <div class="test-card error">
                            <h3>❌ فشل في الاتصال بالنظام</h3>
                            <div class="result-text">
                                <strong>خطأ:</strong> ${error.message}<br><br>
                                تأكد من تشغيل Laravel server على localhost:8000<br>
                                استخدم الأمر: <code>php artisan serve</code>
                            </div>
                        </div>
                    `;
                });
        }

        // Auto-run syntax test on page load
        window.onload = function() {
            console.log('🚀 بدء الاختبارات التلقائية...');
            addToErrorMonitor('log', 'تم تحميل صفحة الاختبار بنجاح');

            setTimeout(() => {
                testJavaScriptSyntax();
            }, 1000);
        };

        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
