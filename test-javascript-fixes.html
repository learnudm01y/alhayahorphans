<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار إصلاح دوال JavaScript</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.7.20/sweetalert2.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center mb-4">🔧 اختبار إصلاح دوال JavaScript</h2>

        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-bug me-2"></i>
                            فحص الدوال المطلوبة
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="test-results"></div>
                        <button class="btn btn-success mt-3" onclick="runTests()">
                            <i class="fas fa-play me-2"></i>
                            تشغيل الاختبارات
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- محاكاة البيئة المطلوبة -->
    <div class="d-none">
        <div data-upload-zone="family_0">
            <div class="mainDocumentPreview"></div>
        </div>
        <div class="family-member-form">
            <input class="mainDocumentFileInput" type="file">
            <div class="mainDocumentPreview"></div>
            <select class="mainDocumentTypeSelect">
                <option value="">اختر نوع الوثيقة</option>
                <option value="national_id">بطاقة الهوية</option>
            </select>
        </div>
    </div>

    <script>
        // محاكاة window.allDocs
        if (!window.allDocs) {
            window.allDocs = new Map();
        }

        // محاكاة دالة setupDocumentUploadHandlersForMember
        window.setupDocumentUploadHandlersForMember = function(form, idx) {
            console.log(`✅ setupDocumentUploadHandlersForMember called for form ${idx}`);
            return true;
        };

        // تضمين الدوال المطلوبة (محاكاة)
        function renderAttachmentTasksUI(personKey) {
            console.log(`🎨 renderAttachmentTasksUI called for: ${personKey}`);
            return true;
        }

        function removeAllAttachmentTasksForPersonKey(personKey) {
            console.log(`🗑️ removeAllAttachmentTasksForPersonKey called for: ${personKey}`);
            return true;
        }

        function preserveMainAndDeceasedAttachments() {
            console.log(`🛡️ preserveMainAndDeceasedAttachments called`);
            return true;
        }

        window.restoreMainAndDeceasedAttachments = function(forceRestore = false) {
            console.log(`🔄 restoreMainAndDeceasedAttachments called with forceRestore: ${forceRestore}`);
            return true;
        };

        // إتاحة الدوال في النطاق العلوي
        window.renderAttachmentTasksUI = renderAttachmentTasksUI;
        window.removeAllAttachmentTasksForPersonKey = removeAllAttachmentTasksForPersonKey;
        window.preserveMainAndDeceasedAttachments = preserveMainAndDeceasedAttachments;

        function runTests() {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '';

            const tests = [
                {
                    name: 'renderAttachmentTasksUI',
                    func: () => typeof window.renderAttachmentTasksUI === 'function'
                },
                {
                    name: 'removeAllAttachmentTasksForPersonKey',
                    func: () => typeof window.removeAllAttachmentTasksForPersonKey === 'function'
                },
                {
                    name: 'preserveMainAndDeceasedAttachments',
                    func: () => typeof window.preserveMainAndDeceasedAttachments === 'function'
                },
                {
                    name: 'restoreMainAndDeceasedAttachments',
                    func: () => typeof window.restoreMainAndDeceasedAttachments === 'function'
                },
                {
                    name: 'window.allDocs',
                    func: () => window.allDocs instanceof Map
                },
                {
                    name: 'setupDocumentUploadHandlersForMember',
                    func: () => typeof window.setupDocumentUploadHandlersForMember === 'function'
                }
            ];

            let passedTests = 0;
            let totalTests = tests.length;

            tests.forEach(test => {
                const result = test.func();
                const status = result ? 'success' : 'danger';
                const icon = result ? 'check-circle' : 'times-circle';

                if (result) passedTests++;

                resultsDiv.innerHTML += `
                    <div class="alert alert-${status} d-flex align-items-center mb-2">
                        <i class="fas fa-${icon} me-2"></i>
                        <strong>${test.name}:</strong>
                        <span class="ms-auto">${result ? '✅ موجودة' : '❌ مفقودة'}</span>
                    </div>
                `;
            });

            // اختبار فعلي للدوال
            console.log('\n=== بدء الاختبارات الفعلية ===');

            try {
                window.renderAttachmentTasksUI('family_0');
                window.removeAllAttachmentTasksForPersonKey('family_0');
                window.preserveMainAndDeceasedAttachments();
                window.restoreMainAndDeceasedAttachments(true);

                resultsDiv.innerHTML += `
                    <div class="alert alert-info mt-3">
                        <i class="fas fa-info-circle me-2"></i>
                        <strong>نتيجة الاختبار:</strong> ${passedTests}/${totalTests} دوال تعمل بنجاح
                        <br>
                        <small>تحقق من الكونسول لمزيد من التفاصيل</small>
                    </div>
                `;

                if (passedTests === totalTests) {
                    Swal.fire({
                        icon: 'success',
                        title: 'تم الإصلاح بنجاح!',
                        text: `جميع الدوال المطلوبة (${totalTests}) موجودة وتعمل`,
                        timer: 3000,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire({
                        icon: 'warning',
                        title: 'إصلاح جزئي',
                        text: `${passedTests} من ${totalTests} دوال تعمل بشكل صحيح`,
                        timer: 3000,
                        showConfirmButton: false
                    });
                }
            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="alert alert-danger mt-3">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <strong>خطأ أثناء الاختبار:</strong> ${error.message}
                    </div>
                `;
                console.error('خطأ في الاختبار:', error);
            }
        }

        // تشغيل الاختبارات تلقائياً
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(runTests, 1000);
        });
    </script>
</body>
</html>
