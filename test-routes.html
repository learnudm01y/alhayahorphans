<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار مسارات الملفات المكررة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h3>اختبار مسارات الملفات المكررة</h3>
            </div>
            <div class="card-body">
                <div id="testResults"></div>
                <button id="testBtn" class="btn btn-primary">اختبار المسارات</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('testBtn').addEventListener('click', async function() {
            const results = document.getElementById('testResults');
            results.innerHTML = '<p>جاري الاختبار...</p>';

            const testSessionId = 'test_session_123';
            const routes = [
                { name: 'duplicate-summary', url: `/admin/file/duplicate-summary?session_id=${testSessionId}` },
                { name: 'download-duplicates', url: `/admin/file/download-duplicates?session_id=${testSessionId}` },
                { name: 'download-duplicate', url: `/admin/file/download-duplicate?session_id=${testSessionId}&file=test.jpg` },
                { name: 'analytics', url: '/api/files/analytics' }
            ];

            let html = '<div class="list-group">';

            for (const route of routes) {
                try {
                    const response = await fetch(route.url, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const status = response.status;
                    const isOk = status !== 404;
                    const color = isOk ? 'success' : 'danger';
                    const icon = isOk ? '✅' : '❌';

                    html += `
                        <div class="list-group-item list-group-item-${color}">
                            ${icon} <strong>${route.name}</strong> - Status: ${status}
                            <br><small>${route.url}</small>
                        </div>
                    `;
                } catch (error) {
                    html += `
                        <div class="list-group-item list-group-item-warning">
                            ⚠️ <strong>${route.name}</strong> - خطأ: ${error.message}
                            <br><small>${route.url}</small>
                        </div>
                    `;
                }
            }

            html += '</div>';
            results.innerHTML = html;
        });

        // اختبار تلقائي عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', function() {
            document.getElementById('testBtn').click();
        });
    </script>
</body>
</html>
