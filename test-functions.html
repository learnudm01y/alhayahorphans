<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار وظائف البحث</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>

<div class="container mt-4">
    <h3>اختبار وظائف البحث</h3>

    <div class="row mt-3">
        <div class="col-md-6">
            <button class="btn btn-success" onclick="testExportFunction()">
                <i class="fas fa-file-excel"></i> اختبار تصدير Excel
            </button>
        </div>
        <div class="col-md-6">
            <button class="btn btn-info" onclick="testRecordDetails()">
                <i class="fas fa-eye"></i> اختبار عرض التفاصيل
            </button>
        </div>
    </div>

    <!-- جدول تجريبي -->
    <table class="table mt-4" style="display: none;">
        <tbody id="resultsTableBody">
            <tr>
                <td>1</td>
                <td>محمد أحمد علي</td>
                <td>123456789</td>
                <td>0501234567</td>
                <td>30</td>
                <td>ذكر</td>
                <td>الرياض</td>
                <td>الرياض</td>
                <td>مقبول</td>
            </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
function testExportFunction() {
    // محاكاة دالة التصدير
    const tableData = [
        ['1', 'محمد أحمد علي', '123456789', '0501234567', '30', 'ذكر', 'الرياض', 'الرياض', 'مقبول']
    ];

    try {
        const headers = ['#', 'الاسم الكامل', 'رقم الهوية', 'رقم الجوال', 'العمر', 'الجنس', 'المدينة', 'المحافظة', 'حالة الطلب'];
        const ws = XLSX.utils.aoa_to_sheet([headers, ...tableData]);

        const colWidths = [
            { wch: 5 }, { wch: 25 }, { wch: 15 }, { wch: 15 },
            { wch: 8 }, { wch: 8 }, { wch: 15 }, { wch: 15 }, { wch: 15 }
        ];
        ws['!cols'] = colWidths;

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'نتائج البحث');

        const filename = `اختبار_تصدير_${new Date().toISOString().slice(0, 10)}.xlsx`;
        XLSX.writeFile(wb, filename);

        Swal.fire({
            icon: 'success',
            title: 'تم التصدير بنجاح',
            text: 'تم تصدير البيانات إلى ملف Excel',
            confirmButtonText: 'موافق'
        });

    } catch (error) {
        console.error('خطأ في التصدير:', error);
        Swal.fire({
            icon: 'error',
            title: 'خطأ في التصدير',
            text: 'حدث خطأ أثناء تصدير البيانات',
            confirmButtonText: 'موافق'
        });
    }
}

function testRecordDetails() {
    // محاكاة سجل
    const record = {
        id: 123,
        record_type: 'سجل رئيسي',
        full_name: 'محمد أحمد علي',
        identity_number: '123456789'
    };

    // محاكاة التوجه لصفحة العرض
    Swal.fire({
        icon: 'info',
        title: 'سيتم التوجه لصفحة العرض',
        text: `سيتم التوجه إلى: /admin/records/management/${record.id}/show`,
        confirmButtonText: 'موافق'
    }).then(() => {
        // في التطبيق الحقيقي سيكون:
        // window.location.href = `/admin/records/management/${record.id}/show`;
        console.log('التوجه إلى:', `/admin/records/management/${record.id}/show`);
    });
}
</script>

</body>
</html>
