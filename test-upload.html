<!DOCTYPE html>
<html>
<head>
    <title>Test File Upload</title>
</head>
<body>
    <h2>Test File Upload</h2>
    <form id="uploadForm" enctype="multipart/form-data">
        <div>
            <label>Record Number:</label>
            <input type="text" id="record_number" value="001429" required>
        </div>
        <div>
            <label>Person ID:</label>
            <input type="text" id="person_id" value="">
        </div>
        <div>
            <label>File:</label>
            <input type="file" id="fileInput" required>
        </div>
        <div>
            <button type="button" onclick="uploadFile()">Upload</button>
        </div>
    </form>

    <div id="result"></div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const recordNumber = document.getElementById('record_number').value;
            const personId = document.getElementById('person_id').value;

            if (!fileInput.files[0]) {
                alert('Please select a file');
                return;
            }

            const formData = new FormData();
            formData.append('files[]', fileInput.files[0]);
            formData.append('record_number', recordNumber);
            if (personId) {
                formData.append('person_id', personId);
            }
            formData.append('auto_compress', '1');
            formData.append('cloud_sync', '0');
            formData.append('ocr_processing', '0');
            formData.append('auto_organize', '1');

            try {
                const response = await fetch('http://127.0.0.1:8000/api/files/smart-upload', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                const result = await response.text();
                document.getElementById('result').innerHTML = `
                    <h3>Response (Status: ${response.status}):</h3>
                    <pre>${result}</pre>
                `;

                if (response.ok) {
                    console.log('Upload successful:', result);
                } else {
                    console.error('Upload failed:', result);
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h3>Error:</h3>
                    <pre>${error.message}</pre>
                `;
                console.error('Upload error:', error);
            }
        }
    </script>
</body>
</html>
