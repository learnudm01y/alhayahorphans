<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار نظام أفراد الأسرة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center mb-4">اختبار نظام أفراد الأسرة</h2>

        <!-- زر إضافة فرد -->
        <div class="text-center mb-3">
            <button type="button" id="addFamilyMember" class="btn btn-primary">
                <i class="fas fa-plus me-2"></i>إضافة فرد جديد
            </button>
        </div>

        <!-- حاوية أفراد الأسرة -->
        <div id="familyMembersContainer">
            <!-- سيتم إضافة نماذج أفراد الأسرة هنا -->
        </div>

        <!-- قالب فرد الأسرة (مخفي) -->
        <div id="familyMemberTemplate" class="family-member-form d-none">
            <div class="card mb-3">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">الاسم الأول</label>
                            <input type="text" name="family_members[0][first_name]" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">اسم العائلة</label>
                            <input type="text" name="family_members[0][last_name]" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">رقم الهوية</label>
                            <input type="text" name="family_members[0][person_id]" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">تاريخ الميلاد</label>
                            <input type="date" name="family_members[0][person_birth_date]" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">الجنس</label>
                            <select name="family_members[0][person_gender]" class="form-select">
                                <option value="">اختر الجنس</option>
                                <option value="male">ذكر</option>
                                <option value="female">أنثى</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">نوع الوثيقة</label>
                            <select class="form-select mainDocumentTypeSelect">
                                <option value="">اختر نوع الوثيقة</option>
                                <option value="id_card">بطاقة الهوية</option>
                                <option value="birth_cert">شهادة الميلاد</option>
                                <option value="passport">جواز السفر</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <input type="file" class="form-control mainDocumentFileInput" accept="image/*,.pdf">
                        </div>
                        <div class="col-12">
                            <div class="mainDocumentPreview" style="display: none;"></div>
                            <div class="mainDocumentNames"></div>
                        </div>
                    </div>
                    <div data-upload-zone="family_0"></div>
                </div>
            </div>
        </div>

        <!-- حقول مخفية للاختبار -->
        <input type="hidden" name="file_id_number" value="TEST123">

        <!-- منطقة عرض النتائج -->
        <div id="testResults" class="mt-4"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- سكريبت نظام أفراد الأسرة -->
    <script>
        // Cache buster: 2025-01-06-v1.0.1
        document.addEventListener('DOMContentLoaded', function() {
            // تهيئة window.allDocs مع دعم بوابة أفراد الأسرة
            setTimeout(function() {
                if (typeof window.allDocs !== 'object' || !window.allDocs) {
                    window.allDocs = new Map();
                    console.log(`🔧 [familyMember] تم إنشاء window.allDocs جديد`);
                }

                // التحقق من صحة structure
                if (!(window.allDocs instanceof Map)) {
                    console.warn(`⚠️ [familyMember] window.allDocs ليس Map، تحويل...`);
                    const tempMap = new Map();
                    if (typeof window.allDocs === 'object') {
                        Object.keys(window.allDocs).forEach(key => {
                            tempMap.set(key, window.allDocs[key]);
                        });
                    }
                    window.allDocs = tempMap;
                }

                console.log(`✅ [familyMember] تم تهيئة window.allDocs:`, {
                    type: typeof window.allDocs,
                    isMap: window.allDocs instanceof Map,
                    keysCount: window.allDocs instanceof Map ? window.allDocs.size : 'غير صالح',
                    keys: window.allDocs instanceof Map ? Array.from(window.allDocs.keys()) : 'غير صالح'
                });
            }, 0);

            // دالة إضافة فرد جديد
            window.addFamilyMember = function addFamilyMember() {
                console.log('🚀 بدء إضافة فرد جديد...');

                const container = document.getElementById('familyMembersContainer');
                if (!container) {
                    console.error('❌ حاوية أفراد الأسرة غير موجودة');
                    return;
                }

                let forms = container.querySelectorAll('.family-member-form:not(.d-none)');
                let template = document.getElementById('familyMemberTemplate');
                if (!template) {
                    console.error('❌ قالب فرد الأسرة غير موجود');
                    return;
                }

                let newIndex = forms.length;
                let clone = template.cloneNode(true);
                clone.classList.remove('d-none');
                clone.removeAttribute('id');
                clone.setAttribute('data-member-index', newIndex);

                console.log(`📝 إنشاء فرد جديد بالفهرس: ${newIndex}`);

                // تحديث أسماء الحقول والفهارس
                clone.querySelectorAll('[name]').forEach(function(input) {
                    input.name = input.name.replace(/family_members\[\d+\]/g, `family_members[${newIndex}]`);
                    if (input.type === 'text' || input.type === 'number' || input.type === 'date') {
                        input.value = '';
                    } else if (input.tagName === 'SELECT') {
                        input.selectedIndex = 0;
                    }
                });

                // تحديث data-upload-zone
                const uploadZone = clone.querySelector('[data-upload-zone]');
                if (uploadZone) {
                    uploadZone.setAttribute('data-upload-zone', `family_${newIndex}`);
                }

                // تحديث معرفات العناصر
                const docType = clone.querySelector('.mainDocumentTypeSelect');
                if (docType) docType.id = `mainDocumentTypeSelect_${newIndex}`;
                const fileInput = clone.querySelector('.mainDocumentFileInput');
                if (fileInput) fileInput.id = `mainDocumentFileInput_${newIndex}`;
                const preview = clone.querySelector('.mainDocumentPreview');
                if (preview) preview.id = `mainDocumentPreview_${newIndex}`;

                // مسح المحتوى السابق
                clone.querySelectorAll('.mainDocumentPreview, .mainDocumentNames').forEach(div => div.innerHTML = '');

                // تهيئة window.allDocs
                if (window.allDocs && window.allDocs instanceof Map) {
                    window.allDocs.set(`family_${newIndex}`, []);
                }

                // إضافة header وزر حذف
                let cardHeader = clone.querySelector('.card-header');
                if (!cardHeader) {
                    cardHeader = document.createElement('div');
                    cardHeader.className = 'card-header bg-gradient-primary text-dark py-3 d-flex justify-content-between align-items-center';
                    cardHeader.innerHTML = `
                        <h5 class="card-title mb-0 d-flex align-items-center">
                            <i class="fas fa-user fs-4 me-2"></i>
                            بيانات فرد الأسرة (${newIndex + 1})
                        </h5>
                        <button type="button" class="btn btn-danger btn-sm delete-member">
                            <i class="fas fa-times"></i>
                        </button>
                    `;
                    const cardBody = clone.querySelector('.card-body');
                    clone.insertBefore(cardHeader, cardBody);
                }

                // ربط زر الحذف
                cardHeader.querySelector('.delete-member').onclick = function(e) {
                    e.preventDefault();
                    if (confirm('هل أنت متأكد من حذف هذا الفرد؟')) {
                        clone.remove();
                        console.log(`🗑️ تم حذف فرد الأسرة ${newIndex}`);
                        if (typeof window.reindexFamilyMembers === 'function') {
                            window.reindexFamilyMembers();
                        }
                    }
                };

                container.appendChild(clone);
                console.log(`✅ تم إضافة فرد جديد بنجاح: ${newIndex}`);

                // إعادة الفهرسة
                if (typeof window.reindexFamilyMembers === 'function') {
                    window.reindexFamilyMembers();
                }
            };

            // دالة إعادة الفهرسة
            window.reindexFamilyMembers = function reindexFamilyMembers() {
                const forms = document.querySelectorAll('#familyMembersContainer .family-member-form:not(.d-none)');
                console.log(`🔄 إعادة فهرسة ${forms.length} فرد`);

                forms.forEach(function(form, idx) {
                    form.setAttribute('data-member-index', idx);

                    // تحديث أسماء الحقول
                    form.querySelectorAll('[name]').forEach(function(input) {
                        input.name = input.name.replace(/family_members\[\d+\]/g, `family_members[${idx}]`);
                    });

                    // تحديث العنوان
                    const header = form.querySelector('.card-header h5');
                    if (header) {
                        header.innerHTML = `
                            <i class="fas fa-user fs-4 me-2"></i>
                            بيانات فرد الأسرة (${idx + 1})
                        `;
                    }
                });
            };

            // ربط زر إضافة فرد
            const addBtn = document.getElementById('addFamilyMember');
            if (addBtn) {
                addBtn.onclick = window.addFamilyMember;
                console.log('✅ تم ربط زر إضافة فرد');
            } else {
                console.error('❌ زر إضافة فرد غير موجود');
            }

            console.log('✅ [familyMember] تم تحميل جميع المعالجات بنجاح');
        });
    </script>

    <!-- سكريبت الاختبار -->
    <script src="quick-family-file-test.js"></script>
</body>
</html>
