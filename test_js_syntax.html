<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Syntax Test</title>
</head>
<body>
    <h1>Testing JavaScript Syntax</h1>
    <div id="test-result"></div>

<script>
// نسخ مبسطة من دالة updateTableContent للاختبار
function updateTableContent(results) {
    console.log('🔄 Updating table content with search results:', results);

    const container = document.getElementById('files_table_container');
    if (!container) {
        console.log('❌ Container غير موجود');
        return;
    }

    if (!results || !results.data || results.data.length === 0) {
        console.log('لا توجد نتائج');
        return;
    }

    let tableHtml = '<table><tbody>';

    results.data.forEach(file => {
        const fileName = file.name || 'ملف';
        tableHtml += `<tr><td>${fileName}</td></tr>`;
    });

    tableHtml += '</tbody></table>';
    console.log('✅ تم تحديث الجدول بنجاح');
}

// اختبار الدالة
const testData = {
    data: [
        { name: 'test1.jpg' },
        { name: 'test2.pdf' }
    ]
};

updateTableContent(testData);
document.getElementById('test-result').innerHTML = '✅ JavaScript syntax is correct!';
</script>

</body>
</html>
