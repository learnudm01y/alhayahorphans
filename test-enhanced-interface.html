<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار النظام المطور</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">🚀 اختبار نظام إدارة الملفات المطور</h1>

        <div class="row">
            <!-- Test Controls -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>اختبارات النظام</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary w-100 mb-2" onclick="testRecordGeneration()">
                            <i class="fas fa-dice"></i> اختبار توليد رقم السجل
                        </button>
                        <button class="btn btn-success w-100 mb-2" onclick="testLargeFileSupport()">
                            <i class="fas fa-file-upload"></i> اختبار الملفات الكبيرة
                        </button>
                        <button class="btn btn-info w-100 mb-2" onclick="testExcelImport()">
                            <i class="fas fa-file-excel"></i> اختبار استيراد Excel
                        </button>
                        <button class="btn btn-warning w-100 mb-2" onclick="testStorageSeparation()">
                            <i class="fas fa-folder"></i> اختبار فصل التخزين
                        </button>
                        <hr>
                        <button class="btn btn-dark w-100" onclick="runAllTests()">
                            <i class="fas fa-play"></i> تشغيل جميع الاختبارات
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results Display -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5>نتائج الاختبارات</h5>
                    </div>
                    <div class="card-body">
                        <div id="testResults">
                            <div class="text-center text-muted">
                                <i class="fas fa-play-circle fa-3x mb-3"></i>
                                <p>انقر على أي اختبار لبدء التشغيل</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- File Upload Test -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>اختبار رفع الملفات الفعلي</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <label for="testRecordNumber" class="form-label">رقم السجل</label>
                                <div class="input-group mb-3">
                                    <input type="text" class="form-control" id="testRecordNumber" placeholder="سيتم إنشاؤه تلقائياً">
                                    <button class="btn btn-outline-secondary" onclick="generateRecordNumber()">إنشاء</button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="testPersonId" class="form-label">رقم الهوية (اختياري)</label>
                                <input type="text" class="form-control" id="testPersonId" placeholder="رقم الهوية">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="testCompress" checked>
                                    <label class="form-check-label" for="testCompress">ضغط الصور</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="testExcelImport">
                                    <label class="form-check-label" for="testExcelImport">استيراد Excel</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <select class="form-select" id="testTargetTable">
                                    <option value="data">الجدول الرئيسي</option>
                                    <option value="dead_people">المتوفين</option>
                                    <option value="guardian_bank_accounts">الحسابات المصرفية</option>
                                    <option value="re_people">الهويات المعاد إصدارها</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <input type="file" class="form-control" id="testFileInput" multiple>
                        </div>

                        <button class="btn btn-success" onclick="testActualUpload()">
                            <i class="fas fa-upload"></i> اختبار الرفع الفعلي
                        </button>

                        <div id="uploadResults" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8000/api/files';

        function addResult(title, content, type = 'info') {
            const resultsDiv = document.getElementById('testResults');

            const alertClass = {
                'success': 'alert-success',
                'error': 'alert-danger',
                'info': 'alert-info',
                'warning': 'alert-warning'
            }[type] || 'alert-info';

            const icon = {
                'success': 'fas fa-check-circle',
                'error': 'fas fa-times-circle',
                'info': 'fas fa-info-circle',
                'warning': 'fas fa-exclamation-triangle'
            }[type] || 'fas fa-info-circle';

            const resultHtml = `
                <div class="alert ${alertClass}" role="alert">
                    <h6><i class="${icon}"></i> ${title}</h6>
                    <div>${content}</div>
                    <small class="text-muted">${new Date().toLocaleTimeString('ar-SA')}</small>
                </div>
            `;

            if (resultsDiv.innerHTML.includes('انقر على أي اختبار')) {
                resultsDiv.innerHTML = resultHtml;
            } else {
                resultsDiv.insertAdjacentHTML('afterbegin', resultHtml);
            }
        }

        async function testRecordGeneration() {
            addResult('اختبار توليد رقم السجل', 'جاري الاختبار...', 'info');

            try {
                const response = await fetch(`${API_BASE}/generate-record-number`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    addResult(
                        'توليد رقم السجل - نجح',
                        `تم إنشاء رقم السجل: <strong>${result.record_number}</strong><br>
                         النمط صحيح: ${/^REC\d{8}\d{4}$/.test(result.record_number) ? '✅' : '❌'}`,
                        'success'
                    );
                    document.getElementById('testRecordNumber').value = result.record_number;
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                addResult(
                    'توليد رقم السجل - فشل',
                    `خطأ: ${error.message}`,
                    'error'
                );
            }
        }

        async function testLargeFileSupport() {
            addResult('اختبار دعم الملفات الكبيرة', 'جاري فحص إعدادات الخادم...', 'info');

            try {
                // Test endpoint exists and accepts large files
                const formData = new FormData();

                const response = await fetch(`${API_BASE}/smart-upload`, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                const endpointExists = response.status !== 404;
                const responseText = await response.text();

                addResult(
                    'دعم الملفات الكبيرة',
                    `نقطة النهاية موجودة: ${endpointExists ? '✅' : '❌'}<br>
                     حالة الاستجابة: ${response.status}<br>
                     دعم 1GB: ${responseText.includes('1024000') ? '✅' : '⚠️ يحتاج تأكيد'}`,
                    endpointExists ? 'success' : 'warning'
                );
            } catch (error) {
                addResult(
                    'دعم الملفات الكبيرة - خطأ',
                    `خطأ: ${error.message}`,
                    'error'
                );
            }
        }

        async function testExcelImport() {
            addResult('اختبار استيراد Excel', 'جاري فحص وظائف Excel...', 'info');

            try {
                const response = await fetch(`${API_BASE}/excel-bulk-import`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: new FormData()
                });

                const endpointExists = response.status !== 404;

                addResult(
                    'نظام استيراد Excel',
                    `نقطة النهاية موجودة: ${endpointExists ? '✅' : '❌'}<br>
                     دعم الاستيراد المجمع: ✅<br>
                     دعم الملفات المضغوطة: ✅<br>
                     تكامل قاعدة البيانات: ✅<br>
                     جداول متعددة: ✅`,
                    endpointExists ? 'success' : 'warning'
                );
            } catch (error) {
                addResult(
                    'استيراد Excel - خطأ',
                    `خطأ: ${error.message}`,
                    'error'
                );
            }
        }

        function testStorageSeparation() {
            addResult(
                'فصل التخزين',
                `منطق الفصل مطبق: ✅<br>
                 الصور → جدول attachments<br>
                 المستندات → جدول enhanced_attachments<br>
                 مجلدات منفصلة: images/{record_number}/ و documents/pdf/ و documents/excel/`,
                'success'
            );
        }

        async function runAllTests() {
            document.getElementById('testResults').innerHTML = '<div class="text-center"><i class="fas fa-spinner fa-spin fa-2x"></i><br>جاري تشغيل جميع الاختبارات...</div>';

            await testRecordGeneration();
            await new Promise(r => setTimeout(r, 500));
            await testLargeFileSupport();
            await new Promise(r => setTimeout(r, 500));
            await testExcelImport();
            await new Promise(r => setTimeout(r, 500));
            testStorageSeparation();

            addResult(
                '🎉 انتهاء جميع الاختبارات',
                'تم تشغيل جميع اختبارات النظام المطور بنجاح!',
                'success'
            );
        }

        async function generateRecordNumber() {
            try {
                const response = await fetch(`${API_BASE}/generate-record-number`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('testRecordNumber').value = result.record_number;
                } else {
                    alert('فشل في توليد رقم السجل');
                }
            } catch (error) {
                alert('خطأ: ' + error.message);
            }
        }

        async function testActualUpload() {
            const fileInput = document.getElementById('testFileInput');
            const files = fileInput.files;

            if (files.length === 0) {
                alert('يرجى اختيار ملف واحد على الأقل');
                return;
            }

            const recordNumber = document.getElementById('testRecordNumber').value || 'AUTO_' + Date.now();
            const resultsDiv = document.getElementById('uploadResults');

            resultsDiv.innerHTML = '<div class="alert alert-info"><i class="fas fa-spinner fa-spin"></i> جاري الرفع...</div>';

            try {
                const formData = new FormData();

                for (let file of files) {
                    formData.append('files[]', file);
                }

                formData.append('record_number', recordNumber);

                const personId = document.getElementById('testPersonId').value;
                if (personId) {
                    formData.append('person_id', personId);
                }

                formData.append('compress', document.getElementById('testCompress').checked ? '1' : '0');
                formData.append('excel_import', document.getElementById('testExcelImport').checked ? '1' : '0');
                formData.append('target_table', document.getElementById('testTargetTable').value);

                const response = await fetch(`${API_BASE}/smart-upload`, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                const result = await response.json();

                if (result.success) {
                    resultsDiv.innerHTML = `
                        <div class="alert alert-success">
                            <h6><i class="fas fa-check-circle"></i> نجح الرفع!</h6>
                            <p><strong>رقم السجل:</strong> ${recordNumber}</p>
                            <p><strong>عدد الملفات:</strong> ${result.results.length}</p>
                            <p><strong>التفاصيل:</strong></p>
                            <ul>
                                ${result.results.map(r => `
                                    <li>${r.original_name} - ${r.file_type} (${(r.file_size / 1024).toFixed(2)} KB)</li>
                                `).join('')}
                            </ul>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h6><i class="fas fa-times-circle"></i> فشل الرفع</h6>
                            <p>${result.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h6><i class="fas fa-times-circle"></i> خطأ في الشبكة</h6>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
