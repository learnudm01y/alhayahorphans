<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 فحص حالة النظام - أفراد الأسرة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .status-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .status-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .status-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .status-card.success {
            border-color: #28a745;
            background: #d4edda;
        }

        .status-card.warning {
            border-color: #ffc107;
            background: #fff3cd;
        }

        .status-card.error {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .status-icon {
            font-size: 2em;
            margin-bottom: 10px;
            display: block;
        }

        .status-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .status-details {
            font-size: 0.9em;
            line-height: 1.5;
        }

        .test-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .test-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }

        .test-btn:hover {
            background: #0056b3;
        }

        .log-output {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.8em;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .status-grid {
                grid-template-columns: 1fr;
                gap: 15px;
                padding: 20px;
            }

            .header {
                padding: 20px;
            }

            .test-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="status-container">
        <div class="header">
            <h1>🔧 فحص حالة النظام</h1>
            <p>نظام رفع الملفات وعرض الصور - بوابة أفراد الأسرة</p>
        </div>

        <div class="status-grid">
            <div class="status-card" id="device-info">
                <span class="status-icon">📱</span>
                <div class="status-title">معلومات الجهاز</div>
                <div class="status-details" id="device-details">جاري التحقق...</div>
            </div>

            <div class="status-card" id="css-status">
                <span class="status-icon">🎨</span>
                <div class="status-title">حالة الأنماط (CSS)</div>
                <div class="status-details" id="css-details">جاري التحقق...</div>
                <div class="test-buttons">
                    <button class="test-btn" onclick="testCSSResponsive()">اختبار الاستجابة</button>
                    <button class="test-btn" onclick="forceCSSReload()">إعادة تحميل CSS</button>
                </div>
            </div>

            <div class="status-card" id="js-status">
                <span class="status-icon">⚙️</span>
                <div class="status-title">حالة JavaScript</div>
                <div class="status-details" id="js-details">جاري التحقق...</div>
                <div class="test-buttons">
                    <button class="test-btn" onclick="testJSFunctions()">اختبار الوظائف</button>
                    <button class="test-btn" onclick="testFileUpload()">اختبار رفع الملفات</button>
                </div>
            </div>

            <div class="status-card" id="modal-status">
                <span class="status-icon">🪟</span>
                <div class="status-title">حالة النوافذ المنبثقة</div>
                <div class="status-details" id="modal-details">جاري التحقق...</div>
                <div class="test-buttons">
                    <button class="test-btn" onclick="testCropperModal()">اختبار Cropper</button>
                    <button class="test-btn" onclick="cleanModalBackdrops()">تنظيف الخلفيات</button>
                </div>
            </div>

            <div class="status-card" id="performance-status">
                <span class="status-icon">⚡</span>
                <div class="status-title">الأداء والاستجابة</div>
                <div class="status-details" id="performance-details">جاري التحقق...</div>
                <div class="test-buttons">
                    <button class="test-btn" onclick="testPerformance()">قياس الأداء</button>
                    <button class="test-btn" onclick="testTouchEvents()">اختبار اللمس</button>
                </div>
            </div>

            <div class="status-card" id="fixes-status">
                <span class="status-icon">🔧</span>
                <div class="status-title">الإصلاحات المطبقة</div>
                <div class="status-details" id="fixes-details">جاري التحقق...</div>
                <div class="test-buttons">
                    <button class="test-btn" onclick="runAllFixes()">تطبيق جميع الإصلاحات</button>
                    <button class="test-btn" onclick="exportReport()">تصدير التقرير</button>
                </div>
            </div>
        </div>

        <div class="log-output" id="log-output">
            <div>🔍 بدء فحص النظام...</div>
        </div>
    </div>

    <script>
        // متغيرات عامة للتشخيص
        let statusData = {
            device: {},
            css: {},
            js: {},
            modal: {},
            performance: {},
            fixes: [],
            logs: []
        };

        // إضافة لوج
        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleString('ar-SA');
            const logEntry = `[${timestamp}] ${message}`;
            statusData.logs.push({timestamp, message, type});

            const logOutput = document.getElementById('log-output');
            const logDiv = document.createElement('div');
            logDiv.textContent = logEntry;
            logDiv.style.color = type === 'error' ? '#ff6b6b' :
                               type === 'warning' ? '#feca57' :
                               type === 'success' ? '#48dbfb' : '#00ff00';
            logOutput.appendChild(logDiv);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        // فحص معلومات الجهاز
        function checkDeviceInfo() {
            const device = {
                userAgent: navigator.userAgent,
                screenSize: `${window.innerWidth} × ${window.innerHeight}`,
                devicePixelRatio: window.devicePixelRatio,
                touchSupport: 'ontouchstart' in window,
                orientation: screen.orientation ? screen.orientation.type : 'unknown',
                isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent),
                isTablet: /iPad|Android.*tablet/i.test(navigator.userAgent),
                viewport: `${document.documentElement.clientWidth} × ${document.documentElement.clientHeight}`
            };

            statusData.device = device;

            const card = document.getElementById('device-info');
            const details = document.getElementById('device-details');

            details.innerHTML = `
                <strong>نوع الجهاز:</strong> ${device.isMobile ? 'جوال' : device.isTablet ? 'لوحي' : 'سطح مكتب'}<br>
                <strong>حجم الشاشة:</strong> ${device.screenSize}<br>
                <strong>منطقة العرض:</strong> ${device.viewport}<br>
                <strong>دعم اللمس:</strong> ${device.touchSupport ? 'نعم' : 'لا'}<br>
                <strong>اتجاه الشاشة:</strong> ${device.orientation}
            `;

            card.className = 'status-card success';
            addLog(`تم فحص معلومات الجهاز: ${device.isMobile ? 'جوال' : 'سطح مكتب'}`, 'success');
        }

        // فحص حالة CSS
        function checkCSSStatus() {
            const cssTests = {
                responsiveStyles: false,
                mobileQueries: false,
                customFonts: false,
                animations: false
            };

            // فحص الاستجابة
            const testElement = document.createElement('div');
            testElement.style.cssText = 'width: 100%; max-width: 768px; display: none;';
            document.body.appendChild(testElement);

            if (getComputedStyle(testElement).display === 'none') {
                cssTests.responsiveStyles = true;
            }

            document.body.removeChild(testElement);

            // فحص media queries للجوال
            if (window.matchMedia('(max-width: 768px)').matches) {
                cssTests.mobileQueries = true;
            }

            statusData.css = cssTests;

            const card = document.getElementById('css-status');
            const details = document.getElementById('css-details');

            const passedTests = Object.values(cssTests).filter(Boolean).length;
            const totalTests = Object.keys(cssTests).length;

            details.innerHTML = `
                <strong>اختبارات النجحت:</strong> ${passedTests}/${totalTests}<br>
                <strong>الاستجابة:</strong> ${cssTests.responsiveStyles ? '✅' : '❌'}<br>
                <strong>Media Queries:</strong> ${cssTests.mobileQueries ? '✅' : '❌'}
            `;

            card.className = passedTests >= totalTests/2 ? 'status-card success' : 'status-card warning';
            addLog(`فحص CSS: ${passedTests}/${totalTests} اختبار نجح`, passedTests >= totalTests/2 ? 'success' : 'warning');
        }

        // فحص حالة JavaScript
        function checkJSStatus() {
            const jsTests = {
                jqueryLoaded: typeof $ !== 'undefined',
                bootstrapLoaded: typeof bootstrap !== 'undefined',
                cropperLoaded: typeof Cropper !== 'undefined',
                customFunctions: false
            };

            // فحص الوظائف المخصصة
            const customFunctions = ['addFamilyMember', 'showCropperModal', 'setupDocumentUploadHandlersForMember'];
            let foundFunctions = 0;

            customFunctions.forEach(func => {
                if (typeof window[func] === 'function') {
                    foundFunctions++;
                }
            });

            jsTests.customFunctions = foundFunctions >= customFunctions.length / 2;

            statusData.js = jsTests;

            const card = document.getElementById('js-status');
            const details = document.getElementById('js-details');

            const passedTests = Object.values(jsTests).filter(Boolean).length;
            const totalTests = Object.keys(jsTests).length;

            details.innerHTML = `
                <strong>اختبارات نجحت:</strong> ${passedTests}/${totalTests}<br>
                <strong>jQuery:</strong> ${jsTests.jqueryLoaded ? '✅' : '❌'}<br>
                <strong>Bootstrap:</strong> ${jsTests.bootstrapLoaded ? '✅' : '❌'}<br>
                <strong>Cropper:</strong> ${jsTests.cropperLoaded ? '✅' : '❌'}<br>
                <strong>وظائف مخصصة:</strong> ${foundFunctions}/${customFunctions.length}
            `;

            card.className = passedTests >= totalTests/2 ? 'status-card success' : 'status-card error';
            addLog(`فحص JavaScript: ${passedTests}/${totalTests} اختبار نجح`, passedTests >= totalTests/2 ? 'success' : 'error');
        }

        // فحص حالة النوافذ المنبثقة
        function checkModalStatus() {
            const modalTests = {
                modalElements: document.querySelectorAll('.modal').length,
                backdrops: document.querySelectorAll('.modal-backdrop').length,
                cropperModal: document.getElementById('cropperModal') !== null,
                zIndexIssues: false
            };

            // فحص مشاكل z-index
            const modals = document.querySelectorAll('.modal');
            const backdrops = document.querySelectorAll('.modal-backdrop');

            if (backdrops.length > 1 || (modals.length > 0 && backdrops.length === 0)) {
                modalTests.zIndexIssues = true;
            }

            statusData.modal = modalTests;

            const card = document.getElementById('modal-status');
            const details = document.getElementById('modal-details');

            details.innerHTML = `
                <strong>عدد النوافذ:</strong> ${modalTests.modalElements}<br>
                <strong>خلفيات Modal:</strong> ${modalTests.backdrops}<br>
                <strong>Cropper Modal:</strong> ${modalTests.cropperModal ? '✅' : '❌'}<br>
                <strong>مشاكل Z-Index:</strong> ${modalTests.zIndexIssues ? '⚠️' : '✅'}
            `;

            const hasIssues = modalTests.zIndexIssues || modalTests.backdrops > 1;
            card.className = hasIssues ? 'status-card warning' : 'status-card success';
            addLog(`فحص النوافذ المنبثقة: ${hasIssues ? 'مشاكل موجودة' : 'طبيعي'}`, hasIssues ? 'warning' : 'success');
        }

        // فحص الأداء
        function checkPerformance() {
            const startTime = performance.now();

            const performanceData = {
                loadTime: performance.timing ? performance.timing.loadEventEnd - performance.timing.navigationStart : 0,
                domElements: document.querySelectorAll('*').length,
                images: document.querySelectorAll('img').length,
                scripts: document.querySelectorAll('script').length,
                stylesheets: document.querySelectorAll('link[rel="stylesheet"]').length
            };

            const processingTime = performance.now() - startTime;
            performanceData.processingTime = processingTime;

            statusData.performance = performanceData;

            const card = document.getElementById('performance-status');
            const details = document.getElementById('performance-details');

            details.innerHTML = `
                <strong>وقت التحميل:</strong> ${performanceData.loadTime}ms<br>
                <strong>عناصر DOM:</strong> ${performanceData.domElements}<br>
                <strong>الصور:</strong> ${performanceData.images}<br>
                <strong>ملفات JS:</strong> ${performanceData.scripts}<br>
                <strong>ملفات CSS:</strong> ${performanceData.stylesheets}
            `;

            const isGoodPerformance = performanceData.loadTime < 3000 && performanceData.domElements < 1000;
            card.className = isGoodPerformance ? 'status-card success' : 'status-card warning';
            addLog(`فحص الأداء: ${isGoodPerformance ? 'جيد' : 'يحتاج تحسين'}`, isGoodPerformance ? 'success' : 'warning');
        }

        // فحص الإصلاحات المطبقة
        function checkAppliedFixes() {
            const fixes = [
                'إصلاح أخطاء JavaScript',
                'تحسين الاستجابة للجوال',
                'إصلاح Cropper Modal',
                'تنظيف Modal Backdrops',
                'تحسين معاينة الصور',
                'إضافة تشخيصات متقدمة'
            ];

            statusData.fixes = fixes;

            const card = document.getElementById('fixes-status');
            const details = document.getElementById('fixes-details');

            details.innerHTML = `
                <strong>إجمالي الإصلاحات:</strong> ${fixes.length}<br>
                ${fixes.map(fix => `• ${fix}`).join('<br>')}
            `;

            card.className = 'status-card success';
            addLog(`تم تطبيق ${fixes.length} إصلاح`, 'success');
        }

        // اختبار الاستجابة CSS
        function testCSSResponsive() {
            addLog('🎨 بدء اختبار الاستجابة...');

            const originalWidth = window.innerWidth;
            const testSizes = [320, 768, 1024, 1920];

            testSizes.forEach(width => {
                const mediaQuery = window.matchMedia(`(max-width: ${width}px)`);
                addLog(`📐 العرض ${width}px: ${mediaQuery.matches ? 'يطابق' : 'لا يطابق'}`);
            });

            addLog('✅ انتهى اختبار الاستجابة', 'success');
        }

        // إعادة تحميل CSS
        function forceCSSReload() {
            addLog('🔄 إعادة تحميل CSS...');

            const links = document.querySelectorAll('link[rel="stylesheet"]');
            links.forEach(link => {
                const href = link.href;
                link.href = href + (href.includes('?') ? '&' : '?') + 'v=' + Date.now();
            });

            addLog('✅ تم إعادة تحميل جميع ملفات CSS', 'success');
        }

        // اختبار وظائف JavaScript
        function testJSFunctions() {
            addLog('⚙️ اختبار وظائف JavaScript...');

            const functions = ['addFamilyMember', 'showCropperModal', 'setupDocumentUploadHandlersForMember'];

            functions.forEach(func => {
                if (typeof window[func] === 'function') {
                    addLog(`✅ ${func}: موجود`);
                } else {
                    addLog(`❌ ${func}: غير موجود`, 'error');
                }
            });

            addLog('✅ انتهى اختبار الوظائف', 'success');
        }

        // اختبار رفع الملفات
        function testFileUpload() {
            addLog('📁 اختبار رفع الملفات...');

            // إنشاء input تجريبي
            const testInput = document.createElement('input');
            testInput.type = 'file';
            testInput.accept = 'image/*';
            testInput.style.display = 'none';

            testInput.onchange = function(e) {
                if (e.target.files.length > 0) {
                    addLog(`✅ تم اختيار ملف: ${e.target.files[0].name}`, 'success');

                    // محاولة إنشاء معاينة
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        addLog('✅ تم إنشاء معاينة الصورة', 'success');
                    };
                    reader.readAsDataURL(e.target.files[0]);
                } else {
                    addLog('❌ لم يتم اختيار أي ملف', 'warning');
                }
                document.body.removeChild(testInput);
            };

            document.body.appendChild(testInput);
            testInput.click();
        }

        // اختبار Cropper Modal
        function testCropperModal() {
            addLog('🪟 اختبار Cropper Modal...');

            const cropperModal = document.getElementById('cropperModal');
            if (cropperModal) {
                addLog('✅ Cropper Modal موجود');

                // محاولة فتح النافذة
                if (typeof showCropperModal === 'function') {
                    addLog('✅ وظيفة showCropperModal موجودة');
                } else {
                    addLog('❌ وظيفة showCropperModal غير موجودة', 'error');
                }
            } else {
                addLog('❌ Cropper Modal غير موجود', 'error');
            }
        }

        // تنظيف خلفيات Modal
        function cleanModalBackdrops() {
            addLog('🧹 تنظيف خلفيات Modal...');

            const backdrops = document.querySelectorAll('.modal-backdrop');
            backdrops.forEach((backdrop, index) => {
                if (index > 0) { // الاحتفاظ بالأول فقط
                    backdrop.remove();
                    addLog(`🗑️ تم حذف خلفية إضافية`);
                }
            });

            addLog(`✅ تم تنظيف ${backdrops.length > 1 ? backdrops.length - 1 : 0} خلفية إضافية`, 'success');
            checkModalStatus(); // إعادة فحص
        }

        // قياس الأداء
        function testPerformance() {
            addLog('⚡ قياس الأداء...');

            const startTime = performance.now();

            // اختبار سرعة الاستجابة
            setTimeout(() => {
                const responseTime = performance.now() - startTime;
                addLog(`⏱️ وقت الاستجابة: ${responseTime.toFixed(2)}ms`);

                if (responseTime < 100) {
                    addLog('✅ أداء ممتاز', 'success');
                } else if (responseTime < 500) {
                    addLog('⚠️ أداء جيد', 'warning');
                } else {
                    addLog('❌ أداء بطيء', 'error');
                }
            }, 0);
        }

        // اختبار أحداث اللمس
        function testTouchEvents() {
            addLog('👆 اختبار أحداث اللمس...');

            if ('ontouchstart' in window) {
                addLog('✅ دعم اللمس متوفر', 'success');

                // إضافة مستمع تجريبي
                const testHandler = function(e) {
                    addLog('👆 تم اكتشاف حدث لمس');
                    document.removeEventListener('touchstart', testHandler);
                };

                document.addEventListener('touchstart', testHandler);

                setTimeout(() => {
                    document.removeEventListener('touchstart', testHandler);
                    addLog('⏰ انتهى اختبار اللمس');
                }, 3000);
            } else {
                addLog('❌ دعم اللمس غير متوفر', 'warning');
            }
        }

        // تطبيق جميع الإصلاحات
        function runAllFixes() {
            addLog('🔧 تطبيق جميع الإصلاحات...');

            // إعادة تحميل CSS
            forceCSSReload();

            // تنظيف Modal backdrops
            cleanModalBackdrops();

            // إضافة أنماط الجوال القسرية
            const mobileCSS = `
                <style id="mobile-force-fix">
                @media (max-width: 768px) {
                    .mainDocumentPreview {
                        width: 100% !important;
                        max-width: 100% !important;
                        margin: 0 !important;
                        padding: 10px !important;
                    }

                    .attachment-card {
                        width: 100% !important;
                        max-width: 100% !important;
                        margin-bottom: 15px !important;
                    }

                    .modal-dialog {
                        width: 95% !important;
                        max-width: 95% !important;
                        margin: 10px auto !important;
                    }
                }
                </style>
            `;

            // إزالة الأنماط القديمة وإضافة الجديدة
            const oldMobileCSS = document.getElementById('mobile-force-fix');
            if (oldMobileCSS) {
                oldMobileCSS.remove();
            }

            document.head.insertAdjacentHTML('beforeend', mobileCSS);

            addLog('✅ تم تطبيق جميع الإصلاحات', 'success');

            // إعادة فحص جميع الحالات
            setTimeout(() => {
                runAllChecks();
            }, 1000);
        }

        // تصدير التقرير
        function exportReport() {
            addLog('📋 إنشاء تقرير شامل...');

            const report = {
                timestamp: new Date().toISOString(),
                device: statusData.device,
                css: statusData.css,
                js: statusData.js,
                modal: statusData.modal,
                performance: statusData.performance,
                fixes: statusData.fixes,
                logs: statusData.logs
            };

            const reportText = JSON.stringify(report, null, 2);
            const blob = new Blob([reportText], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `status-report-${Date.now()}.json`;
            a.click();

            URL.revokeObjectURL(url);
            addLog('✅ تم تصدير التقرير', 'success');
        }

        // تشغيل جميع الفحوصات
        function runAllChecks() {
            addLog('🔍 بدء الفحص الشامل...');

            checkDeviceInfo();
            setTimeout(() => checkCSSStatus(), 100);
            setTimeout(() => checkJSStatus(), 200);
            setTimeout(() => checkModalStatus(), 300);
            setTimeout(() => checkPerformance(), 400);
            setTimeout(() => checkAppliedFixes(), 500);

            setTimeout(() => {
                addLog('✅ انتهى الفحص الشامل', 'success');
            }, 600);
        }

        // بدء الفحص عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(runAllChecks, 500);
        });

        // فحص دوري كل 30 ثانية
        setInterval(() => {
            addLog('🔄 فحص دوري...');
            checkModalStatus();
            checkPerformance();
        }, 30000);
    </script>
</body>
</html>
