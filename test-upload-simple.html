<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار رفع الملفات المباشر</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h3>اختبار رفع ملف Excel</h3>
        </div>
        <div class="card-body">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="fileInput" class="form-label">اختر ملف Excel:</label>
                    <input type="file" class="form-control" id="fileInput" name="files" accept=".xlsx,.xls,.csv">
                    <small class="form-text text-muted">اختر ملف Excel واحد للاختبار</small>
                </div>

                <div class="mb-3">
                    <label for="mode" class="form-label">نوع المعالجة:</label>
                    <select class="form-control" id="mode" name="processing_mode">
                        <option value="file-only">حفظ الملف فقط</option>
                        <option value="import-data">حفظ + استيراد البيانات</option>
                    </select>
                </div>

                <button type="button" class="btn btn-primary" onclick="uploadFile()">رفع الملف</button>
            </form>

            <div id="result" class="mt-4" style="display: none;">
                <h5>النتيجة:</h5>
                <pre id="resultText"></pre>
            </div>
        </div>
    </div>

    <script>
        function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const mode = document.getElementById('mode').value;

            if (!fileInput.files.length) {
                alert('يرجى اختيار ملف أولاً');
                return;
            }

            const formData = new FormData();

            // Try single file approach (not array)
            formData.append('files', fileInput.files[0]);
            formData.append('processing_mode', mode);
            formData.append('enable_excel_import', '0');

            // Get CSRF token
            fetch('/sanctum/csrf-cookie')
                .then(() => {
                    // Get meta tag value
                    const token = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || 'no-token';
                    formData.append('_token', token);

                    console.log('Uploading with data:');
                    for (let pair of formData.entries()) {
                        console.log(pair[0] + ':', typeof pair[1] === 'object' ? pair[1].name + ' (' + pair[1].size + ' bytes)' : pair[1]);
                    }

                    return fetch('http://127.0.0.1:8000/admin/file/excel-upload', {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-CSRF-TOKEN': token,
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').style.display = 'block';
                    document.getElementById('resultText').textContent = JSON.stringify(data, null, 2);
                    console.log('Response:', data);
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('result').style.display = 'block';
                    document.getElementById('resultText').textContent = 'خطأ: ' + error.message;
                });
        }
    </script>
</body>
</html>
