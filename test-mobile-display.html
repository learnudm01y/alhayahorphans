<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار عرض الملفات - أفراد الأسرة (الجوال)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* محاكاة شاشة الجوال */
        .mobile-simulator {
            max-width: 375px;
            margin: 20px auto;
            border: 8px solid #333;
            border-radius: 25px;
            background: #333;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .mobile-screen {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            min-height: 600px;
            position: relative;
        }

        .mobile-header {
            background: #f8f9fa;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #dee2e6;
            font-weight: bold;
        }

        .mobile-content {
            padding: 15px;
        }

        /* تحسينات عرض الملفات على الجوال */
        @media (max-width: 768px) {
            .mainDocumentPreview {
                width: 100% !important;
                padding: 10px !important;
                margin: 10px 0 !important;
            }

            .attachment-card {
                width: 100% !important;
                max-width: 100% !important;
                min-width: 100% !important;
                margin-bottom: 15px !important;
                display: block !important;
                visibility: visible !important;
                opacity: 1 !important;
            }

            .d-flex.flex-wrap {
                flex-direction: column !important;
                gap: 15px !important;
                width: 100% !important;
            }

            .card-body {
                padding: 15px !important;
            }

            .document-image {
                width: 100% !important;
                height: auto !important;
                max-height: 200px !important;
            }
        }

        /* محاكاة الجوال حتى على الشاشات الكبيرة */
        .mobile-simulator .attachment-card {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 100% !important;
            margin-bottom: 15px !important;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        .mobile-simulator .d-flex {
            flex-direction: column !important;
            gap: 15px !important;
            width: 100% !important;
        }

        .test-buttons {
            margin: 20px 0;
            text-align: center;
        }

        .test-results {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center my-4">اختبار عرض الملفات على الجوال - أفراد الأسرة</h1>

                <!-- أزرار الاختبار -->
                <div class="test-buttons">
                    <button class="btn btn-primary me-2" onclick="addTestFiles()">
                        <i class="fas fa-plus me-1"></i>إضافة ملفات تجريبية
                    </button>
                    <button class="btn btn-success me-2" onclick="testMobileDisplay()">
                        <i class="fas fa-mobile-alt me-1"></i>اختبار العرض
                    </button>
                    <button class="btn btn-warning me-2" onclick="clearFiles()">
                        <i class="fas fa-trash me-1"></i>مسح الملفات
                    </button>
                    <button class="btn btn-info" onclick="toggleViewport()">
                        <i class="fas fa-expand-arrows-alt me-1"></i>تغيير العرض
                    </button>
                </div>

                <!-- نتائج الاختبار -->
                <div class="test-results" id="testResults">
                    <strong>نتائج الاختبار:</strong><br>
                    انتظار بدء الاختبار...
                </div>
            </div>
        </div>

        <!-- محاكي شاشة الجوال -->
        <div class="mobile-simulator" id="mobileSimulator">
            <div class="mobile-screen">
                <div class="mobile-header">
                    <i class="fas fa-users me-2"></i>بوابة أفراد الأسرة
                </div>
                <div class="mobile-content">
                    <!-- منطقة عرض الملفات -->
                    <div class="mainDocumentPreview" id="testPreview" style="min-height: 100px; border: 2px dashed #dee2e6; border-radius: 8px; padding: 20px; text-align: center;">
                        <div class="text-muted">
                            <i class="fas fa-upload fa-2x mb-3"></i><br>
                            لا توجد ملفات للعرض<br>
                            <small>انقر على "إضافة ملفات تجريبية" لبدء الاختبار</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let testLog = [];
        let currentViewport = 'mobile';

        function log(message) {
            testLog.push(`[${new Date().toLocaleTimeString()}] ${message}`);
            document.getElementById('testResults').innerHTML =
                '<strong>نتائج الاختبار:</strong><br>' + testLog.slice(-20).join('<br>');
            console.log(message);
        }

        function addTestFiles() {
            log('🚀 بدء إضافة ملفات تجريبية...');

            const preview = document.getElementById('testPreview');
            preview.innerHTML = '';

            // إنشاء حاوية الملفات
            const cardsWrapper = document.createElement('div');
            cardsWrapper.className = 'd-flex flex-column gap-3';
            cardsWrapper.style.cssText = `
                margin-top: 15px;
                width: 100%;
                flex-direction: column;
                gap: 15px;
                padding: 0;
            `;

            // إضافة 3 ملفات تجريبية
            for (let i = 1; i <= 3; i++) {
                const card = createTestCard(i);
                cardsWrapper.appendChild(card);
            }

            preview.appendChild(cardsWrapper);
            preview.style.display = 'block';

            log(`✅ تم إضافة 3 ملفات تجريبية`);

            // اختبار العرض تلقائياً
            setTimeout(() => {
                testMobileDisplay();
            }, 500);
        }

        function createTestCard(index) {
            const card = document.createElement('div');
            card.className = 'attachment-card card border-0 shadow-sm';
            card.style.cssText = `
                width: 100%;
                max-width: 100%;
                border-radius: 12px;
                overflow: hidden;
                transition: all 0.3s ease;
                background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
                border: 1px solid #e3e6f0 !important;
                margin-bottom: 15px;
                display: block;
                visibility: visible;
                opacity: 1;
                flex-shrink: 0;
            `;

            const colors = ['#4285f4', '#34a853', '#ea4335'];
            const types = ['هوية شخصية', 'جواز سفر', 'شهادة ميلاد'];

            card.innerHTML = `
                <div class="card-header bg-gradient-primary text-white p-2" style="background: linear-gradient(135deg, ${colors[index-1]} 0%, #764ba2 100%); border: none; font-size: 0.85rem; font-weight: 600;">
                    <div class="d-flex align-items-center justify-content-between">
                        <i class="fas fa-file-image me-1"></i>
                        <span class="text-truncate">${types[index-1]}</span>
                        <i class="fas fa-check-circle text-success"></i>
                    </div>
                </div>
                <div class="card-body p-3 text-center">
                    <div class="image-container position-relative" style="border-radius: 8px; overflow: hidden; margin-bottom: 10px; background: #f8f9fa;">
                        <img src="data:image/svg+xml;base64,${btoa(`<svg width="300" height="180" viewBox="0 0 300 180" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="180" fill="${colors[index-1]}"/><text x="150" y="90" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="16">صورة تجريبية ${index}</text></svg>`)}"
                             style="width: 100%; height: 120px; object-fit: cover; border-radius: 8px; transition: transform 0.3s ease;"
                             class="document-image" />
                        <div class="position-absolute top-0 end-0 m-1">
                            <span class="badge bg-success rounded-pill">
                                <i class="fas fa-check-circle me-1"></i>معالج
                            </span>
                        </div>
                    </div>
                    <div class="file-name text-muted small mb-2 text-truncate">test-file-${index}.jpg</div>
                    <div class="file-info small text-muted mb-3">
                        <div class="d-flex justify-content-between">
                            <span><i class="fas fa-weight-hanging me-1"></i>${(Math.random() * 50 + 10).toFixed(1)} KB</span>
                            <span><i class="fas fa-clock me-1"></i>الآن</span>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline-danger btn-sm w-100" style="border-radius: 8px; font-weight: 500;" onclick="deleteTestCard(this)">
                        <i class="fas fa-trash-alt me-1"></i>حذف
                    </button>
                </div>
            `;

            return card;
        }

        function deleteTestCard(button) {
            const card = button.closest('.attachment-card');
            card.style.transition = 'all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            card.style.transform = 'scale(0.8) rotateZ(5deg)';
            card.style.opacity = '0';
            card.style.filter = 'blur(3px)';

            setTimeout(() => {
                card.remove();
                log('🗑️ تم حذف ملف تجريبي');
                testMobileDisplay();
            }, 600);
        }

        function testMobileDisplay() {
            log('🔍 بدء اختبار العرض على الجوال...');

            const preview = document.getElementById('testPreview');
            const cards = preview.querySelectorAll('.attachment-card');

            log(`📋 عدد البطاقات الموجودة: ${cards.length}`);

            if (cards.length === 0) {
                log('⚠️ لا توجد بطاقات للاختبار');
                return;
            }

            cards.forEach((card, index) => {
                const cardStyle = window.getComputedStyle(card);
                const isVisible = cardStyle.display !== 'none' &&
                                 cardStyle.visibility !== 'hidden' &&
                                 parseFloat(cardStyle.opacity) > 0;

                log(`بطاقة ${index + 1}: العرض=${cardStyle.width}, مرئية=${isVisible}`);

                // التحقق من الصورة
                const img = card.querySelector('.document-image');
                if (img) {
                    const imgStyle = window.getComputedStyle(img);
                    log(`  - الصورة: العرض=${imgStyle.width}, الارتفاع=${imgStyle.height}`);
                }

                // التحقق من النص
                const fileName = card.querySelector('.file-name');
                if (fileName) {
                    log(`  - اسم الملف: "${fileName.textContent.trim()}"`);
                }

                // التحقق من الزر
                const deleteBtn = card.querySelector('.btn');
                if (deleteBtn) {
                    const btnStyle = window.getComputedStyle(deleteBtn);
                    log(`  - الزر: العرض=${btnStyle.width}, مرئي=${btnStyle.display !== 'none'}`);
                }
            });

            // اختبار الحاوية
            const cardsWrapper = preview.querySelector('.d-flex');
            if (cardsWrapper) {
                const wrapperStyle = window.getComputedStyle(cardsWrapper);
                log(`📦 الحاوية: الاتجاه=${wrapperStyle.flexDirection}, العرض=${wrapperStyle.width}`);
            }

            // نتيجة الاختبار
            const visibleCards = Array.from(cards).filter(card => {
                const style = window.getComputedStyle(card);
                return style.display !== 'none' && style.visibility !== 'hidden' && parseFloat(style.opacity) > 0;
            });

            if (visibleCards.length === cards.length) {
                log(`✅ نجح الاختبار: جميع البطاقات (${cards.length}) مرئية بشكل صحيح`);
            } else {
                log(`❌ فشل الاختبار: ${visibleCards.length}/${cards.length} بطاقة مرئية فقط`);
            }
        }

        function clearFiles() {
            const preview = document.getElementById('testPreview');
            preview.innerHTML = `
                <div class="text-muted">
                    <i class="fas fa-upload fa-2x mb-3"></i><br>
                    لا توجد ملفات للعرض<br>
                    <small>انقر على "إضافة ملفات تجريبية" لبدء الاختبار</small>
                </div>
            `;
            log('🧹 تم مسح جميع الملفات');
        }

        function toggleViewport() {
            const simulator = document.getElementById('mobileSimulator');

            if (currentViewport === 'mobile') {
                simulator.style.maxWidth = '100%';
                simulator.style.border = 'none';
                simulator.style.borderRadius = '0';
                simulator.style.background = 'transparent';
                simulator.style.padding = '0';
                currentViewport = 'desktop';
                log('💻 تم التغيير إلى عرض الشاشة الكبيرة');
            } else {
                simulator.style.maxWidth = '375px';
                simulator.style.border = '8px solid #333';
                simulator.style.borderRadius = '25px';
                simulator.style.background = '#333';
                simulator.style.padding = '10px';
                currentViewport = 'mobile';
                log('📱 تم التغيير إلى عرض الجوال');
            }

            setTimeout(testMobileDisplay, 300);
        }

        // اختبار تلقائي عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            log('🎯 تم تحميل صفحة اختبار عرض الملفات على الجوال');
            log('📱 العرض الحالي: ' + window.innerWidth + 'x' + window.innerHeight);
        });
    </script>
</body>
</html>
