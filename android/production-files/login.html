<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light">
    <title>تسجيل الدخول - نظام الكفالات</title>
    <link href="css/styles.css" rel="stylesheet">
    <!-- Material Icons & Fonts - Offline Version -->
    <link rel="stylesheet" href="css/material-icons.css">
    <link rel="stylesheet" href="css/icons-fallback.css">
    <link rel="stylesheet" href="css/tajawal-fonts.css">
    <link rel="stylesheet" href="css/safe-area.css">
    <style>
        * {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
        }

        body {
            background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
        }

        .login-logo {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }

        .login-title {
            color: #1a5276;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .login-subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-label {
            display: block;
            color: #333;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
            direction: rtl;
        }

        .form-input:focus {
            outline: none;
            border-color: #2980b9;
        }

        .form-input::placeholder {
            color: #aaa;
        }

        .server-group {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .server-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            display: block;
        }

        .server-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            direction: ltr;
            text-align: left;
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1a5276, #2980b9);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .error-message.show {
            display: block;
        }

        .loading-spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a5276;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-btn.loading .btn-text {
            display: none;
        }

        .login-btn.loading .loading-spinner {
            display: inline-block;
        }

        .offline-notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .offline-notice.show {
            display: block;
        }

        .connection-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e74c3c;
        }

        .status-dot.online {
            background: #27ae60;
        }
    </style>
</head>
<body>
    <!-- Safe Area Bars -->
    <div class="safe-area-top"></div>
    <div class="safe-area-bottom"></div>

    <div class="login-container">
        <img src="logo01.png" alt="شعار النظام" class="login-logo">
        <h1 class="login-title">نظام إدارة الكفالات</h1>
        <p class="login-subtitle">تسجيل الدخول للمتابعة</p>

        <div class="offline-notice show" id="offlineNotice" style="background: #d1ecf1; border-color: #17a2b8; color: #0c5460;">
            <span class="material-icons" style="vertical-align: middle; font-size: 18px;">cloud</span>
            ☁️ <strong>متصل بالإستضافة الحقيقية - Production</strong><br>
            <small id="apiUrlDisplay">Production API: جاري التحديد...</small>
            <br>
            <button type="button" onclick="showServerConfig()" style="margin-top: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer;">
                ⚙️ تغيير عنوان الخادم
            </button>
        </div>

        <!-- إعدادات الخادم للجهاز الحقيقي -->
        <div id="serverConfigPanel" style="display: none; background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 15px; margin-bottom: 15px;">
            <strong>⚙️ إعدادات الخادم (للجهاز الحقيقي)</strong><br>
            <small style="color: #666;">أدخل IP الكمبيوتر على الشبكة المحلية</small>
            <div style="margin-top: 10px;">
                <input type="text" id="customServerIp" placeholder="مثال: 192.168.1.100"
                       style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; direction: ltr; text-align: left;">
                <div style="margin-top: 8px;">
                    <button type="button" onclick="saveServerConfig()" style="padding: 5px 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        💾 حفظ
                    </button>
                    <button type="button" onclick="resetServerConfig()" style="padding: 5px 15px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; margin-right: 5px;">
                        🔄 إعادة للافتراضي
                    </button>
                </div>
            </div>
        </div>

        <!-- رسالة عند تسجيل الدخول بحساب مختلف -->
        <div class="offline-notice" id="switchAccountNotice" style="background: #fff3cd; border-color: #ffc107; color: #856404; display: none;">
            <span class="material-icons" style="vertical-align: middle; font-size: 18px;">swap_horiz</span>
            ⚠️ <strong>يوجد حساب محفوظ: <span id="currentUserName"></span></strong><br>
            <small>أدخل بيانات الحساب للدخول أو امسح الذاكرة المؤقتة</small>
            <br>
            <button type="button" onclick="clearCacheAndReload()" style="margin-top: 8px; padding: 5px 12px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 12px;">
                🗑️ مسح الذاكرة المؤقتة
            </button>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" class="form-input" id="username"
                       placeholder="أدخل اسم المستخدم" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <input type="password" class="form-input" id="password"
                       placeholder="أدخل كلمة المرور" required autocomplete="current-password">
            </div>

            <!-- Server URL مخفي - Production API -->
            <input type="hidden" id="serverUrl" value="http://127.0.0.1:8000/api/mobile">

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="btn-text">تسجيل الدخول</span>
                <div class="loading-spinner"></div>
            </button>
        </form>

        <div class="connection-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">جاري فحص الاتصال...</span>
        </div>
    </div>

    <script src="js/sync-service-real.js?v=20260122-production"></script>
    <script>
        console.log('☁️ LOGIN PAGE - PRODUCTION MODE - 2026-01-22');

        // ========================================
        // إعدادات الخادم
        // ========================================
        function showServerConfig() {
            const panel = document.getElementById('serverConfigPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';

            // عرض IP الحالي إن وجد
            const savedUrl = localStorage.getItem('custom_api_url');
            if (savedUrl) {
                const match = savedUrl.match(/http:\/\/([^:]+):/);
                if (match) {
                    document.getElementById('customServerIp').value = match[1];
                }
            }
        }

        function saveServerConfig() {
            const ip = document.getElementById('customServerIp').value.trim();
            if (!ip) {
                alert('يرجى إدخال عنوان IP');
                return;
            }

            const newUrl = `http://${ip}:8000/api/mobile`;
            SyncService.setBaseUrl(newUrl);

            document.getElementById('apiUrlDisplay').textContent = 'Production API: ' + newUrl;
            document.getElementById('serverConfigPanel').style.display = 'none';

            alert('✅ تم حفظ عنوان الخادم. جاري إعادة فحص الاتصال...');
            checkConnection();
        }

        function resetServerConfig() {
            localStorage.removeItem('custom_api_url');
            location.reload();
        }

        // ========================================
        // مسح الذاكرة المؤقتة
        // ========================================
        async function clearCacheAndReload() {
            if (!confirm('هل أنت متأكد من مسح جميع البيانات المحفوظة؟\n\nسيتم حذف:\n- بيانات تسجيل الدخول\n- الكفالات المحفوظة محلياً\n- التغييرات غير المرفوعة')) {
                return;
            }

            console.log('🗑️ مسح الذاكرة المؤقتة...');

            // مسح localStorage
            localStorage.clear();

            // مسح IndexedDB
            try {
                const dbNames = ['AlhayahSponsorshipsOfflineDB'];
                for (const dbName of dbNames) {
                    await new Promise((resolve, reject) => {
                        const req = indexedDB.deleteDatabase(dbName);
                        req.onsuccess = resolve;
                        req.onerror = reject;
                    });
                    console.log('✅ تم مسح:', dbName);
                }
            } catch (e) {
                console.error('❌ خطأ في مسح IndexedDB:', e);
            }

            alert('✅ تم مسح الذاكرة المؤقتة. سيتم إعادة تحميل الصفحة.');
            location.reload();
        }

        // ========================================
        // فحص الاتصال بالخادم
        // ========================================
        async function checkConnection() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            try {
                statusText.textContent = 'جاري فحص الاتصال بقاعدة البيانات...';
                console.log('🔍 Checking connection to:', SyncService.baseUrl);

                const health = await SyncService.checkHealth();

                if (health.status === 'healthy') {
                    statusDot.classList.add('online');
                    statusText.textContent = '✅ متصل بقاعدة البيانات الحقيقية';
                } else {
                    statusDot.classList.remove('online');
                    statusText.textContent = '❌ فشل الاتصال بالخادم: ' + (health.error || 'غير معروف');
                }
            } catch (error) {
                statusDot.classList.remove('online');
                statusText.textContent = '❌ لا يمكن الاتصال بالخادم - تأكد من تشغيل Laravel';
                console.error('Connection check failed:', error);
            }
        }

        // Initialize and check if already logged in
        let currentUser = null;
        let hasCachedCredentials = false;

        (async function() {
            await SyncService.init();

            // استرجاع URL محفوظ إن وجد
            SyncService.loadSavedBaseUrl();

            // عرض URL الحالي
            document.getElementById('apiUrlDisplay').textContent = 'Laravel API: ' + SyncService.baseUrl;

            // التحقق من وجود معامل force_login في URL للسماح بتسجيل دخول جديد
            const urlParams = new URLSearchParams(window.location.search);
            const forceLogin = urlParams.get('force') === '1';

            // التحقق من وجود بيانات اعتماد محفوظة
            hasCachedCredentials = await SyncService.hasOfflineCredentials();
            console.log('📦 بيانات اعتماد محفوظة:', hasCachedCredentials);

            // إذا كان المستخدم مسجل الدخول وليس force login، إعادة التوجيه
            if (SyncService.isAuthenticated() && !forceLogin) {
                console.log('✅ Already authenticated, redirecting to index.html');
                window.location.href = 'index.html';
                return;
            }

            // عرض معلومات الحساب المحفوظ إن وجد
            if (hasCachedCredentials || SyncService.isAuthenticated()) {
                currentUser = SyncService.user;
                if (currentUser) {
                    document.getElementById('switchAccountNotice').style.display = 'block';
                    document.getElementById('currentUserName').textContent = currentUser.name;
                    console.log('🔄 حساب محفوظ:', currentUser.name);
                }
            }

            // فحص الاتصال
            checkConnection();
        })();

        // Handle form submit - REAL DATABASE MODE
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('🔐 Login form submitted (REAL DATABASE MODE)');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');

            // Hide previous error
            errorMessage.classList.remove('show');

            // Validate inputs
            if (!username || !password) {
                errorMessage.textContent = 'يرجى إدخال اسم المستخدم وكلمة المرور';
                errorMessage.classList.add('show');
                return;
            }

            // Show loading
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                console.log('🔐 ==========================================');
                console.log('🔐 بدء عملية تسجيل الدخول');
                console.log('🔐 اسم المستخدم:', username);
                console.log('🔐 كلمة المرور:', password.length + ' حرف');
                console.log('🔐 عنوان الخادم:', SyncService.baseUrl);
                console.log('🔐 ==========================================');

                // إذا كان هناك مستخدم مسجل الدخول حالياً، قم بتسجيل الخروج أولاً
                if (currentUser) {
                    console.log('🔄 تسجيل خروج المستخدم الحالي:', currentUser.name);
                    await SyncService.logout();
                }

                // Use SyncService.login
                const result = await SyncService.login(username, password);

                console.log('🔐 ==========================================');
                console.log('🔐 نتيجة تسجيل الدخول:');
                console.log('🔐 نجاح:', result.success);
                console.log('🔐 المصدر:', result.source || 'غير محدد');
                console.log('🔐 الرسالة:', result.message);
                if (result.user) {
                    console.log('🔐 المستخدم:', result.user.name);
                }
                console.log('🔐 ==========================================');

                if (result.success) {
                    // عرض تنبيه إذا كان الدخول من الذاكرة المؤقتة
                    if (result.source === 'cache' || result.offline) {
                        console.log('⚠️ تم الدخول من الذاكرة المؤقتة (وضع offline)');
                    } else {
                        console.log('✅ تم الدخول من الخادم بنجاح');
                    }
                    window.location.href = 'index.html';
                } else {
                    console.log('❌ فشل تسجيل الدخول:', result.message);
                    errorMessage.textContent = result.message || 'فشل تسجيل الدخول';
                    errorMessage.classList.add('show');
                }

            } catch (error) {
                console.error('❌ خطأ في تسجيل الدخول:', error);
                errorMessage.textContent = error.message || 'حدث خطأ أثناء تسجيل الدخول';
                errorMessage.classList.add('show');
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });
    </script>
    <script src="js/icons-fallback.js"></script>
    <script src="js/safe-area-keyboard.js"></script>
</body>
</html>
