<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>اختبار Progress Bar - Android</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 15px;
            color: #fff;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            color: #4fc3f7;
        }

        .status-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .status-card h3 {
            font-size: 14px;
            color: #81c784;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
        }
        .status-item:last-child {
            border-bottom: none;
        }
        .status-value {
            color: #4fc3f7;
            font-weight: bold;
        }
        .status-value.error { color: #e57373; }
        .status-value.success { color: #81c784; }
        .status-value.warning { color: #ffb74d; }

        .test-section {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .test-section h2 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            padding: 15px 10px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn .icon {
            font-size: 24px;
        }
        .btn.primary {
            background: linear-gradient(135deg, #4fc3f7, #29b6f6);
            color: #fff;
        }
        .btn.success {
            background: linear-gradient(135deg, #81c784, #66bb6a);
            color: #fff;
        }
        .btn.warning {
            background: linear-gradient(135deg, #ffb74d, #ffa726);
            color: #333;
        }
        .btn.danger {
            background: linear-gradient(135deg, #e57373, #ef5350);
            color: #fff;
        }
        .btn.purple {
            background: linear-gradient(135deg, #9575cd, #7e57c2);
            color: #fff;
        }
        .btn.full {
            grid-column: span 2;
        }

        .progress-demo {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: #b0bec5;
        }
        .progress-bar-bg {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 25px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4fc3f7, #29b6f6);
            border-radius: 10px;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
        }
        .progress-bar-fill.indeterminate {
            width: 100% !important;
            background: linear-gradient(90deg, #4fc3f7, #29b6f6, #4fc3f7);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .log-box {
            background: #0d1117;
            border-radius: 10px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            margin-top: 15px;
        }
        .log-entry {
            padding: 4px 8px;
            margin: 2px 0;
            border-radius: 4px;
            word-break: break-all;
        }
        .log-entry.info { background: rgba(79, 195, 247, 0.2); color: #4fc3f7; }
        .log-entry.success { background: rgba(129, 199, 132, 0.2); color: #81c784; }
        .log-entry.error { background: rgba(229, 115, 115, 0.2); color: #e57373; }
        .log-entry.warning { background: rgba(255, 183, 77, 0.2); color: #ffb74d; }

        .slider-container {
            margin: 15px 0;
        }
        .slider-container label {
            display: block;
            font-size: 12px;
            color: #b0bec5;
            margin-bottom: 5px;
        }
        .slider-container input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.2);
            outline: none;
            -webkit-appearance: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #4fc3f7;
            cursor: pointer;
        }
        .slider-value {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #4fc3f7;
            margin-top: 5px;
        }

        .test-result {
            padding: 10px 15px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 13px;
        }
        .test-result.pass {
            background: rgba(129, 199, 132, 0.2);
            border: 1px solid #81c784;
            color: #81c784;
        }
        .test-result.fail {
            background: rgba(229, 115, 115, 0.2);
            border: 1px solid #e57373;
            color: #e57373;
        }

        .input-group {
            margin: 10px 0;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #b0bec5;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 اختبار Progress Bar - Android</h1>

        <!-- حالة النظام -->
        <div class="status-card">
            <h3>📊 حالة النظام</h3>
            <div class="status-item">
                <span>Capacitor</span>
                <span class="status-value" id="capacitorStatus">جاري الفحص...</span>
            </div>
            <div class="status-item">
                <span>BackgroundSync Plugin</span>
                <span class="status-value" id="pluginStatus">جاري الفحص...</span>
            </div>
            <div class="status-item">
                <span>SyncService</span>
                <span class="status-value" id="syncServiceStatus">جاري الفحص...</span>
            </div>
            <div class="status-item">
                <span>المنصة</span>
                <span class="status-value" id="platformStatus">-</span>
            </div>
        </div>

        <!-- اختبار Progress Bar يدوي -->
        <div class="test-section">
            <h2>📊 اختبار Progress Bar يدوي</h2>

            <div class="slider-container">
                <label>قيمة التقدم:</label>
                <input type="range" id="progressSlider" min="0" max="100" value="0">
                <div class="slider-value"><span id="sliderValue">0</span>%</div>
            </div>

            <div class="input-group">
                <label>رسالة الحالة:</label>
                <input type="text" id="statusMessage" value="جاري المزامنة..." placeholder="رسالة الحالة">
            </div>

            <div class="btn-grid">
                <button class="btn primary" onclick="sendManualProgress()">
                    <span class="icon">📤</span>
                    إرسال Progress
                </button>
                <button class="btn warning" onclick="setIndeterminateMode()">
                    <span class="icon">🔄</span>
                    وضع دائري
                </button>
            </div>

            <div class="progress-demo">
                <div class="progress-label">
                    <span>المعاينة المحلية</span>
                    <span id="localProgressText">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="localProgressBar" style="width: 0%;">0%</div>
                </div>
            </div>
        </div>

        <!-- اختبارات تلقائية -->
        <div class="test-section">
            <h2>🤖 اختبارات تلقائية</h2>

            <div class="btn-grid">
                <button class="btn success" onclick="runProgressTest()">
                    <span class="icon">▶️</span>
                    اختبار Progress
                </button>
                <button class="btn purple" onclick="runFullCycleTest()">
                    <span class="icon">🔁</span>
                    دورة كاملة
                </button>
                <button class="btn primary" onclick="testStartService()">
                    <span class="icon">🚀</span>
                    بدء الخدمة
                </button>
                <button class="btn danger" onclick="testStopService()">
                    <span class="icon">⏹️</span>
                    إيقاف الخدمة
                </button>
                <button class="btn success full" onclick="showCompleteNotification()">
                    <span class="icon">✅</span>
                    إظهار إشعار الاكتمال
                </button>
            </div>

            <div id="testResults"></div>
        </div>

        <!-- اختبار البطارية -->
        <div class="test-section">
            <h2>🔋 تحسين البطارية</h2>

            <div class="btn-grid">
                <button class="btn warning" onclick="checkBatteryOptimization()">
                    <span class="icon">🔍</span>
                    فحص الحالة
                </button>
                <button class="btn primary" onclick="requestBatteryExemption()">
                    <span class="icon">⚡</span>
                    طلب استثناء
                </button>
            </div>

            <div id="batteryResults"></div>
        </div>

        <!-- سجل العمليات -->
        <div class="test-section">
            <h2>📜 سجل العمليات</h2>
            <button class="btn danger full" onclick="clearLog()" style="margin-bottom: 10px;">
                <span class="icon">🗑️</span>
                مسح السجل
            </button>
            <div class="log-box" id="logBox"></div>
        </div>
    </div>

    <script src="sync-service.js"></script>
    <script>
        // ========================================
        // المتغيرات والتهيئة
        // ========================================

        let BackgroundSyncPlugin = null;
        let isCapacitorAvailable = false;
        let isPluginAvailable = false;

        // تسجيل في السجل
        function log(message, type = 'info') {
            const logBox = document.getElementById('logBox');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString('ar-SA');
            entry.textContent = `[${time}] ${message}`;
            logBox.insertBefore(entry, logBox.firstChild);

            // حد أقصى 50 سجل
            while (logBox.children.length > 50) {
                logBox.removeChild(logBox.lastChild);
            }
        }

        function clearLog() {
            document.getElementById('logBox').innerHTML = '';
            log('تم مسح السجل', 'warning');
        }

        // تحديث حالة
        function updateStatus(id, text, type = '') {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = `status-value ${type}`;
        }

        // إظهار نتيجة اختبار
        function showTestResult(containerId, passed, message) {
            const container = document.getElementById(containerId);
            const result = document.createElement('div');
            result.className = `test-result ${passed ? 'pass' : 'fail'}`;
            result.textContent = `${passed ? '✅' : '❌'} ${message}`;
            container.innerHTML = '';
            container.appendChild(result);
        }

        // ========================================
        // تهيئة عند التحميل
        // ========================================

        document.addEventListener('DOMContentLoaded', async () => {
            log('🚀 بدء تهيئة صفحة الاختبار...', 'info');

            // فحص Capacitor
            if (typeof Capacitor !== 'undefined') {
                isCapacitorAvailable = true;
                updateStatus('capacitorStatus', 'متاح ✓', 'success');
                log('✓ Capacitor متاح', 'success');

                // فحص المنصة
                const platform = Capacitor.getPlatform();
                updateStatus('platformStatus', platform, platform === 'android' ? 'success' : 'warning');
                log(`📱 المنصة: ${platform}`, 'info');

                // فحص Plugin
                if (Capacitor.Plugins && Capacitor.Plugins.BackgroundSync) {
                    BackgroundSyncPlugin = Capacitor.Plugins.BackgroundSync;
                    isPluginAvailable = true;
                    updateStatus('pluginStatus', 'متاح ✓', 'success');
                    log('✓ BackgroundSync Plugin متاح', 'success');
                } else {
                    updateStatus('pluginStatus', 'غير متاح ✗', 'error');
                    log('✗ BackgroundSync Plugin غير متاح', 'error');
                }
            } else {
                updateStatus('capacitorStatus', 'غير متاح (متصفح)', 'warning');
                updateStatus('pluginStatus', 'غير متاح', 'warning');
                updateStatus('platformStatus', 'متصفح', 'warning');
                log('⚠️ Capacitor غير متاح - وضع المتصفح', 'warning');
            }

            // فحص SyncService
            if (typeof SyncService !== 'undefined') {
                updateStatus('syncServiceStatus', 'متاح ✓', 'success');
                log('✓ SyncService متاح', 'success');

                // تهيئة Plugin في SyncService
                if (BackgroundSyncPlugin) {
                    SyncService.BackgroundSyncPlugin = BackgroundSyncPlugin;
                    log('✓ تم ربط Plugin مع SyncService', 'success');
                }
            } else {
                updateStatus('syncServiceStatus', 'غير متاح ✗', 'error');
                log('✗ SyncService غير متاح', 'error');
            }

            // تهيئة Slider
            const slider = document.getElementById('progressSlider');
            slider.addEventListener('input', (e) => {
                const value = e.target.value;
                document.getElementById('sliderValue').textContent = value;
                updateLocalProgress(value);
            });

            log('✓ اكتملت التهيئة', 'success');
        });

        // ========================================
        // تحديث Progress المحلي
        // ========================================

        function updateLocalProgress(value, indeterminate = false) {
            const bar = document.getElementById('localProgressBar');
            const text = document.getElementById('localProgressText');

            if (indeterminate) {
                bar.classList.add('indeterminate');
                bar.style.width = '100%';
                bar.textContent = '...';
                text.textContent = 'جاري...';
            } else {
                bar.classList.remove('indeterminate');
                bar.style.width = value + '%';
                bar.textContent = value + '%';
                text.textContent = value + '%';
            }
        }

        // ========================================
        // اختبارات Progress Bar
        // ========================================

        async function sendManualProgress() {
            const progress = parseInt(document.getElementById('progressSlider').value);
            const status = document.getElementById('statusMessage').value;

            log(`📤 إرسال Progress: ${progress}% - "${status}"`, 'info');

            try {
                if (SyncService && SyncService.updateNotificationProgress) {
                    await SyncService.updateNotificationProgress(progress, 100, status);
                    log('✓ تم إرسال Progress بنجاح', 'success');
                    showTestResult('testResults', true, `تم إرسال Progress: ${progress}%`);
                } else if (BackgroundSyncPlugin) {
                    await BackgroundSyncPlugin.updateProgress({
                        progress: progress,
                        max: 100,
                        status: status
                    });
                    log('✓ تم إرسال Progress مباشرة للـ Plugin', 'success');
                    showTestResult('testResults', true, `تم إرسال Progress: ${progress}%`);
                } else {
                    throw new Error('لا يوجد Plugin أو SyncService متاح');
                }
            } catch (error) {
                log(`✗ فشل: ${error.message}`, 'error');
                showTestResult('testResults', false, `فشل: ${error.message}`);
            }
        }

        async function setIndeterminateMode() {
            const status = document.getElementById('statusMessage').value;

            log(`🔄 تعيين وضع دائري: "${status}"`, 'info');
            updateLocalProgress(0, true);

            try {
                if (SyncService && SyncService.setNotificationIndeterminate) {
                    await SyncService.setNotificationIndeterminate(status);
                    log('✓ تم تعيين الوضع الدائري', 'success');
                    showTestResult('testResults', true, 'تم تعيين الوضع الدائري');
                } else if (BackgroundSyncPlugin) {
                    await BackgroundSyncPlugin.setIndeterminate({ message: status });
                    log('✓ تم تعيين الوضع الدائري مباشرة', 'success');
                    showTestResult('testResults', true, 'تم تعيين الوضع الدائري');
                } else {
                    throw new Error('لا يوجد Plugin أو SyncService متاح');
                }
            } catch (error) {
                log(`✗ فشل: ${error.message}`, 'error');
                showTestResult('testResults', false, `فشل: ${error.message}`);
            }
        }

        async function showCompleteNotification() {
            log('✅ إظهار إشعار الاكتمال...', 'info');
            updateLocalProgress(100);

            try {
                if (SyncService && SyncService.showNotificationComplete) {
                    await SyncService.showNotificationComplete('✅ اكتملت المزامنة بنجاح!');
                    log('✓ تم إظهار إشعار الاكتمال', 'success');
                    showTestResult('testResults', true, 'تم إظهار إشعار الاكتمال');
                } else if (BackgroundSyncPlugin) {
                    await BackgroundSyncPlugin.showComplete({ message: '✅ اكتملت المزامنة بنجاح!' });
                    log('✓ تم إظهار إشعار الاكتمال مباشرة', 'success');
                    showTestResult('testResults', true, 'تم إظهار إشعار الاكتمال');
                } else {
                    throw new Error('لا يوجد Plugin أو SyncService متاح');
                }
            } catch (error) {
                log(`✗ فشل: ${error.message}`, 'error');
                showTestResult('testResults', false, `فشل: ${error.message}`);
            }
        }

        // ========================================
        // اختبارات الخدمة
        // ========================================

        async function testStartService() {
            log('🚀 محاولة بدء الخدمة...', 'info');

            try {
                if (SyncService && SyncService.startBackgroundService) {
                    const result = await SyncService.startBackgroundService();
                    log(`✓ تم بدء الخدمة: ${JSON.stringify(result)}`, 'success');
                    showTestResult('testResults', true, 'تم بدء الخدمة بنجاح');
                } else if (BackgroundSyncPlugin) {
                    const result = await BackgroundSyncPlugin.startService();
                    log(`✓ تم بدء الخدمة: ${JSON.stringify(result)}`, 'success');
                    showTestResult('testResults', true, 'تم بدء الخدمة بنجاح');
                } else {
                    throw new Error('لا يوجد Plugin أو SyncService متاح');
                }
            } catch (error) {
                log(`✗ فشل: ${error.message}`, 'error');
                showTestResult('testResults', false, `فشل: ${error.message}`);
            }
        }

        async function testStopService() {
            log('⏹️ محاولة إيقاف الخدمة...', 'info');

            try {
                if (SyncService && SyncService.stopBackgroundService) {
                    const result = await SyncService.stopBackgroundService();
                    log(`✓ تم إيقاف الخدمة: ${JSON.stringify(result)}`, 'success');
                    showTestResult('testResults', true, 'تم إيقاف الخدمة بنجاح');
                } else if (BackgroundSyncPlugin) {
                    const result = await BackgroundSyncPlugin.stopService();
                    log(`✓ تم إيقاف الخدمة: ${JSON.stringify(result)}`, 'success');
                    showTestResult('testResults', true, 'تم إيقاف الخدمة بنجاح');
                } else {
                    throw new Error('لا يوجد Plugin أو SyncService متاح');
                }
            } catch (error) {
                log(`✗ فشل: ${error.message}`, 'error');
                showTestResult('testResults', false, `فشل: ${error.message}`);
            }
        }

        // ========================================
        // اختبار Progress تلقائي
        // ========================================

        async function runProgressTest() {
            log('▶️ بدء اختبار Progress تلقائي...', 'info');

            try {
                // بدء الخدمة أولاً
                if (BackgroundSyncPlugin) {
                    await BackgroundSyncPlugin.startService();
                    log('✓ تم بدء الخدمة', 'success');
                }

                // محاكاة progress من 0 إلى 100
                for (let i = 0; i <= 100; i += 10) {
                    document.getElementById('progressSlider').value = i;
                    document.getElementById('sliderValue').textContent = i;
                    updateLocalProgress(i);

                    if (SyncService && SyncService.updateNotificationProgress) {
                        await SyncService.updateNotificationProgress(i, 100, `تم ${i}%`);
                    } else if (BackgroundSyncPlugin) {
                        await BackgroundSyncPlugin.updateProgress({
                            progress: i,
                            max: 100,
                            status: `تم ${i}%`
                        });
                    }

                    log(`📊 Progress: ${i}%`, 'info');
                    await new Promise(r => setTimeout(r, 500));
                }

                log('✓ اكتمل اختبار Progress', 'success');
                showTestResult('testResults', true, 'اكتمل اختبار Progress بنجاح!');

            } catch (error) {
                log(`✗ فشل: ${error.message}`, 'error');
                showTestResult('testResults', false, `فشل: ${error.message}`);
            }
        }

        async function runFullCycleTest() {
            log('🔁 بدء دورة اختبار كاملة...', 'info');

            try {
                // 1. بدء الخدمة
                log('1️⃣ بدء الخدمة...', 'info');
                if (SyncService && SyncService.startBackgroundService) {
                    await SyncService.startBackgroundService();
                } else if (BackgroundSyncPlugin) {
                    await BackgroundSyncPlugin.startService();
                }
                await new Promise(r => setTimeout(r, 1000));

                // 2. وضع دائري
                log('2️⃣ وضع دائري...', 'info');
                updateLocalProgress(0, true);
                if (SyncService && SyncService.setNotificationIndeterminate) {
                    await SyncService.setNotificationIndeterminate('جاري التحضير...');
                } else if (BackgroundSyncPlugin) {
                    await BackgroundSyncPlugin.setIndeterminate({ message: 'جاري التحضير...' });
                }
                await new Promise(r => setTimeout(r, 2000));

                // 3. Progress من 0 إلى 100
                log('3️⃣ تقدم من 0 إلى 100...', 'info');
                for (let i = 0; i <= 100; i += 20) {
                    updateLocalProgress(i);
                    document.getElementById('progressSlider').value = i;
                    document.getElementById('sliderValue').textContent = i;

                    if (SyncService && SyncService.updateNotificationProgress) {
                        await SyncService.updateNotificationProgress(i, 100, `جاري الرفع... ${i}%`);
                    } else if (BackgroundSyncPlugin) {
                        await BackgroundSyncPlugin.updateProgress({
                            progress: i,
                            max: 100,
                            status: `جاري الرفع... ${i}%`
                        });
                    }
                    log(`   📊 ${i}%`, 'info');
                    await new Promise(r => setTimeout(r, 800));
                }

                // 4. إشعار الاكتمال
                log('4️⃣ إشعار الاكتمال...', 'info');
                if (SyncService && SyncService.showNotificationComplete) {
                    await SyncService.showNotificationComplete('✅ اكتملت الدورة الكاملة!');
                } else if (BackgroundSyncPlugin) {
                    await BackgroundSyncPlugin.showComplete({ message: '✅ اكتملت الدورة الكاملة!' });
                }

                log('✓ اكتملت الدورة الكاملة بنجاح!', 'success');
                showTestResult('testResults', true, '🎉 اكتملت الدورة الكاملة بنجاح!');

            } catch (error) {
                log(`✗ فشل: ${error.message}`, 'error');
                showTestResult('testResults', false, `فشل: ${error.message}`);
            }
        }

        // ========================================
        // اختبارات البطارية
        // ========================================

        async function checkBatteryOptimization() {
            log('🔋 فحص تحسين البطارية...', 'info');

            try {
                if (SyncService && SyncService.checkBatteryOptimization) {
                    const isIgnoring = await SyncService.checkBatteryOptimization();
                    const status = isIgnoring ? 'مستثنى ✓' : 'غير مستثنى ✗';
                    log(`🔋 حالة البطارية: ${status}`, isIgnoring ? 'success' : 'warning');
                    showTestResult('batteryResults', isIgnoring, `حالة البطارية: ${status}`);
                } else if (BackgroundSyncPlugin) {
                    const result = await BackgroundSyncPlugin.isIgnoringBatteryOptimizations();
                    const status = result.isIgnoring ? 'مستثنى ✓' : 'غير مستثنى ✗';
                    log(`🔋 حالة البطارية: ${status}`, result.isIgnoring ? 'success' : 'warning');
                    showTestResult('batteryResults', result.isIgnoring, `حالة البطارية: ${status}`);
                } else {
                    throw new Error('لا يوجد Plugin متاح');
                }
            } catch (error) {
                log(`✗ فشل: ${error.message}`, 'error');
                showTestResult('batteryResults', false, `فشل: ${error.message}`);
            }
        }

        async function requestBatteryExemption() {
            log('⚡ طلب استثناء البطارية...', 'info');

            try {
                if (SyncService && SyncService.requestBatteryOptimizationExemption) {
                    await SyncService.requestBatteryOptimizationExemption();
                    log('✓ تم فتح إعدادات البطارية', 'success');
                    showTestResult('batteryResults', true, 'تم فتح إعدادات البطارية');
                } else if (BackgroundSyncPlugin) {
                    await BackgroundSyncPlugin.requestIgnoreBatteryOptimizations();
                    log('✓ تم فتح إعدادات البطارية', 'success');
                    showTestResult('batteryResults', true, 'تم فتح إعدادات البطارية');
                } else {
                    throw new Error('لا يوجد Plugin متاح');
                }
            } catch (error) {
                log(`✗ فشل: ${error.message}`, 'error');
                showTestResult('batteryResults', false, `فشل: ${error.message}`);
            }
        }
    </script>
