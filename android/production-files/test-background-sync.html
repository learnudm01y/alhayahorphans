<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار خدمة المزامنة في الخلفية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4fc3f7;
        }
        .test-section {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-section h2 {
            color: #81c784;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        .test-btn {
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .test-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .test-btn.primary {
            background: linear-gradient(135deg, #4fc3f7, #29b6f6);
            color: #fff;
        }
        .test-btn.success {
            background: linear-gradient(135deg, #81c784, #66bb6a);
            color: #fff;
        }
        .test-btn.warning {
            background: linear-gradient(135deg, #ffb74d, #ffa726);
            color: #333;
        }
        .test-btn.danger {
            background: linear-gradient(135deg, #e57373, #ef5350);
            color: #fff;
        }
        .test-btn.info {
            background: linear-gradient(135deg, #9575cd, #7e57c2);
            color: #fff;
        }
        .log-container {
            background: #0d1117;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .log-entry {
            padding: 5px 10px;
            margin: 2px 0;
            border-radius: 5px;
        }
        .log-entry.info { background: rgba(79, 195, 247, 0.2); color: #4fc3f7; }
        .log-entry.success { background: rgba(129, 199, 132, 0.2); color: #81c784; }
        .log-entry.error { background: rgba(229, 115, 115, 0.2); color: #e57373; }
        .log-entry.warning { background: rgba(255, 183, 77, 0.2); color: #ffb74d; }

        .progress-demo {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
        }
        .progress-bar-container {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 30px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4fc3f7, #29b6f6);
            border-radius: 10px;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
        }
        .progress-status {
            text-align: center;
            margin-top: 10px;
            color: #b0bec5;
        }

        .test-result {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        .test-result.pass {
            background: rgba(129, 199, 132, 0.2);
            border: 1px solid #81c784;
        }
        .test-result.fail {
            background: rgba(229, 115, 115, 0.2);
            border: 1px solid #e57373;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #4fc3f7;
        }
        .stat-card .label {
            font-size: 12px;
            color: #b0bec5;
            margin-top: 5px;
        }

        #clearLog {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 اختبار خدمة المزامنة في الخلفية</h1>

        <!-- إحصائيات الاختبار -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="totalTests">0</div>
                <div class="label">إجمالي الاختبارات</div>
            </div>
            <div class="stat-card">
                <div class="number" id="passedTests" style="color: #81c784;">0</div>
                <div class="label">ناجحة</div>
            </div>
            <div class="stat-card">
                <div class="number" id="failedTests" style="color: #e57373;">0</div>
                <div class="label">فاشلة</div>
            </div>
            <div class="stat-card">
                <div class="number" id="pendingTests" style="color: #ffb74d;">0</div>
                <div class="label">قيد الانتظار</div>
            </div>
        </div>

        <!-- اختبار الدوال الأساسية -->
        <div class="test-section">
            <h2>📋 اختبار الدوال الأساسية</h2>
            <div class="test-grid">
                <button class="test-btn primary" onclick="testSyncServiceExists()">
                    🔍 التحقق من وجود SyncService
                </button>
                <button class="test-btn primary" onclick="testBackgroundSyncPlugin()">
                    🔌 التحقق من BackgroundSyncPlugin
                </button>
                <button class="test-btn primary" onclick="testProgressFunctions()">
                    📊 التحقق من دوال Progress
                </button>
                <button class="test-btn primary" onclick="testNetworkFunctions()">
                    🌐 التحقق من دوال الشبكة
                </button>
            </div>
        </div>

        <!-- اختبار Progress Bar -->
        <div class="test-section">
            <h2>📊 اختبار Progress Bar</h2>
            <div class="test-grid">
                <button class="test-btn success" onclick="testProgressUpdate()">
                    ▶️ تشغيل Progress Demo
                </button>
                <button class="test-btn warning" onclick="testIndeterminate()">
                    🔄 وضع دائري
                </button>
                <button class="test-btn info" onclick="testComplete()">
                    ✅ إشعار الاكتمال
                </button>
            </div>

            <div class="progress-demo">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="demoProgress" style="width: 0%;">0%</div>
                </div>
                <div class="progress-status" id="progressStatus">في انتظار البدء...</div>
            </div>
        </div>

        <!-- اختبار خدمة الخلفية -->
        <div class="test-section">
            <h2>🔧 اختبار خدمة الخلفية (Android)</h2>
            <div class="test-grid">
                <button class="test-btn success" onclick="testStartService()">
                    ▶️ بدء الخدمة
                </button>
                <button class="test-btn danger" onclick="testStopService()">
                    ⏹️ إيقاف الخدمة
                </button>
                <button class="test-btn warning" onclick="testBatteryOptimization()">
                    🔋 فحص البطارية
                </button>
                <button class="test-btn info" onclick="testRequestBatteryExemption()">
                    ⚡ طلب استثناء البطارية
                </button>
            </div>
        </div>

        <!-- اختبار المزامنة -->
        <div class="test-section">
            <h2>🔄 اختبار المزامنة</h2>
            <div class="test-grid">
                <button class="test-btn primary" onclick="testAutoUploadInit()">
                    🚀 تهيئة الرفع التلقائي
                </button>
                <button class="test-btn success" onclick="testUploadPendingChanges()">
                    📤 رفع التعديلات المعلقة
                </button>
                <button class="test-btn info" onclick="testGetPendingCount()">
                    📊 عدد المعلقة
                </button>
                <button class="test-btn warning" onclick="testNetworkStatus()">
                    📶 حالة الشبكة
                </button>
            </div>
        </div>

        <!-- اختبار شامل -->
        <div class="test-section">
            <h2>🎯 اختبار شامل</h2>
            <div class="test-grid">
                <button class="test-btn success" onclick="runAllTests()" style="grid-column: span 2;">
                    ▶️ تشغيل جميع الاختبارات
                </button>
                <button class="test-btn danger" onclick="clearTestResults()" style="grid-column: span 2;">
                    🗑️ مسح النتائج
                </button>
            </div>
        </div>

        <!-- سجل الاختبارات -->
        <div class="test-section">
            <h2>📜 سجل الاختبارات</h2>
            <div class="log-container" id="logContainer"></div>
        </div>
    </div>

    <button class="test-btn danger" id="clearLog" onclick="clearLog()">🗑️ مسح السجل</button>

    <script src="sync-service.js"></script>
    <script>
        // متغيرات الإحصائيات
        let totalTests = 0;
        let passedTests = 0;
        let failedTests = 0;
        let pendingTests = 0;

        // تسجيل في السجل
        function log(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString('ar-SA');
            entry.textContent = `[${time}] ${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        // تحديث الإحصائيات
        function updateStats() {
            document.getElementById('totalTests').textContent = totalTests;
            document.getElementById('passedTests').textContent = passedTests;
            document.getElementById('failedTests').textContent = failedTests;
            document.getElementById('pendingTests').textContent = pendingTests;
        }

        // تسجيل نتيجة اختبار
        function recordTest(name, passed, message = '') {
            totalTests++;
            if (passed) {
                passedTests++;
                log(`✅ ${name}: نجح ${message ? '- ' + message : ''}`, 'success');
            } else {
                failedTests++;
                log(`❌ ${name}: فشل ${message ? '- ' + message : ''}`, 'error');
            }
            updateStats();
        }

        // مسح السجل
        function clearLog() {
            document.getElementById('logContainer').innerHTML = '';
        }

        // مسح نتائج الاختبار
        function clearTestResults() {
            totalTests = 0;
            passedTests = 0;
            failedTests = 0;
            pendingTests = 0;
            updateStats();
            clearLog();
            log('تم مسح جميع النتائج', 'warning');
        }

        // ========================================
        // اختبارات الدوال الأساسية
        // ========================================

        function testSyncServiceExists() {
            log('🔍 التحقق من وجود SyncService...', 'info');

            const exists = typeof SyncService !== 'undefined';
            recordTest('وجود SyncService', exists, exists ? 'موجود' : 'غير موجود');

            if (exists) {
                // التحقق من الدوال الأساسية
                const functions = [
                    'updateNotificationProgress',
                    'setNotificationIndeterminate',
                    'showNotificationComplete',
                    'startBackgroundService',
                    'stopBackgroundService',
                    'checkBatteryOptimization',
                    'requestBatteryOptimizationExemption'
                ];

                let allExist = true;
                functions.forEach(fn => {
                    const fnExists = typeof SyncService[fn] === 'function';
                    if (!fnExists) {
                        log(`  ⚠️ الدالة ${fn} غير موجودة`, 'warning');
                        allExist = false;
                    } else {
                        log(`  ✓ الدالة ${fn} موجودة`, 'success');
                    }
                });

                recordTest('جميع دوال Progress', allExist);
            }
        }

        function testBackgroundSyncPlugin() {
            log('🔌 التحقق من BackgroundSyncPlugin...', 'info');

            // في المتصفح العادي لن يكون موجوداً
            const hasCapacitor = typeof Capacitor !== 'undefined';

            if (hasCapacitor) {
                const hasPlugin = Capacitor.Plugins && Capacitor.Plugins.BackgroundSync;
                recordTest('BackgroundSyncPlugin', !!hasPlugin, hasPlugin ? 'موجود' : 'غير موجود');
            } else {
                log('⚠️ Capacitor غير متاح (هذا طبيعي في المتصفح)', 'warning');
                recordTest('BackgroundSyncPlugin', true, 'تخطي - بيئة متصفح');
            }
        }

        function testProgressFunctions() {
            log('📊 التحقق من دوال Progress...', 'info');

            const tests = [
                { name: 'updateNotificationProgress', fn: SyncService.updateNotificationProgress },
                { name: 'setNotificationIndeterminate', fn: SyncService.setNotificationIndeterminate },
                { name: 'showNotificationComplete', fn: SyncService.showNotificationComplete }
            ];

            let allPassed = true;
            tests.forEach(test => {
                const passed = typeof test.fn === 'function';
                if (!passed) allPassed = false;
                log(`  ${passed ? '✓' : '✗'} ${test.name}: ${passed ? 'موجودة' : 'غير موجودة'}`,
                    passed ? 'success' : 'error');
            });

            recordTest('دوال Progress', allPassed);
        }

        function testNetworkFunctions() {
            log('🌐 التحقق من دوال الشبكة...', 'info');

            const hasNetworkStatus = 'networkStatus' in SyncService;
            const hasAutoUpload = typeof SyncService.initAutoUpload === 'function';
            const hasMonitorNetwork = typeof SyncService.monitorNetworkStatus === 'function';

            log(`  ${hasNetworkStatus ? '✓' : '✗'} networkStatus: ${hasNetworkStatus ? 'موجود' : 'غير موجود'}`,
                hasNetworkStatus ? 'success' : 'error');
            log(`  ${hasAutoUpload ? '✓' : '✗'} initAutoUpload: ${hasAutoUpload ? 'موجودة' : 'غير موجودة'}`,
                hasAutoUpload ? 'success' : 'error');
            log(`  ${hasMonitorNetwork ? '✓' : '✗'} monitorNetworkStatus: ${hasMonitorNetwork ? 'موجودة' : 'غير موجودة'}`,
                hasMonitorNetwork ? 'success' : 'error');

            recordTest('دوال الشبكة', hasNetworkStatus && hasAutoUpload);
        }

        // ========================================
        // اختبارات Progress Bar
        // ========================================

        async function testProgressUpdate() {
            log('▶️ بدء اختبار Progress Bar...', 'info');

            const progressBar = document.getElementById('demoProgress');
            const statusEl = document.getElementById('progressStatus');

            for (let i = 0; i <= 100; i += 10) {
                progressBar.style.width = i + '%';
                progressBar.textContent = i + '%';
                statusEl.textContent = `جاري التقدم... ${i}%`;

                // استدعاء دالة التحديث الفعلية
                try {
                    await SyncService.updateNotificationProgress(i, 100, `تم ${i}%`);
                    log(`  📊 تحديث: ${i}/100`, 'info');
                } catch (e) {
                    // في المتصفح العادي سيفشل
                }

                await new Promise(resolve => setTimeout(resolve, 200));
            }

            statusEl.textContent = '✅ اكتمل!';
            recordTest('Progress Bar Demo', true, 'اكتمل بنجاح');
        }

        async function testIndeterminate() {
            log('🔄 اختبار الوضع الدائري...', 'info');

            const progressBar = document.getElementById('demoProgress');
            const statusEl = document.getElementById('progressStatus');

            progressBar.style.width = '100%';
            progressBar.textContent = '...';
            progressBar.style.animation = 'pulse 1s infinite';
            statusEl.textContent = '🔄 جاري المعالجة...';

            try {
                await SyncService.setNotificationIndeterminate('جاري المعالجة...');
                log('✓ تم تعيين الوضع الدائري', 'success');
            } catch (e) {
                log('⚠️ تخطي - بيئة متصفح', 'warning');
            }

            await new Promise(resolve => setTimeout(resolve, 3000));

            progressBar.style.animation = '';
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';
            statusEl.textContent = 'في انتظار البدء...';

            recordTest('Indeterminate Mode', true);
        }

        async function testComplete() {
            log('✅ اختبار إشعار الاكتمال...', 'info');

            const progressBar = document.getElementById('demoProgress');
            const statusEl = document.getElementById('progressStatus');

            progressBar.style.width = '100%';
            progressBar.textContent = '✓';
            progressBar.style.background = 'linear-gradient(90deg, #81c784, #66bb6a)';
            statusEl.textContent = '✅ اكتملت العملية بنجاح!';

            try {
                await SyncService.showNotificationComplete('✅ اكتملت المزامنة بنجاح');
                log('✓ تم إظهار إشعار الاكتمال', 'success');
            } catch (e) {
                log('⚠️ تخطي - بيئة متصفح', 'warning');
            }

            await new Promise(resolve => setTimeout(resolve, 2000));

            progressBar.style.background = 'linear-gradient(90deg, #4fc3f7, #29b6f6)';
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';
            statusEl.textContent = 'في انتظار البدء...';

            recordTest('Complete Notification', true);
        }

        // ========================================
        // اختبارات خدمة الخلفية
        // ========================================

        async function testStartService() {
            log('▶️ محاولة بدء خدمة الخلفية...', 'info');

            try {
                const result = await SyncService.startBackgroundService();
                if (result) {
                    log(`✓ تم بدء الخدمة: ${JSON.stringify(result)}`, 'success');
                    recordTest('بدء خدمة الخلفية', true);
                } else {
                    log('⚠️ النتيجة فارغة (طبيعي في المتصفح)', 'warning');
                    recordTest('بدء خدمة الخلفية', true, 'تخطي - بيئة متصفح');
                }
            } catch (e) {
                log(`✗ فشل: ${e.message}`, 'error');
                recordTest('بدء خدمة الخلفية', false, e.message);
            }
        }

        async function testStopService() {
            log('⏹️ محاولة إيقاف خدمة الخلفية...', 'info');

            try {
                const result = await SyncService.stopBackgroundService();
                if (result) {
                    log(`✓ تم إيقاف الخدمة: ${JSON.stringify(result)}`, 'success');
                    recordTest('إيقاف خدمة الخلفية', true);
                } else {
                    log('⚠️ النتيجة فارغة (طبيعي في المتصفح)', 'warning');
                    recordTest('إيقاف خدمة الخلفية', true, 'تخطي - بيئة متصفح');
                }
            } catch (e) {
                log(`✗ فشل: ${e.message}`, 'error');
                recordTest('إيقاف خدمة الخلفية', false, e.message);
            }
        }

        async function testBatteryOptimization() {
            log('🔋 فحص تحسين البطارية...', 'info');

            try {
                const isIgnoring = await SyncService.checkBatteryOptimization();
                log(`حالة استثناء البطارية: ${isIgnoring ? 'مستثنى ✓' : 'غير مستثنى ✗'}`,
                    isIgnoring ? 'success' : 'warning');
                recordTest('فحص البطارية', true, isIgnoring ? 'مستثنى' : 'غير مستثنى');
            } catch (e) {
                log(`⚠️ تخطي - ${e.message}`, 'warning');
                recordTest('فحص البطارية', true, 'تخطي - بيئة متصفح');
            }
        }

        async function testRequestBatteryExemption() {
            log('⚡ طلب استثناء البطارية...', 'info');

            try {
                const result = await SyncService.requestBatteryOptimizationExemption();
                if (result) {
                    log(`✓ تم فتح إعدادات البطارية`, 'success');
                    recordTest('طلب استثناء البطارية', true);
                } else {
                    log('⚠️ النتيجة فارغة (طبيعي في المتصفح)', 'warning');
                    recordTest('طلب استثناء البطارية', true, 'تخطي - بيئة متصفح');
                }
            } catch (e) {
                log(`⚠️ تخطي - ${e.message}`, 'warning');
                recordTest('طلب استثناء البطارية', true, 'تخطي - بيئة متصفح');
            }
        }

        // ========================================
        // اختبارات المزامنة
        // ========================================

        async function testAutoUploadInit() {
            log('🚀 تهيئة الرفع التلقائي...', 'info');

            try {
                // فقط تحقق من وجود الدالة
                if (typeof SyncService.initAutoUpload === 'function') {
                    log('✓ دالة initAutoUpload موجودة', 'success');

                    // التحقق من الخصائص المطلوبة
                    const props = ['autoUploadEnabled', 'autoUploadQueue', 'autoUploadInProgress'];
                    props.forEach(prop => {
                        if (prop in SyncService) {
                            log(`  ✓ ${prop}: موجود`, 'success');
                        } else {
                            log(`  ✗ ${prop}: غير موجود`, 'error');
                        }
                    });

                    recordTest('تهيئة الرفع التلقائي', true);
                } else {
                    recordTest('تهيئة الرفع التلقائي', false, 'الدالة غير موجودة');
                }
            } catch (e) {
                log(`✗ فشل: ${e.message}`, 'error');
                recordTest('تهيئة الرفع التلقائي', false, e.message);
            }
        }

        async function testUploadPendingChanges() {
            log('📤 اختبار رفع التعديلات المعلقة...', 'info');

            try {
                if (typeof SyncService.uploadPendingChanges === 'function') {
                    log('✓ دالة uploadPendingChanges موجودة', 'success');

                    // التحقق من دالة autoUploadPendingChanges
                    if (typeof SyncService.autoUploadPendingChanges === 'function') {
                        log('✓ دالة autoUploadPendingChanges موجودة', 'success');
                    }

                    recordTest('رفع التعديلات المعلقة', true);
                } else {
                    recordTest('رفع التعديلات المعلقة', false, 'الدالة غير موجودة');
                }
            } catch (e) {
                log(`✗ فشل: ${e.message}`, 'error');
                recordTest('رفع التعديلات المعلقة', false, e.message);
            }
        }

        async function testGetPendingCount() {
            log('📊 الحصول على عدد التعديلات المعلقة...', 'info');

            try {
                const count = await SyncService.getPendingUploadsCount();
                log(`عدد التعديلات المعلقة: ${count}`, 'info');
                recordTest('عدد المعلقة', true, `${count} تعديل`);
            } catch (e) {
                log(`⚠️ تخطي - ${e.message}`, 'warning');
                recordTest('عدد المعلقة', true, 'تخطي - قاعدة بيانات');
            }
        }

        function testNetworkStatus() {
            log('📶 فحص حالة الشبكة...', 'info');

            const status = SyncService.networkStatus;
            const onlineStatus = navigator.onLine;

            log(`SyncService.networkStatus: ${status}`, status ? 'success' : 'warning');
            log(`navigator.onLine: ${onlineStatus}`, onlineStatus ? 'success' : 'warning');

            recordTest('حالة الشبكة', true, status ? 'متصل' : 'غير متصل');
        }

        // ========================================
        // تشغيل جميع الاختبارات
        // ========================================

        async function runAllTests() {
            log('🎯 بدء جميع الاختبارات...', 'info');
            clearTestResults();

            // اختبارات الدوال الأساسية
            testSyncServiceExists();
            await new Promise(r => setTimeout(r, 500));

            testBackgroundSyncPlugin();
            await new Promise(r => setTimeout(r, 500));

            testProgressFunctions();
            await new Promise(r => setTimeout(r, 500));

            testNetworkFunctions();
            await new Promise(r => setTimeout(r, 500));

            // اختبارات خدمة الخلفية
            await testStartService();
            await new Promise(r => setTimeout(r, 500));

            await testBatteryOptimization();
            await new Promise(r => setTimeout(r, 500));

            // اختبارات المزامنة
            await testAutoUploadInit();
            await new Promise(r => setTimeout(r, 500));

            await testUploadPendingChanges();
            await new Promise(r => setTimeout(r, 500));

            await testGetPendingCount();
            await new Promise(r => setTimeout(r, 500));

            testNetworkStatus();

            // ملخص
            log('', 'info');
            log('========================================', 'info');
            log(`📊 ملخص الاختبارات:`, 'info');
            log(`   إجمالي: ${totalTests}`, 'info');
            log(`   ناجحة: ${passedTests}`, 'success');
            log(`   فاشلة: ${failedTests}`, failedTests > 0 ? 'error' : 'success');
            log('========================================', 'info');

            if (failedTests === 0) {
                log('🎉 جميع الاختبارات ناجحة!', 'success');
            } else {
                log(`⚠️ يوجد ${failedTests} اختبار فاشل`, 'error');
            }
        }

        // تهيئة عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            log('🚀 تم تحميل صفحة الاختبار', 'info');
            log('انقر على الأزرار لتشغيل الاختبارات', 'info');

            // إضافة CSS للـ animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes pulse {
                    0%, 100% { opacity: 1; }
                    50% { opacity: 0.5; }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
