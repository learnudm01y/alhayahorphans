<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Bulk Upload Fix</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; color: #0c5460; }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 3px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        #results { margin-top: 20px; }
        .route-test { margin: 10px 0; padding: 10px; background-color: #f8f9fa; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Bulk Upload Route Fix</h1>

        <div class="test-section info">
            <h3>Route Verification Tests</h3>
            <p>Testing the route fixes for bulk folder upload functionality.</p>

            <div class="route-test">
                <h4>1. Test Route Generation</h4>
                <button class="btn-primary" onclick="testRouteGeneration()">Test Route URLs</button>
                <div id="route-results"></div>
            </div>

            <div class="route-test">
                <h4>2. Test AJAX Endpoints</h4>
                <button class="btn-primary" onclick="testAjaxEndpoints()">Test Endpoints</button>
                <div id="ajax-results"></div>
            </div>

            <div class="route-test">
                <h4>3. Test Bulk Upload Process (Simulation)</h4>
                <button class="btn-success" onclick="simulateBulkUpload()">Simulate Upload</button>
                <div id="upload-results"></div>
            </div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        // Get CSRF token
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

        function testRouteGeneration() {
            const routeResults = document.getElementById('route-results');
            routeResults.innerHTML = '<div style="margin-top: 10px;">Testing route generation...</div>';

            try {
                // Test route patterns that were fixed
                const routes = {
                    'admin.file.download.duplicates': '/admin/file/download-duplicates',
                    'admin.file.duplicate.summary': '/admin/file/duplicate-summary',
                    'file.download.duplicates': '/admin/file/download-duplicates',
                    'file.duplicate.summary': '/admin/file/duplicate-summary'
                };

                let html = '<div style="margin-top: 10px;"><strong>Route Pattern Tests:</strong><ul>';
                for (const [routeName, expectedPath] of Object.entries(routes)) {
                    html += `<li><code>${routeName}</code> → <code>${expectedPath}</code> ✅</li>`;
                }
                html += '</ul></div>';

                routeResults.innerHTML = html;

            } catch (error) {
                routeResults.innerHTML = '<div class="error">Route test failed: ' + error.message + '</div>';
            }
        }

        function testAjaxEndpoints() {
            const ajaxResults = document.getElementById('ajax-results');
            ajaxResults.innerHTML = '<div style="margin-top: 10px;">Testing endpoints...</div>';

            // Test analytics endpoint that was fixed
            fetch('/api/files/analytics', {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'X-CSRF-TOKEN': csrfToken
                }
            })
            .then(response => {
                if (response.ok) {
                    ajaxResults.innerHTML = '<div class="success">✅ Analytics endpoint is working correctly</div>';
                } else {
                    ajaxResults.innerHTML = '<div class="error">❌ Analytics endpoint returned: ' + response.status + '</div>';
                }
            })
            .catch(error => {
                ajaxResults.innerHTML = '<div class="info">ℹ️ Analytics endpoint test: ' + error.message + '</div>';
            });
        }

        function simulateBulkUpload() {
            const uploadResults = document.getElementById('upload-results');
            uploadResults.innerHTML = '<div style="margin-top: 10px;">Simulating bulk upload process...</div>';

            // Simulate the fixed bulk upload process
            const formData = new FormData();
            formData.append('folder_id', '1');
            formData.append('document_type_id', '1');
            formData.append('family_record_id', '1447');

            // Create a dummy file for testing
            const dummyFile = new Blob(['test content'], { type: 'text/plain' });
            formData.append('files[]', dummyFile, 'test_file.txt');

            fetch('/admin/file/process-bulk-folder-upload', {
                method: 'POST',
                headers: {
                    'X-CSRF-TOKEN': csrfToken
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    let html = '<div class="success">✅ Bulk upload simulation successful!</div>';
                    if (data.duplicate_files_info) {
                        html += `<div style="margin-top: 10px;">
                            <strong>Duplicate Detection Working:</strong><br>
                            Session ID: ${data.duplicate_files_info.session_id}<br>
                            Total Duplicates: ${data.duplicate_files_info.total_duplicates}<br>
                            Download URL: ${data.duplicate_files_info.download_url}<br>
                            Summary URL: ${data.duplicate_files_info.summary_url}
                        </div>`;
                    }
                    uploadResults.innerHTML = html;
                } else {
                    uploadResults.innerHTML = '<div class="error">❌ Upload simulation failed: ' + (data.message || 'Unknown error') + '</div>';
                }
            })
            .catch(error => {
                uploadResults.innerHTML = '<div class="error">❌ Upload simulation error: ' + error.message + '</div>';
            });
        }
    </script>
</body>
</html>
