<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 اختبار API المجلد 000078</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            direction: rtl;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
        }
        .test-section {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }
        .btn {
            padding: 10px 20px;
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
        .warning { color: #ffd43b; }
        .code {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 اختبار API المجلد 000078</h1>

        <div class="test-section">
            <h2>📊 اختبار API</h2>
            <button onclick="testAPI()" class="btn">اختبار API للمجلد 000078</button>
            <div id="api-results"></div>
        </div>

        <div class="test-section">
            <h2>🔗 اختبار الروابط المباشرة</h2>
            <button onclick="testDirectLinks()" class="btn">اختبار الروابط المباشرة</button>
            <div id="link-results"></div>
        </div>

        <div class="test-section">
            <h2>🛠️ إصلاح المشكلة</h2>
            <button onclick="fixIssue()" class="btn">محاولة إصلاح المشكلة</button>
            <div id="fix-results"></div>
        </div>
    </div>

    <script>
        async function testAPI() {
            const resultsDiv = document.getElementById('api-results');
            resultsDiv.innerHTML = '<div>جاري اختبار API...</div>';

            try {
                const response = await fetch('/admin/folders/contents?folder=000078&type=images');
                const data = await response.json();

                console.log('API Response for 000078:', data);

                let html = '<div class="code">';
                html += '<h3>📋 استجابة API:</h3>';
                html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                html += '</div>';

                if (data.success) {
                    if (data.files && data.files.length > 0) {
                        html += `<div class="success">✅ تم العثور على ${data.files.length} ملف(ات)</div>`;

                        html += '<h4>🖼️ الملفات:</h4>';
                        data.files.forEach((file, index) => {
                            html += `
                                <div style="background: rgba(255,255,255,0.1); padding: 10px; margin: 5px; border-radius: 5px;">
                                    <strong>${index + 1}. ${file.original_file_name}</strong><br>
                                    <small>URL: ${file.download_url}</small><br>
                                    <small>نوع: ${file.is_image ? 'صورة' : 'ملف'}</small>
                                    <br><a href="${file.download_url}" target="_blank" style="color: #51cf66;">فتح الملف</a>
                                </div>
                            `;
                        });
                    } else {
                        html += '<div class="warning">⚠️ API يعمل لكن لا توجد ملفات</div>';
                    }
                } else {
                    html += `<div class="error">❌ خطأ في API: ${data.message || 'غير محدد'}</div>`;
                }

                resultsDiv.innerHTML = html;

            } catch (error) {
                console.error('API Error:', error);
                resultsDiv.innerHTML = `<div class="error">❌ خطأ في الاتصال: ${error.message}</div>`;
            }
        }

        async function testDirectLinks() {
            const resultsDiv = document.getElementById('link-results');
            resultsDiv.innerHTML = '<div>جاري اختبار الروابط المباشرة...</div>';

            // قائمة الملفات الموجودة فيزيائياً
            const physicalFiles = [
                'TE102_000078_2253592.png',
                'TE102_000078_472.png',
                'TES_000078_1234413.png',
                'TES_000078_2312412333.png',
                'TES_000078_812223151.jpg'
            ];

            let html = '<h4>🔗 اختبار الروابط المباشرة:</h4>';

            for (const fileName of physicalFiles) {
                const url = `http://127.0.0.1:8000/storage/uploads/000078/${fileName}`;

                try {
                    const response = await fetch(url, { method: 'HEAD' });
                    const status = response.ok ? 'success' : 'error';
                    const statusText = response.ok ? '✅ متاح' : `❌ غير متاح (${response.status})`;

                    html += `
                        <div style="background: rgba(255,255,255,0.1); padding: 10px; margin: 5px; border-radius: 5px;">
                            <strong>${fileName}</strong>
                            <span class="${status}">${statusText}</span><br>
                            <small>${url}</small>
                            ${response.ok ? `<br><a href="${url}" target="_blank" style="color: #51cf66;">فتح الملف</a>` : ''}
                        </div>
                    `;
                } catch (error) {
                    html += `
                        <div style="background: rgba(255,255,255,0.1); padding: 10px; margin: 5px; border-radius: 5px;">
                            <strong>${fileName}</strong>
                            <span class="error">❌ خطأ: ${error.message}</span><br>
                            <small>${url}</small>
                        </div>
                    `;
                }
            }

            resultsDiv.innerHTML = html;
        }

        async function fixIssue() {
            const resultsDiv = document.getElementById('fix-results');
            resultsDiv.innerHTML = '<div>جاري محاولة إصلاح المشكلة...</div>';

            let html = '<h4>🛠️ خطوات الإصلاح:</h4>';

            // خطوة 1: فحص قاعدة البيانات
            html += '<div style="background: rgba(255,255,255,0.1); padding: 10px; margin: 5px; border-radius: 5px;">';
            html += '<strong>1. فحص قاعدة البيانات:</strong><br>';
            html += 'المشكلة المحتملة: لا توجد سجلات في قاعدة البيانات للمجلد 000078<br>';
            html += '<span class="warning">⚠️ يجب إضافة الملفات إلى قاعدة البيانات</span>';
            html += '</div>';

            // خطوة 2: إضافة البيانات
            html += '<div style="background: rgba(255,255,255,0.1); padding: 10px; margin: 5px; border-radius: 5px;">';
            html += '<strong>2. إضافة البيانات المفقودة:</strong><br>';
            html += '<button onclick="addMissingFiles()" class="btn">إضافة الملفات إلى قاعدة البيانات</button>';
            html += '</div>';

            // خطوة 3: اختبار بعد الإصلاح
            html += '<div style="background: rgba(255,255,255,0.1); padding: 10px; margin: 5px; border-radius: 5px;">';
            html += '<strong>3. اختبار بعد الإصلاح:</strong><br>';
            html += '<button onclick="testAfterFix()" class="btn">اختبار بعد الإصلاح</button>';
            html += '</div>';

            resultsDiv.innerHTML = html;
        }

        async function addMissingFiles() {
            // هذه الدالة ستحتاج لإنشاء endpoint خاص لإضافة البيانات
            alert('هذه الوظيفة تحتاج لتطوير endpoint خاص في Laravel لإضافة البيانات المفقودة');
        }

        async function testAfterFix() {
            // إعادة اختبار API بعد الإصلاح
            testAPI();
        }

        // تشغيل تلقائي عند تحميل الصفحة
        window.onload = function() {
            console.log('🚀 صفحة اختبار المجلد 000078 جاهزة');
            testAPI();
        };
    </script>
</body>
</html>
