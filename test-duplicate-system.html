<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار نظام كشف الملفات المكررة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .test-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin: 2rem auto;
            max-width: 800px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(45deg, #007bff, #0056b3);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .test-section {
            padding: 2rem;
        }
        .log-container {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            height: 400px;
            overflow-y: auto;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-top: 1rem;
        }
        .log-entry {
            margin-bottom: 0.5rem;
            padding: 0.25rem 0;
        }
        .log-success { color: #28a745; }
        .log-error { color: #dc3545; }
        .log-warning { color: #ffc107; }
        .log-info { color: #17a2b8; }
        .test-button {
            background: linear-gradient(45deg, #28a745, #20c997);
            border: none;
            border-radius: 25px;
            color: white;
            padding: 12px 30px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 8px;
        }
        .status-success { background: #28a745; }
        .status-error { background: #dc3545; }
        .status-pending { background: #ffc107; }
    </style>
</head>
<body>
    <div class="container">
        <div class="test-container">
            <div class="header">
                <h1><i class="fas fa-search me-2"></i>اختبار نظام كشف الملفات المكررة</h1>
                <p class="mb-0">نظام شامل لكشف وإدارة الملفات المكررة</p>
            </div>

            <div class="test-section">
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5 class="card-title">
                                    <i class="fas fa-clone text-primary"></i> كشف التكرار
                                    <span id="detection-status" class="status-indicator status-pending"></span>
                                </h5>
                                <p class="card-text">فحص وجود الملفات المكررة</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5 class="card-title">
                                    <i class="fas fa-database text-success"></i> التخزين المؤقت
                                    <span id="storage-status" class="status-indicator status-pending"></span>
                                </h5>
                                <p class="card-text">حفظ الملفات المكررة مؤقتاً</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mb-3">
                    <button id="runTestBtn" class="btn test-button">
                        <i class="fas fa-play me-2"></i>تشغيل الاختبارات
                    </button>
                    <button id="clearLogBtn" class="btn btn-outline-secondary ms-2">
                        <i class="fas fa-trash me-2"></i>مسح السجلات
                    </button>
                </div>

                <div class="log-container" id="logContainer">
                    <div class="log-entry log-info">
                        <i class="fas fa-info-circle"></i> جاهز لبدء الاختبارات...
                    </div>
                </div>

                <div class="mt-3">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body text-center">
                                    <h6>الملفات المكتشفة</h6>
                                    <h3 id="detectedCount" class="text-primary">0</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body text-center">
                                    <h6>الملفات المحفوظة</h6>
                                    <h3 id="storedCount" class="text-success">0</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body text-center">
                                    <h6>معرف الجلسة</h6>
                                    <small id="sessionId" class="text-muted">غير محدد</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // متغيرات عامة
        let testResults = {
            duplicateDetection: false,
            temporaryStorage: false,
            summaryRetrieval: false,
            fileDisplay: false
        };

        // عناصر DOM
        const logContainer = document.getElementById('logContainer');
        const runTestBtn = document.getElementById('runTestBtn');
        const clearLogBtn = document.getElementById('clearLogBtn');
        const detectedCount = document.getElementById('detectedCount');
        const storedCount = document.getElementById('storedCount');
        const sessionId = document.getElementById('sessionId');

        // دالة إضافة سجل
        function addLog(message, type = 'info') {
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;

            const icon = type === 'success' ? 'check-circle' :
                        type === 'error' ? 'exclamation-circle' :
                        type === 'warning' ? 'exclamation-triangle' : 'info-circle';

            logEntry.innerHTML = `<i class="fas fa-${icon}"></i> ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // مسح السجلات
        function clearLogs() {
            logContainer.innerHTML = '<div class="log-entry log-info"><i class="fas fa-info-circle"></i> تم مسح السجلات...</div>';
        }

        // تحديث حالة الاختبار
        function updateTestStatus(test, success) {
            testResults[test] = success;
            const statusElement = document.getElementById(`${test.replace(/([A-Z])/g, '-$1').toLowerCase()}-status`);
            if (statusElement) {
                statusElement.className = `status-indicator ${success ? 'status-success' : 'status-error'}`;
            }
        }

        // محاكاة كشف الملفات المكررة
        async function simulateDuplicateDetection() {
            addLog('🔍 بدء كشف الملفات المكررة...', 'info');

            // إنشاء معرف جلسة
            const currentSessionId = 'test_session_' + Date.now();
            sessionStorage.setItem('duplicate_files_session_id', currentSessionId);
            sessionId.textContent = currentSessionId.substring(0, 20) + '...';

            addLog(`🆔 تم إنشاء معرف الجلسة: ${currentSessionId}`, 'info');

            // محاكاة الانتظار
            await new Promise(resolve => setTimeout(resolve, 1000));

            // محاكاة نتيجة الكشف
            const mockResult = {
                success: true,
                duplicates_found: true,
                duplicate_files: [
                    {
                        original_filename: 'document_123.pdf',
                        temp_filename: 'dup_12345_document_123.pdf',
                        folder_path: 'uploads/12345',
                        file_size: 2048000,
                        mime_type: 'application/pdf'
                    },
                    {
                        original_filename: 'image_456.jpg',
                        temp_filename: 'dup_67890_image_456.jpg',
                        folder_path: 'uploads/67890',
                        file_size: 1024000,
                        mime_type: 'image/jpeg'
                    }
                ],
                session_id: currentSessionId
            };

            if (mockResult.duplicates_found) {
                addLog(`✅ تم العثور على ${mockResult.duplicate_files.length} ملف مكرر`, 'success');
                detectedCount.textContent = mockResult.duplicate_files.length;
                updateTestStatus('detection', true);
                return mockResult;
            } else {
                addLog('❌ فشل في كشف الملفات المكررة', 'error');
                updateTestStatus('detection', false);
                return null;
            }
        }

        // محاكاة التخزين المؤقت
        async function simulateTemporaryStorage(duplicateFiles) {
            addLog('💾 بدء التخزين المؤقت للملفات المكررة...', 'info');

            await new Promise(resolve => setTimeout(resolve, 800));

            let storedFiles = 0;
            for (const file of duplicateFiles) {
                addLog(`📁 حفظ الملف: ${file.original_filename}`, 'info');
                await new Promise(resolve => setTimeout(resolve, 300));
                storedFiles++;
                storedCount.textContent = storedFiles;
            }

            addLog(`✅ تم حفظ ${storedFiles} ملف في التخزين المؤقت`, 'success');
            updateTestStatus('storage', true);
            return true;
        }

        // محاكاة جلب ملخص الملفات
        async function simulateSummaryRetrieval() {
            addLog('📊 جلب ملخص الملفات المكررة...', 'info');

            await new Promise(resolve => setTimeout(resolve, 600));

            const currentSessionId = sessionStorage.getItem('duplicate_files_session_id');
            const mockSummary = {
                success: true,
                data: {
                    session_id: currentSessionId,
                    total_duplicates: 2,
                    files: [
                        {
                            id: 1,
                            original_name: 'document_123.pdf',
                            temp_filename: 'dup_12345_document_123.pdf',
                            file_size: 2048000,
                            exists_in_storage: true
                        },
                        {
                            id: 2,
                            original_name: 'image_456.jpg',
                            temp_filename: 'dup_67890_image_456.jpg',
                            file_size: 1024000,
                            exists_in_storage: true
                        }
                    ]
                }
            };

            addLog(`✅ تم جلب معلومات ${mockSummary.data.total_duplicates} ملف مكرر`, 'success');
            updateTestStatus('summaryRetrieval', true);
            return mockSummary;
        }

        // تشغيل جميع الاختبارات
        async function runAllTests() {
            runTestBtn.disabled = true;
            runTestBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>جاري التشغيل...';

            try {
                addLog('🚀 بدء تشغيل الاختبارات الشاملة...', 'info');

                // اختبار 1: كشف الملفات المكررة
                const duplicateResult = await simulateDuplicateDetection();

                if (duplicateResult && duplicateResult.duplicates_found) {
                    // اختبار 2: التخزين المؤقت
                    await simulateTemporaryStorage(duplicateResult.duplicate_files);

                    // اختبار 3: جلب الملخص
                    const summaryResult = await simulateSummaryRetrieval();

                    if (summaryResult && summaryResult.success) {
                        addLog('🎉 تمت جميع الاختبارات بنجاح!', 'success');
                        addLog('📋 النظام يعمل بشكل صحيح ويكتشف الملفات المكررة ويحفظها مؤقتاً', 'success');
                    }
                } else {
                    addLog('❌ فشلت الاختبارات', 'error');
                }

            } catch (error) {
                addLog(`❌ حدث خطأ: ${error.message}`, 'error');
            } finally {
                runTestBtn.disabled = false;
                runTestBtn.innerHTML = '<i class="fas fa-play me-2"></i>تشغيل الاختبارات';
            }
        }

        // ربط الأحداث
        runTestBtn.addEventListener('click', runAllTests);
        clearLogBtn.addEventListener('click', clearLogs);

        // بدء تلقائي عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            addLog('💡 النظام جاهز للاختبار', 'info');
            addLog('📌 اضغط على "تشغيل الاختبارات" لبدء الفحص', 'info');
        });
    </script>
</body>
</html>
