<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار رفع الملفات - Debug</title>
</head>
<body>
    <h1>اختبار رفع ملف Excel</h1>

    <form method="POST" action="http://127.0.0.1:8000/admin/file/excel-upload" enctype="multipart/form-data">
        @csrf
        <div>
            <label for="files">اختر ملف Excel:</label>
            <input type="file" name="files[]" id="files" accept=".xlsx,.xls,.csv" multiple>
        </div>

        <div>
            <label for="processing_mode">نوع المعالجة:</label>
            <select name="processing_mode" id="processing_mode">
                <option value="file-only">حفظ الملف فقط</option>
                <option value="import-data">حفظ + استيراد البيانات</option>
            </select>
        </div>

        <div>
            <input type="hidden" name="enable_excel_import" value="0">
        </div>

        <button type="submit">رفع الملف</button>
    </form>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData();
            const fileInput = document.getElementById('files');
            const files = fileInput.files;

            console.log('Files to upload:', files);

            // Add files with array notation
            for (let i = 0; i < files.length; i++) {
                formData.append('files[]', files[i]);
                console.log('Added file:', files[i].name);
            }

            formData.append('processing_mode', document.getElementById('processing_mode').value);
            formData.append('enable_excel_import', '0');
            formData.append('_token', '{{ csrf_token() }}');

            // Debug FormData
            console.log('FormData entries:');
            for (let pair of formData.entries()) {
                console.log(pair[0] + ':', pair[1]);
            }

            fetch('http://127.0.0.1:8000/admin/file/excel-upload', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRF-TOKEN': '{{ csrf_token() }}',
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                console.log('Response:', data);
                alert(JSON.stringify(data, null, 2));
            })
            .catch(error => {
                console.error('Error:', error);
                alert('خطأ: ' + error.message);
            });
        });
    </script>
</body>
</html>
