<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="test-token">
    <title>اختبار JavaScript Syntax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { padding: 30px; background-color: #f8f9fa; }
        .test-card { max-width: 600px; margin: 0 auto; }
        .status-success { color: #28a745; }
        .status-error { color: #dc3545; }
        .console-output {
            background: #000;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card test-card">
        <div class="card-header bg-primary text-white">
            <h4><i class="fas fa-bug"></i> اختبار JavaScript Syntax</h4>
        </div>
        <div class="card-body">
            <div class="alert alert-info">
                <h6>حالة JavaScript:</h6>
                <p id="jsStatus" class="mb-0">جاري الفحص...</p>
            </div>

            <div class="mb-3">
                <button class="btn btn-primary" onclick="testDownloadFunction()">
                    <i class="fas fa-download"></i> اختبار دالة التنزيل
                </button>
                <button class="btn btn-secondary ms-2" onclick="clearConsole()">
                    <i class="fas fa-eraser"></i> مسح
                </button>
            </div>

            <div class="console-output" id="console"></div>
        </div>
    </div>
</div>

<!-- Modal الاختبار -->
<div class="modal fade" id="duplicateFilesModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-warning-subtle">
                <h5 class="modal-title">الملفات المكررة المكتشفة أثناء الرفع</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="duplicateFilesList">
                    <div class="text-center text-muted">جاري تحميل قائمة الملفات المكررة...</div>
                </div>
                <div class="alert alert-info mt-3" id="duplicateFilesNote" style="display:none;">
                    يمكنك تحميل جميع الملفات المكررة كملف مضغوط أو مراجعتها بشكل فردي.
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                <button type="button" id="deleteDuplicatesBtn" class="btn btn-danger">
                    <i class="fas fa-trash-alt me-1"></i> حذف جميع الملفات المكررة
                </button>
                <button type="button" id="downloadDuplicatesBtn" class="btn btn-warning">
                    <i class="fas fa-download me-1"></i> تحميل جميع الملفات المكررة
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// نسخة من كود Modal مع إصلاح الأخطاء
let duplicateSessionId = 'test_' + Date.now();

function log(message) {
    const console = document.getElementById('console');
    const timestamp = new Date().toLocaleTimeString('ar-SA');
    console.innerHTML += `[${timestamp}] ${message}\n`;
    console.scrollTop = console.scrollHeight;
}

function clearConsole() {
    document.getElementById('console').innerHTML = '';
}

function testDownloadFunction() {
    log('🧪 اختبار دالة التنزيل...');

    try {
        // اختبار دالة triggerDownload
        const sessionId = 'test_session_123';
        const baseUrl = window.location.protocol + '//' + window.location.hostname + ':8000';
        const downloadUrl = `${baseUrl}/api/duplicate-files/download?session_id=${sessionId}`;

        log(`✅ تم إنشاء رابط التنزيل: ${downloadUrl}`);
        log('✅ دالة التنزيل تعمل بدون أخطاء');

        // اختبار إنشاء element
        const link = document.createElement('a');
        link.href = downloadUrl;
        link.download = `duplicate_files_${sessionId}.zip`;
        log('✅ تم إنشاء عنصر الرابط بنجاح');

        log('🎉 جميع الاختبارات نجحت - لا توجد أخطاء JavaScript');

    } catch (error) {
        log(`❌ خطأ في JavaScript: ${error.message}`);
        document.getElementById('jsStatus').innerHTML = `<span class="status-error">❌ يوجد خطأ: ${error.message}</span>`;
        return;
    }
}

// اختبار تحميل الكود
document.addEventListener('DOMContentLoaded', function() {
    log('🚀 بدء اختبار JavaScript...');

    try {
        // دالة التنزيل المبسطة والمضمونة
        function triggerDownload(sessionId) {
            log('🔥 بدء عملية التنزيل');
            log('📋 Session ID: ' + sessionId);

            // إنشاء رابط التنزيل
            const baseUrl = window.location.protocol + '//' + window.location.host;
            const downloadUrl = `${baseUrl}/api/duplicate-files/download?session_id=${sessionId}`;
            log('🌐 رابط التنزيل: ' + downloadUrl);

            // الطريقة الأولى: window.open (الأكثر موثوقية)
            try {
                window.open(downloadUrl, '_blank');
                log('✅ تم فتح رابط التنزيل في نافذة جديدة');
            } catch (error) {
                log('⚠️ فشلت الطريقة الأولى، تجربة الطريقة الثانية...');

                // الطريقة الثانية: إنشاء رابط مخفي
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = `duplicate_files_${sessionId}.zip`;
                link.target = '_blank';
                link.style.display = 'none';

                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                log('✅ تم استخدام الطريقة الثانية');
            }

            return downloadUrl;
        }

        // ربط زر التنزيل
        const downloadBtn = document.getElementById('downloadDuplicatesBtn');
        if (downloadBtn) {
            // إزالة أي event listeners سابقة
            downloadBtn.onclick = null;

            // إضافة event listener جديد
            downloadBtn.addEventListener('click', function(e) {
                e.preventDefault();
                log('🔥 تم الضغط على زر التنزيل');

                // الحصول على session ID
                let sessionId = window.duplicateSessionId || duplicateSessionId;
                if (!sessionId) {
                    sessionId = 'modal_session_' + Date.now();
                    log('⚠️ تم إنشاء session ID جديد: ' + sessionId);
                }

                // إظهار حالة التحميل
                const originalText = downloadBtn.innerHTML;
                downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> جاري التحميل...';
                downloadBtn.disabled = true;

                // تنفيذ التنزيل
                const downloadUrl = triggerDownload(sessionId);

                // استعادة حالة الزر
                setTimeout(() => {
                    downloadBtn.innerHTML = originalText;
                    downloadBtn.disabled = false;
                    log('🔄 تم استعادة حالة الزر');
                }, 2000);
            });

            log('✅ تم ربط زر التنزيل بنجاح');
        } else {
            log('❌ لم يتم العثور على زر التنزيل');
        }

        log('🎉 تم تحميل جميع الدوال بنجاح - لا توجد أخطاء JavaScript');
        document.getElementById('jsStatus').innerHTML = '<span class="status-success">✅ JavaScript يعمل بدون أخطاء</span>';

    } catch (error) {
        log(`❌ خطأ في تحميل JavaScript: ${error.message}`);
        document.getElementById('jsStatus').innerHTML = `<span class="status-error">❌ خطأ: ${error.message}</span>`;
    }
});
</script>

</body>
</html>
