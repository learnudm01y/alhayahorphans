<!DOCTYPE html>
<html>
<head>
    <title>Null Reference Error Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        .test-result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        .code-block { background: #f5f5f5; padding: 10px; margin: 10px 0; border-left: 4px solid #007bff; }
    </style>
</head>
<body>
    <h1>Null Reference Error Prevention Test</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        // Test 1: Safe element selection with null checks
        function testSafeElementSelection() {
            try {
                const nonExistentElement = document.getElementById('nonExistent');
                if (nonExistentElement) {
                    nonExistentElement.addEventListener('click', () => {});
                } else {
                    console.log('Element not found - safely handled');
                }

                results.innerHTML += '<div class="test-result success">✅ Safe element selection test passed</div>';
            } catch (error) {
                results.innerHTML += '<div class="test-result error">❌ Safe element selection test failed: ' + error.message + '</div>';
            }
        }

        // Test 2: Event listener with null checks
        function testEventListenerWithNullChecks() {
            try {
                const mockElements = {
                    fileInput: null,
                    folderInput: document.createElement('input'),
                    startUploadBtn: null,
                    clearAllBtn: document.createElement('button')
                };

                // Simulate safe event listener attachment
                Object.keys(mockElements).forEach(key => {
                    const element = mockElements[key];
                    if (element) {
                        element.addEventListener('click', () => {
                            console.log(`${key} clicked safely`);
                        });
                    } else {
                        console.log(`${key} is null - safely skipped`);
                    }
                });

                results.innerHTML += '<div class="test-result success">✅ Event listener null checks test passed</div>';
            } catch (error) {
                results.innerHTML += '<div class="test-result error">❌ Event listener null checks test failed: ' + error.message + '</div>';
            }
        }

        // Test 3: Safe DOM manipulation
        function testSafeDOMManipulation() {
            try {
                const container = document.getElementById('results');
                const nonExistentContainer = document.getElementById('nonExistent');

                // Safe manipulation
                if (container) {
                    container.style.display = 'block';
                }

                if (nonExistentContainer) {
                    nonExistentContainer.style.display = 'block';
                } else {
                    console.log('Non-existent container safely handled');
                }

                results.innerHTML += '<div class="test-result success">✅ Safe DOM manipulation test passed</div>';
            } catch (error) {
                results.innerHTML += '<div class="test-result error">❌ Safe DOM manipulation test failed: ' + error.message + '</div>';
            }
        }

        // Test 4: Multiple element selection with validation
        function testMultipleElementSelection() {
            try {
                const elements = [
                    'fileInput',
                    'folderInput',
                    'startUploadBtn',
                    'clearAllBtn',
                    'nonExistentElement'
                ];

                const foundElements = {};
                const missingElements = [];

                elements.forEach(elementId => {
                    const element = document.getElementById(elementId);
                    if (element) {
                        foundElements[elementId] = element;
                    } else {
                        missingElements.push(elementId);
                    }
                });

                console.log('Found elements:', Object.keys(foundElements));
                console.log('Missing elements:', missingElements);

                results.innerHTML += '<div class="test-result success">✅ Multiple element selection test passed</div>';
                results.innerHTML += '<div class="test-result warning">⚠️ Missing elements: ' + missingElements.join(', ') + '</div>';
            } catch (error) {
                results.innerHTML += '<div class="test-result error">❌ Multiple element selection test failed: ' + error.message + '</div>';
            }
        }

        // Test 5: Conditional event binding simulation
        function testConditionalEventBinding() {
            try {
                class MockFileManager {
                    constructor() {
                        this.initializeEventListeners();
                    }

                    initializeEventListeners() {
                        const fileInput = document.getElementById('fileInput');
                        const folderInput = document.getElementById('folderInput');
                        const startUploadBtn = document.getElementById('startUploadBtn');
                        const clearAllBtn = document.getElementById('clearAllBtn');

                        // Safe event binding
                        if (fileInput) {
                            fileInput.addEventListener('change', () => {
                                console.log('File input changed');
                            });
                        }

                        if (folderInput) {
                            folderInput.addEventListener('change', () => {
                                console.log('Folder input changed');
                            });
                        }

                        if (startUploadBtn) {
                            startUploadBtn.addEventListener('click', () => {
                                console.log('Upload started');
                            });
                        }

                        if (clearAllBtn) {
                            clearAllBtn.addEventListener('click', () => {
                                console.log('Files cleared');
                            });
                        }
                    }
                }

                const mockManager = new MockFileManager();

                results.innerHTML += '<div class="test-result success">✅ Conditional event binding test passed</div>';
            } catch (error) {
                results.innerHTML += '<div class="test-result error">❌ Conditional event binding test failed: ' + error.message + '</div>';
            }
        }

        // Run all tests
        window.onload = function() {
            results.innerHTML = '<h2>Running Null Reference Prevention Tests...</h2>';

            testSafeElementSelection();
            testEventListenerWithNullChecks();
            testSafeDOMManipulation();
            testMultipleElementSelection();
            testConditionalEventBinding();

            // Summary
            const errorCount = document.querySelectorAll('.error').length;
            const successCount = document.querySelectorAll('.success').length;
            const warningCount = document.querySelectorAll('.warning').length;

            results.innerHTML += `<div class="code-block">
                <h3>Test Summary:</h3>
                <p>✅ Passed: ${successCount}</p>
                <p>⚠️ Warnings: ${warningCount}</p>
                <p>❌ Failed: ${errorCount}</p>
                <p><strong>Overall Status: ${errorCount === 0 ? 'ALL TESTS PASSED' : 'SOME TESTS FAILED'}</strong></p>
                <p><strong>Null Safety: ${errorCount === 0 ? 'SECURE' : 'NEEDS ATTENTION'}</strong></p>
            </div>`;
        };
    </script>
</body>
</html>
