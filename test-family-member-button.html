<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار زر إضافة فرد الأسرة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.7.20/sweetalert2.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center mb-4">🧪 اختبار زر إضافة فرد الأسرة</h2>

        <div class="row">
            <div class="col-md-10 mx-auto">
                <!-- محاكاة الواجهة -->
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">أفراد الأسرة</h5>
                    </div>
                    <div class="card-body">
                        <div id="familyMembersContainer">
                            <!-- النموذج المرجعي -->
                            <div class="family-member-form border rounded p-3 mb-3 d-none" data-member-index="template" id="familyMemberTemplate" data-upload-zone="template">
                                <div class="row">
                                    <div class="col-md-6">
                                        <label>اسم الفرد</label>
                                        <input type="text" class="form-control" name="family_members[template][name]">
                                    </div>
                                    <div class="col-md-6">
                                        <label>رقم الهوية</label>
                                        <input type="text" class="form-control" name="family_members[template][person_id]">
                                    </div>
                                </div>
                                <div class="mt-3">
                                    <div data-upload-zone="template">
                                        <select class="form-control mainDocumentTypeSelect">
                                            <option value="">اختر نوع الوثيقة</option>
                                            <option value="national_id">بطاقة الهوية</option>
                                        </select>
                                        <input type="file" class="form-control mainDocumentFileInput mt-2">
                                        <div class="mainDocumentPreview mt-2"></div>
                                        <div class="mainDocumentNames mt-2"></div>
                                    </div>
                                </div>
                                <input type="hidden" name="family_members[template][file_id]" value="12345">
                                <input type="hidden" name="family_members[template][registration_id]" value="REG-001">
                            </div>
                        </div>

                        <button type="button" class="btn btn-primary" id="addFamilyMember">
                            <i class="fas fa-plus me-2"></i>إضافة فرد
                        </button>
                    </div>
                </div>

                <!-- منطقة التشخيص -->
                <div class="card mt-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">حالة النظام</h5>
                    </div>
                    <div class="card-body">
                        <div id="diagnostics">
                            <div class="alert alert-info">
                                <i class="fas fa-info-circle me-2"></i>
                                انتظار... سيتم فحص النظام تلقائياً
                            </div>
                        </div>
                        <button class="btn btn-outline-primary" onclick="runDiagnostics()">
                            <i class="fas fa-search me-2"></i>فحص النظام
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // محاكاة window.allDocs
        if (!window.allDocs) {
            window.allDocs = new Map();
        }

        // محاكاة setupDocumentUploadHandlersForMember
        window.setupDocumentUploadHandlersForMember = function(form, idx) {
            console.log(`✅ setupDocumentUploadHandlersForMember called for form ${idx}`);
            return true;
        };

        // دالة إعادة الفهرسة
        window.reindexFamilyMembers = function reindexFamilyMembers() {
            console.log('🔄 reindexFamilyMembers called');
            const forms = document.querySelectorAll('#familyMembersContainer .family-member-form:not(.d-none)');
            console.log(`Found ${forms.length} family member forms`);
            return true;
        };

        // دالة إضافة فرد جديد - مبسطة للاختبار
        window.addFamilyMember = function addFamilyMember() {
            try {
                console.log('🚀 بدء تنفيذ addFamilyMember');

                const container = document.getElementById('familyMembersContainer');
                if (!container) {
                    console.error('❌ لم يتم العثور على familyMembersContainer');
                    return false;
                }

                let forms = container.querySelectorAll('.family-member-form:not(.d-none)');
                let template = document.getElementById('familyMemberTemplate');

                if (!template) {
                    console.error('❌ لم يتم العثور على familyMemberTemplate');
                    return false;
                }

                let newIndex = forms.length;
                console.log(`📝 إنشاء نموذج جديد برقم: ${newIndex}`);

                let clone = template.cloneNode(true);
                clone.classList.remove('d-none');
                clone.removeAttribute('id');
                clone.setAttribute('data-member-index', newIndex);

                // تحديث أسماء الحقول والفهارس
                clone.querySelectorAll('[name]').forEach(function(input) {
                    input.name = input.name.replace(/family_members\[template\]/g, `family_members[${newIndex}]`);
                    if (input.type === 'text' || input.type === 'number' || input.type === 'date') {
                        input.value = '';
                    } else if (input.tagName === 'SELECT') {
                        input.selectedIndex = 0;
                    }
                });

                // تحديث data-upload-zone
                const uploadZone = clone.querySelector('[data-upload-zone]');
                if (uploadZone) {
                    uploadZone.setAttribute('data-upload-zone', `family_${newIndex}`);
                }

                // تحديث معرفات العناصر
                const docType = clone.querySelector('.mainDocumentTypeSelect');
                if (docType) docType.id = `mainDocumentTypeSelect_${newIndex}`;
                const fileInput = clone.querySelector('.mainDocumentFileInput');
                if (fileInput) fileInput.id = `mainDocumentFileInput_${newIndex}`;
                const preview = clone.querySelector('.mainDocumentPreview');
                if (preview) preview.id = `mainDocumentPreview_${newIndex}`;
                const names = clone.querySelector('.mainDocumentNames');
                if (names) names.id = `mainDocumentNames_${newIndex}`;

                // إضافة header وزر حذف
                let cardHeader = document.createElement('div');
                cardHeader.className = 'card-header bg-gradient-primary text-dark py-3 d-flex justify-content-between align-items-center';
                cardHeader.innerHTML = `
                    <h5 class="card-title mb-0 d-flex align-items-center">
                        <i class="fas fa-user fs-4 me-2"></i>
                        بيانات فرد الأسرة ${newIndex + 1}
                    </h5>
                    <button type="button" class="btn btn-danger btn-sm delete-member">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                clone.insertBefore(cardHeader, clone.firstChild);

                // ربط زر الحذف
                cardHeader.querySelector('.delete-member').onclick = function(e) {
                    e.preventDefault();
                    if (confirm('هل تريد حذف هذا الفرد؟')) {
                        clone.remove();
                        window.reindexFamilyMembers();
                        updateDiagnostics();
                    }
                };

                container.appendChild(clone);
                console.log(`✅ تم توليد نموذج ${newIndex}: data-upload-zone = family_${newIndex}`);

                // تهيئة window.allDocs
                if (window.allDocs && window.allDocs instanceof Map) {
                    window.allDocs.set(`family_${newIndex}`, []);
                }

                window.reindexFamilyMembers();
                updateDiagnostics();

                return true;
            } catch (error) {
                console.error('❌ خطأ في addFamilyMember:', error);
                return false;
            }
        };

        // ربط زر إضافة فرد الأسرة
        document.addEventListener('DOMContentLoaded', function() {
            const addFamilyMemberBtn = document.getElementById('addFamilyMember');
            if (addFamilyMemberBtn) {
                addFamilyMemberBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('🖱️ تم النقر على زر إضافة فرد الأسرة');

                    if (typeof window.addFamilyMember === 'function') {
                        const result = window.addFamilyMember();
                        if (result) {
                            console.log('✅ تم إضافة فرد الأسرة بنجاح');
                            Swal.fire({
                                icon: 'success',
                                title: 'تم بنجاح!',
                                text: 'تم إضافة فرد الأسرة الجديد',
                                timer: 2000,
                                showConfirmButton: false
                            });
                        } else {
                            console.error('❌ فشل في إضافة فرد الأسرة');
                            Swal.fire({
                                icon: 'error',
                                title: 'خطأ',
                                text: 'حدث خطأ أثناء إضافة فرد الأسرة',
                                timer: 3000,
                                showConfirmButton: false
                            });
                        }
                    } else {
                        console.error('❌ دالة addFamilyMember غير متوفرة');
                    }
                });

                console.log('🔗 تم ربط زر إضافة فرد الأسرة بنجاح');
            } else {
                console.error('❌ لم يتم العثور على زر إضافة فرد الأسرة');
            }

            // تشغيل التشخيص التلقائي
            setTimeout(runDiagnostics, 1000);
        });

        function runDiagnostics() {
            const diagnosticsDiv = document.getElementById('diagnostics');
            diagnosticsDiv.innerHTML = '';

            const tests = [
                {
                    name: 'عنصر familyMembersContainer',
                    test: () => !!document.getElementById('familyMembersContainer')
                },
                {
                    name: 'قالب familyMemberTemplate',
                    test: () => !!document.getElementById('familyMemberTemplate')
                },
                {
                    name: 'زر addFamilyMember',
                    test: () => !!document.getElementById('addFamilyMember')
                },
                {
                    name: 'دالة addFamilyMember',
                    test: () => typeof window.addFamilyMember === 'function'
                },
                {
                    name: 'دالة reindexFamilyMembers',
                    test: () => typeof window.reindexFamilyMembers === 'function'
                },
                {
                    name: 'window.allDocs',
                    test: () => window.allDocs instanceof Map
                }
            ];

            let passedTests = 0;
            tests.forEach(test => {
                const result = test.test();
                const status = result ? 'success' : 'danger';
                const icon = result ? 'check-circle' : 'times-circle';

                if (result) passedTests++;

                diagnosticsDiv.innerHTML += `
                    <div class="alert alert-${status} d-flex align-items-center mb-2">
                        <i class="fas fa-${icon} me-2"></i>
                        <strong>${test.name}:</strong>
                        <span class="ms-auto">${result ? '✅ متوفر' : '❌ غير متوفر'}</span>
                    </div>
                `;
            });

            // عدد النماذج الحالية
            const forms = document.querySelectorAll('#familyMembersContainer .family-member-form:not(.d-none)');
            diagnosticsDiv.innerHTML += `
                <div class="alert alert-info d-flex align-items-center">
                    <i class="fas fa-users me-2"></i>
                    <strong>عدد أفراد الأسرة الحاليين:</strong>
                    <span class="ms-auto badge bg-primary">${forms.length}</span>
                </div>
            `;

            if (passedTests === tests.length) {
                diagnosticsDiv.innerHTML += `
                    <div class="alert alert-success mt-3">
                        <i class="fas fa-thumbs-up me-2"></i>
                        <strong>جميع الاختبارات نجحت!</strong> النظام جاهز للعمل.
                    </div>
                `;
            } else {
                diagnosticsDiv.innerHTML += `
                    <div class="alert alert-warning mt-3">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <strong>هناك مشاكل:</strong> ${passedTests}/${tests.length} اختبار نجح.
                    </div>
                `;
            }
        }

        function updateDiagnostics() {
            const forms = document.querySelectorAll('#familyMembersContainer .family-member-form:not(.d-none)');
            console.log(`تحديث: يوجد ${forms.length} فرد في الأسرة`);
        }
    </script>
</body>
</html>
