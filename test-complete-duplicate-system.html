<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار شامل لإدارة الملفات المكررة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            direction: rtl;
            text-align: right;
        }
        .test-section {
            border: 2px solid #007bff;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        .test-section h3 {
            color: #007bff;
            border-bottom: 1px solid #007bff;
            padding-bottom: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            background-color: #f9f9f9;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .error {
            border-color: #dc3545;
            background-color: #f8d7da;
            color: #721c24;
        }
        .success {
            border-color: #28a745;
            background-color: #d4edda;
            color: #155724;
        }
        input[type="text"] {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>اختبار شامل لنظام إدارة الملفات المكررة</h1>

    <div class="test-section">
        <h3>1. إنشاء ملفات مكررة للاختبار</h3>
        <input type="text" id="testSessionId" placeholder="معرف الجلسة (اختياري)" />
        <button onclick="createTestDuplicates()">إنشاء ملفات مكررة للاختبار</button>
        <div id="createResult" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h3>2. عرض ملخص الملفات المكررة</h3>
        <input type="text" id="summarySessionId" placeholder="معرف الجلسة" />
        <button onclick="getDuplicateSummary()">عرض الملخص</button>
        <div id="summaryResult" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h3>3. تحميل الملفات المكررة</h3>
        <input type="text" id="downloadSessionId" placeholder="معرف الجلسة" />
        <button onclick="downloadDuplicates()">تحميل الملفات المكررة</button>
        <div id="downloadResult" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h3>4. حذف الملفات المكررة</h3>
        <input type="text" id="deleteSessionId" placeholder="معرف الجلسة" />
        <button onclick="deleteDuplicates()">حذف الملفات المكررة</button>
        <div id="deleteResult" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h3>5. اختبار شامل للتدفق الكامل</h3>
        <button onclick="runCompleteTest()">تشغيل الاختبار الشامل</button>
        <div id="completeTestResult" class="result" style="display:none;"></div>
    </div>

    <script>
        const baseUrl = '/admin/file';

        // إنشاء ملفات مكررة للاختبار
        async function createTestDuplicates() {
            const sessionId = document.getElementById('testSessionId').value || 'test_' + Date.now();
            const resultDiv = document.getElementById('createResult');

            try {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result';
                resultDiv.textContent = 'جاري إنشاء الملفات المكررة...';

                const response = await fetch(`${baseUrl}/create-test-duplicates`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || ''
                    },
                    body: JSON.stringify({ session_id: sessionId })
                });

                const result = await response.json();

                if (result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ تم إنشاء ${result.data.created_files} ملف مكرر بنجاح\nمعرف الجلسة: ${result.data.session_id}`;

                    // تحديث الحقول الأخرى بمعرف الجلسة
                    document.getElementById('summarySessionId').value = result.data.session_id;
                    document.getElementById('downloadSessionId').value = result.data.session_id;
                    document.getElementById('deleteSessionId').value = result.data.session_id;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ فشل: ${result.message}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ خطأ في الاتصال: ${error.message}`;
            }
        }

        // عرض ملخص الملفات المكررة
        async function getDuplicateSummary() {
            const sessionId = document.getElementById('summarySessionId').value;
            const resultDiv = document.getElementById('summaryResult');

            if (!sessionId) {
                alert('يرجى إدخال معرف الجلسة');
                return;
            }

            try {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result';
                resultDiv.textContent = 'جاري تحميل الملخص...';

                const response = await fetch(`${baseUrl}/duplicate-summary?session_id=${sessionId}`);
                const result = await response.json();

                if (result.success) {
                    resultDiv.className = 'result success';
                    let summaryText = `✅ تم العثور على ${result.data.total_duplicates} ملف مكرر\n\n`;

                    if (result.data.duplicates && result.data.duplicates.length > 0) {
                        summaryText += 'تفاصيل الملفات:\n';
                        result.data.duplicates.forEach((file, index) => {
                            summaryText += `${index + 1}. ${file.original_name} → ${file.duplicate_name}\n`;
                            summaryText += `   المجلد الأصلي: ${file.original_folder}\n`;
                            summaryText += `   المجلد المستهدف: ${file.target_folder}\n\n`;
                        });
                    }
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ فشل: ${result.message}`;
                }

                resultDiv.textContent = summaryText || resultDiv.textContent;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ خطأ في الاتصال: ${error.message}`;
            }
        }

        // تحميل الملفات المكررة
        async function downloadDuplicates() {
            const sessionId = document.getElementById('downloadSessionId').value;
            const resultDiv = document.getElementById('downloadResult');

            if (!sessionId) {
                alert('يرجى إدخال معرف الجلسة');
                return;
            }

            try {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result';
                resultDiv.textContent = 'جاري تحضير التحميل...';

                const response = await fetch(`${baseUrl}/download-duplicates?session_id=${sessionId}`);

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `duplicates_${sessionId}.zip`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);

                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ تم بدء التحميل بنجاح';
                } else {
                    const errorResult = await response.json();
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ فشل التحميل: ${errorResult.message}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ خطأ في التحميل: ${error.message}`;
            }
        }

        // حذف الملفات المكررة
        async function deleteDuplicates() {
            const sessionId = document.getElementById('deleteSessionId').value;
            const resultDiv = document.getElementById('deleteResult');

            if (!sessionId) {
                alert('يرجى إدخال معرف الجلسة');
                return;
            }

            if (!confirm('هل أنت متأكد من حذف جميع الملفات المكررة لهذه الجلسة؟')) {
                return;
            }

            try {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result';
                resultDiv.textContent = 'جاري حذف الملفات...';

                const response = await fetch(`${baseUrl}/delete-duplicates?session_id=${sessionId}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || ''
                    }
                });

                const result = await response.json();

                if (result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ ${result.message}\nتم حذف ${result.data.deleted_files} ملف\nتم حذف ${result.data.deleted_records} سجل من قاعدة البيانات`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ فشل: ${result.message}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ خطأ في الحذف: ${error.message}`;
            }
        }

        // اختبار شامل للتدفق الكامل
        async function runCompleteTest() {
            const resultDiv = document.getElementById('completeTestResult');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';

            let log = '🔄 بدء الاختبار الشامل...\n\n';
            resultDiv.textContent = log;

            try {
                // 1. إنشاء ملفات مكررة
                log += '1️⃣ إنشاء ملفات مكررة للاختبار...\n';
                resultDiv.textContent = log;

                const sessionId = 'complete_test_' + Date.now();
                const createResponse = await fetch(`${baseUrl}/create-test-duplicates`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || ''
                    },
                    body: JSON.stringify({ session_id: sessionId })
                });

                const createResult = await createResponse.json();
                if (createResult.success) {
                    log += `✅ تم إنشاء ${createResult.data.created_files} ملف مكرر\n\n`;
                } else {
                    log += `❌ فشل في الإنشاء: ${createResult.message}\n\n`;
                    resultDiv.textContent = log;
                    return;
                }
                resultDiv.textContent = log;

                // 2. عرض الملخص
                log += '2️⃣ عرض ملخص الملفات المكررة...\n';
                resultDiv.textContent = log;

                const summaryResponse = await fetch(`${baseUrl}/duplicate-summary?session_id=${sessionId}`);
                const summaryResult = await summaryResponse.json();
                if (summaryResult.success) {
                    log += `✅ تم العثور على ${summaryResult.data.total_duplicates} ملف مكرر\n\n`;
                } else {
                    log += `❌ فشل في عرض الملخص: ${summaryResult.message}\n\n`;
                }
                resultDiv.textContent = log;

                // 3. تحميل الملفات
                log += '3️⃣ اختبار تحميل الملفات...\n';
                resultDiv.textContent = log;

                const downloadResponse = await fetch(`${baseUrl}/download-duplicates?session_id=${sessionId}`);
                if (downloadResponse.ok) {
                    log += '✅ رابط التحميل يعمل بشكل صحيح\n\n';
                } else {
                    const downloadError = await downloadResponse.json();
                    log += `❌ فشل التحميل: ${downloadError.message}\n\n`;
                }
                resultDiv.textContent = log;

                // 4. حذف الملفات
                log += '4️⃣ حذف الملفات المكررة...\n';
                resultDiv.textContent = log;

                const deleteResponse = await fetch(`${baseUrl}/delete-duplicates?session_id=${sessionId}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || ''
                    }
                });

                const deleteResult = await deleteResponse.json();
                if (deleteResult.success) {
                    log += `✅ تم حذف ${deleteResult.data.deleted_files} ملف و ${deleteResult.data.deleted_records} سجل\n\n`;
                } else {
                    log += `❌ فشل في الحذف: ${deleteResult.message}\n\n`;
                }
                resultDiv.textContent = log;

                // 5. التحقق من الحذف
                log += '5️⃣ التحقق من اكتمال الحذف...\n';
                resultDiv.textContent = log;

                const verifyResponse = await fetch(`${baseUrl}/duplicate-summary?session_id=${sessionId}`);
                const verifyResult = await verifyResponse.json();
                if (!verifyResult.success && verifyResult.message.includes('لا توجد ملفات مكررة')) {
                    log += '✅ تم التأكد من حذف جميع الملفات\n\n';
                } else {
                    log += '⚠️ قد تكون هناك ملفات متبقية\n\n';
                }
                resultDiv.textContent = log;

                log += '🎉 اكتمل الاختبار الشامل بنجاح!\n';
                log += '✅ جميع وظائف النظام تعمل بشكل صحيح';

                resultDiv.className = 'result success';
                resultDiv.textContent = log;

            } catch (error) {
                log += `❌ خطأ غير متوقع: ${error.message}`;
                resultDiv.className = 'result error';
                resultDiv.textContent = log;
            }
        }
    </script>
</body>
</html>
