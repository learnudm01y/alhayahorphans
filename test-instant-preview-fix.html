<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار إصلاح الإظهار المؤقت - أفراد الأسرة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .mock-family-form {
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            background: #f8f9fa;
        }
        .simulate-button {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            margin: 10px;
        }
        .simulate-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4);
        }
        .log-output {
            background: #1e1e1e;
            color: #00ff00;
            border-radius: 10px;
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            margin-top: 20px;
        }
        .test-preview {
            border: 2px dashed #dee2e6;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            min-height: 200px;
            background: white;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="text-center mb-4">
            <h1 class="text-primary">
                <i class="fas fa-microscope me-3"></i>
                اختبار إصلاح الإظهار المؤقت
            </h1>
            <p class="text-muted">اختبار سريع لفحص عمل منظومة الإظهار المؤقت بعد الإصلاحات</p>
        </div>

        <!-- محاكاة النظام -->
        <div class="mock-family-form">
            <h4 class="mb-3">
                <i class="fas fa-users text-primary me-2"></i>
                محاكاة بوابة أفراد الأسرة
            </h4>

            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">نوع الوثيقة</label>
                    <select class="form-select mainDocumentTypeSelect" id="mockDocType">
                        <option value="">اختر نوع الوثيقة</option>
                        <option value="identity">هوية شخصية</option>
                        <option value="passport">جواز سفر</option>
                        <option value="birth_certificate">شهادة ميلاد</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">رقم الهوية</label>
                    <input type="text" class="form-control" id="mockPersonId" value="1234567890" />
                </div>
            </div>

            <div class="test-preview mainDocumentPreview" id="mockPreview">
                <div class="text-center text-muted">
                    <i class="fas fa-image fa-4x mb-3"></i>
                    <p>ستظهر الصورة المؤقتة هنا فور رفعها</p>
                </div>
            </div>

            <div class="text-center">
                <button class="simulate-button" onclick="simulateInstantPreview()">
                    <i class="fas fa-magic me-2"></i>محاكاة الإظهار المؤقت
                </button>
                <button class="simulate-button" onclick="testTemporaryDocument()">
                    <i class="fas fa-clock me-2"></i>اختبار الوثيقة المؤقتة
                </button>
                <button class="simulate-button" onclick="clearTest()">
                    <i class="fas fa-eraser me-2"></i>مسح الاختبار
                </button>
            </div>
        </div>

        <!-- سجل الأحداث -->
        <div class="mb-3">
            <h5>
                <i class="fas fa-terminal text-info me-2"></i>
                سجل الأحداث
            </h5>
            <div class="log-output" id="logOutput"></div>
        </div>
    </div>

    <script>
        // متغيرات المحاكاة
        let mockDocuments = [];
        let mockIndex = 0;

        // دالة تسجيل الأحداث
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;

            const logOutput = document.getElementById('logOutput');
            const logLine = document.createElement('div');
            logLine.style.color = type === 'error' ? '#ff4444' :
                                 type === 'success' ? '#44ff44' :
                                 type === 'warning' ? '#ffaa44' : '#00ff00';
            logLine.textContent = logEntry;
            logOutput.appendChild(logLine);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        // تهيئة window.allDocs للمحاكاة
        if (!window.allDocs) {
            window.allDocs = new Map();
            log('تم إنشاء window.allDocs للمحاكاة', 'info');
        }

        // محاكاة دالة المقص
        if (!window.showCropperModal) {
            window.showCropperModal = function(file, callback) {
                log('محاكاة فتح المقص...', 'info');
                setTimeout(() => {
                    const croppedFile = new File([file], file.name.replace('.', '_cropped.'), {
                        type: file.type,
                        lastModified: Date.now()
                    });
                    log('محاكاة نجاح القص وإرجاع الملف', 'success');
                    callback(croppedFile);
                }, 2000);
            };
        }

        // محاكاة دالة renderDocuments للاختبار
        function mockRenderDocuments() {
            log(`🎨 بدء renderDocuments - عدد الوثائق: ${mockDocuments.length}`, 'info');

            const preview = document.getElementById('mockPreview');
            preview.innerHTML = '';

            if (mockDocuments.length === 0) {
                preview.innerHTML = `
                    <div class="text-center text-muted">
                        <i class="fas fa-image fa-4x mb-3"></i>
                        <p>لا توجد وثائق للعرض</p>
                    </div>
                `;
                log('لا توجد وثائق للعرض', 'warning');
                return;
            }

            // إنشاء wrapper للبطاقات
            const cardsWrapper = document.createElement('div');
            cardsWrapper.className = 'd-flex flex-wrap gap-3 justify-content-center';

            // عرض عنوان للوثائق المؤقتة
            const tempCount = mockDocuments.filter(doc => doc.isTemporary).length;
            if (tempCount > 0) {
                const tempAlert = document.createElement('div');
                tempAlert.className = 'w-100 mb-3';
                tempAlert.innerHTML = `
                    <div class="alert alert-warning border-0" style="
                        background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
                        border-left: 4px solid #ffc107 !important;
                        animation: alertPulse 2s infinite;
                    ">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-hourglass-half text-warning me-3" style="animation: spin 2s linear infinite;"></i>
                            <strong>جاري المعالجة... (${tempCount} وثيقة مؤقتة)</strong>
                        </div>
                    </div>
                    <style>
                        @keyframes alertPulse {
                            0% { opacity: 0.9; }
                            50% { opacity: 1; }
                            100% { opacity: 0.9; }
                        }
                        @keyframes spin {
                            0% { transform: rotate(0deg); }
                            100% { transform: rotate(360deg); }
                        }
                    </style>
                `;
                cardsWrapper.appendChild(tempAlert);
            }

            // عرض كل وثيقة
            mockDocuments.forEach((doc, idx) => {
                log(`🎨 إنشاء بطاقة للوثيقة ${idx + 1}: ${doc.docName} (مؤقت: ${doc.isTemporary})`, 'info');

                const card = document.createElement('div');
                card.className = 'card border-0 shadow-sm';

                if (doc.isTemporary) {
                    card.style.cssText = `
                        width: 250px;
                        border-radius: 15px;
                        background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
                        border: 3px solid #ffc107 !important;
                        animation: pulseTemp 2s infinite;
                        transform: scale(1.05);
                        z-index: 10;
                    `;
                } else {
                    card.style.cssText = `
                        width: 220px;
                        border-radius: 12px;
                        background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
                        border: 1px solid #e3e6f0 !important;
                    `;
                }

                // Header
                const header = document.createElement('div');
                header.className = 'card-header text-white p-3';
                if (doc.isTemporary) {
                    header.style.background = 'linear-gradient(135deg, #ff8906 0%, #ffc107 100%)';
                    header.innerHTML = `
                        <div class="d-flex align-items-center justify-content-between">
                            <div class="d-flex align-items-center">
                                <i class="fas fa-clock me-2" style="animation: spin 2s linear infinite;"></i>
                                <strong>${doc.typeText}</strong>
                            </div>
                            <span class="badge bg-light text-warning fw-bold">مؤقت</span>
                        </div>
                    `;
                } else {
                    header.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                    header.innerHTML = `
                        <div class="d-flex align-items-center justify-content-between">
                            <div class="d-flex align-items-center">
                                <i class="fas fa-file-image me-2"></i>
                                <strong>${doc.typeText}</strong>
                            </div>
                            <i class="fas fa-check-circle text-success"></i>
                        </div>
                    `;
                }

                // Body
                const body = document.createElement('div');
                body.className = 'card-body p-3 text-center';
                body.innerHTML = `
                    <div class="mb-3">
                        <div class="bg-light p-4 rounded" style="height: 120px; display: flex; align-items: center; justify-content: center;">
                            <i class="fas fa-image fa-3x ${doc.isTemporary ? 'text-warning' : 'text-primary'}"></i>
                        </div>
                    </div>
                    <div class="badge ${doc.isTemporary ? 'bg-warning text-dark' : 'bg-success'} mb-2">
                        <i class="fas fa-${doc.isTemporary ? 'hourglass-half' : 'check-circle'} me-1"></i>
                        ${doc.isTemporary ? 'معالجة...' : 'معالج'}
                    </div>
                    <div class="small text-muted">${doc.docName}</div>
                `;

                card.appendChild(header);
                card.appendChild(body);
                cardsWrapper.appendChild(card);
            });

            preview.appendChild(cardsWrapper);
            preview.style.display = 'block';

            // إضافة CSS للتأثيرات
            if (!document.querySelector('#mockAnimations')) {
                const style = document.createElement('style');
                style.id = 'mockAnimations';
                style.textContent = `
                    @keyframes pulseTemp {
                        0% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.8); }
                        70% { box-shadow: 0 0 0 15px rgba(255, 193, 7, 0); }
                        100% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0); }
                    }
                `;
                document.head.appendChild(style);
            }

            log(`✅ تم عرض ${mockDocuments.length} وثيقة بنجاح`, 'success');
        }

        // محاكاة الإظهار المؤقت
        function simulateInstantPreview() {
            log('🚀 بدء محاكاة الإظهار المؤقت...', 'info');

            const docType = document.getElementById('mockDocType').value;
            const personId = document.getElementById('mockPersonId').value;

            if (!docType) {
                Swal.fire({
                    icon: 'warning',
                    title: 'تنبيه',
                    text: 'يرجى اختيار نوع الوثيقة أولاً'
                });
                return;
            }

            // إنشاء وثيقة مؤقتة
            const tempDoc = {
                type: docType,
                typeText: document.getElementById('mockDocType').selectedOptions[0].text,
                docName: `${docType}_123_${personId}.jpg`,
                personId: personId,
                fileId: '123',
                personKey: 'family_0',
                isTemporary: true,
                timestamp: Date.now()
            };

            log(`📸 إنشاء وثيقة مؤقتة: ${tempDoc.docName}`, 'info');

            // إضافة إلى المصفوفة
            mockDocuments.push(tempDoc);

            // إضافة إلى window.allDocs
            let docsArr = window.allDocs.get('family_0') || [];
            docsArr.push(tempDoc);
            window.allDocs.set('family_0', docsArr);

            log(`📋 إضافة الوثيقة المؤقتة إلى allDocs، العدد الآن: ${docsArr.length}`, 'info');

            // عرض فوري
            log('🎯 بدء الإظهار المؤقت الفوري...', 'success');
            mockRenderDocuments();

            // محاكاة المقص بعد تأخير
            setTimeout(() => {
                log('✂️ فتح المقص...', 'info');

                // محاكاة نجاح القص بعد 2 ثانية
                setTimeout(() => {
                    // حذف المؤقتة
                    const tempIndex = mockDocuments.findIndex(doc => doc.isTemporary && doc.timestamp === tempDoc.timestamp);
                    if (tempIndex !== -1) {
                        mockDocuments.splice(tempIndex, 1);
                        log('🗑️ تم حذف الوثيقة المؤقتة', 'info');
                    }

                    // إضافة النهائية
                    const finalDoc = {
                        ...tempDoc,
                        isTemporary: false,
                        timestamp: Date.now(),
                        croppedFrom: tempDoc.timestamp
                    };
                    mockDocuments.push(finalDoc);
                    log(`✅ تم إنشاء الوثيقة النهائية: ${finalDoc.docName}`, 'success');

                    // إعادة العرض
                    mockRenderDocuments();
                }, 2000);
            }, 800);
        }

        // اختبار الوثيقة المؤقتة فقط
        function testTemporaryDocument() {
            log('⚡ اختبار عرض الوثيقة المؤقتة فقط...', 'info');

            const tempDoc = {
                type: 'identity',
                typeText: 'هوية شخصية',
                docName: 'identity_test_123.jpg',
                personId: '123456',
                fileId: 'test',
                personKey: 'family_test',
                isTemporary: true,
                timestamp: Date.now()
            };

            mockDocuments = [tempDoc];
            mockRenderDocuments();
            log('✅ تم عرض الوثيقة المؤقتة للاختبار', 'success');
        }

        // مسح الاختبار
        function clearTest() {
            mockDocuments = [];
            window.allDocs.clear();
            document.getElementById('mockPreview').innerHTML = `
                <div class="text-center text-muted">
                    <i class="fas fa-image fa-4x mb-3"></i>
                    <p>ستظهر الصورة المؤقتة هنا فور رفعها</p>
                </div>
            `;
            document.getElementById('logOutput').innerHTML = '';
            log('🧹 تم مسح جميع البيانات', 'warning');
        }

        // تهيئة الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            log('📄 تم تحميل صفحة اختبار الإظهار المؤقت', 'info');
            log('ℹ️ استخدم الأزرار أعلاه لاختبار المنظومة', 'info');
        });
    </script>
</body>
</html>
