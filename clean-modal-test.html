<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Modal الملفات المكررة - نسخة نظيفة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalDublicateFiles">
        <i class="fas fa-copy"></i> فتح Modal الملفات المكررة
    </button>
</div>

<!-- Modal الملفات المكررة -->
<div class="modal fade" id="modalDublicateFiles" tabindex="-1" aria-labelledby="modalDublicateFilesLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title" id="modalDublicateFilesLabel">
                    <i class="fas fa-copy me-2"></i>
                    الملفات المكررة المؤقتة
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body">
                <!-- منطقة قائمة الملفات -->
                <div id="duplicateFilesList">
                    <div class="text-center">
                        <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
                        <p class="mt-2">جاري تحميل قائمة الملفات المكررة...</p>
                    </div>
                </div>

                <!-- ملاحظة هامة -->
                <div id="duplicateFilesNote" class="alert alert-info mt-3">
                    <i class="fas fa-info-circle me-2"></i>
                    <strong>ملاحظة:</strong> هذه الملفات محفوظة مؤقتاً لمدة 7 أيام فقط. يُنصح بتحميلها قبل انتهاء المدة.
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times me-1"></i> إغلاق
                </button>
                <button type="button" class="btn btn-success" id="downloadDuplicatesBtn">
                    <i class="fas fa-download me-1"></i> تحميل جميع الملفات (ZIP)
                </button>
                <button type="button" class="btn btn-danger" id="deleteDuplicatesBtn">
                    <i class="fas fa-trash me-1"></i> حذف جميع الملفات
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// متغيرات عامة
let duplicateSessionId = 'clean_test_' + Date.now();

// دالة تسجيل الأحداث
function log(message, type = 'info') {
    const colors = {
        'info': 'color: #007bff',
        'success': 'color: #28a745',
        'error': 'color: #dc3545',
        'warning': 'color: #ffc107'
    };
    console.log(`%c[${new Date().toLocaleTimeString('ar-SA')}] ${message}`, colors[type]);
}

// دالة تنزيل الملفات المكررة - نسخة نظيفة ومضمونة
function downloadDuplicateFiles() {
    log('🚀 بدء عملية تنزيل الملفات المكررة', 'info');

    const sessionId = duplicateSessionId;
    log(`📋 Session ID: ${sessionId}`, 'info');

    // رابط التنزيل المطلق
    const downloadUrl = `http://127.0.0.1:8000/api/duplicate-files/download?session_id=${sessionId}`;
    log(`🌐 رابط التنزيل: ${downloadUrl}`, 'info');

    // إنشاء رابط تنزيل مباشر
    const link = document.createElement('a');
    link.href = downloadUrl;
    link.download = `duplicate_files_${sessionId}.zip`;
    link.target = '_blank';
    link.style.display = 'none';

    // تشغيل التنزيل
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    log('✅ تم تشغيل رابط التنزيل - تحقق من مجلد Downloads', 'success');

    // عرض رسالة نجاح
    showSuccessMessage('تم بدء التنزيل! تحقق من مجلد التنزيلات.', `ملف: duplicate_files_${sessionId}.zip`);
}

// دالة حذف الملفات المكررة
function deleteDuplicateFiles() {
    if (!confirm('هل أنت متأكد من حذف جميع الملفات المكررة؟')) {
        return;
    }

    log('🗑️ بدء عملية حذف الملفات المكررة', 'warning');

    const sessionId = duplicateSessionId;

    fetch(`http://127.0.0.1:8000/api/duplicate-files/delete?session_id=${sessionId}`, {
        method: 'DELETE',
        headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json',
            'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.getAttribute('content')
        }
    })
    .then(response => {
        log(`📡 استجابة API: ${response.status}`, response.ok ? 'success' : 'error');
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        return response.json();
    })
    .then(data => {
        log('✅ تم الحذف بنجاح', 'success');

        if (data.success && data.data) {
            const deletedFiles = data.data.deleted_files || 0;
            const deletedRecords = data.data.deleted_records || 0;

            showSuccessMessage(
                'تم حذف الملفات المكررة بنجاح!',
                `الملفات المحذوفة: ${deletedFiles} | السجلات المحذوفة: ${deletedRecords}`
            );
        }
    })
    .catch(error => {
        log(`❌ خطأ في الحذف: ${error.message}`, 'error');
        showErrorMessage('خطأ في حذف الملفات: ' + error.message);
    });
}

// دالة عرض رسالة نجاح
function showSuccessMessage(title, details) {
    const alertDiv = document.createElement('div');
    alertDiv.className = 'alert alert-success mt-3';
    alertDiv.innerHTML = `
        <i class="fas fa-check-circle me-2"></i>
        ${title}
        <br><small>${details}</small>
    `;

    const listDiv = document.getElementById('duplicateFilesList');
    if (listDiv) {
        listDiv.innerHTML = '';
        listDiv.appendChild(alertDiv);
    }
}

// دالة عرض رسالة خطأ
function showErrorMessage(message) {
    const alertDiv = document.createElement('div');
    alertDiv.className = 'alert alert-danger mt-3';
    alertDiv.innerHTML = `
        <i class="fas fa-exclamation-triangle me-2"></i>
        ${message}
    `;

    const listDiv = document.getElementById('duplicateFilesList');
    if (listDiv) {
        listDiv.innerHTML = '';
        listDiv.appendChild(alertDiv);
    }
}

// تحميل Modal وربط الأحداث
document.addEventListener('DOMContentLoaded', function() {
    log('🎬 تحميل Modal الملفات المكررة - النسخة النظيفة', 'success');
    log(`🆔 Session ID: ${duplicateSessionId}`, 'info');

    // ربط زر التنزيل
    const downloadBtn = document.getElementById('downloadDuplicatesBtn');
    if (downloadBtn) {
        downloadBtn.addEventListener('click', function() {
            log('🔥 تم الضغط على زر التنزيل', 'info');

            // إظهار حالة التحميل
            const originalText = downloadBtn.innerHTML;
            downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> جاري التحميل...';
            downloadBtn.disabled = true;

            // تنفيذ التنزيل
            downloadDuplicateFiles();

            // استعادة حالة الزر
            setTimeout(() => {
                downloadBtn.innerHTML = originalText;
                downloadBtn.disabled = false;
            }, 1500);
        });
        log('✅ تم ربط زر التنزيل بنجاح', 'success');
    } else {
        log('❌ لم يتم العثور على زر التنزيل', 'error');
    }

    // ربط زر الحذف
    const deleteBtn = document.getElementById('deleteDuplicatesBtn');
    if (deleteBtn) {
        deleteBtn.addEventListener('click', function() {
            log('🗑️ تم الضغط على زر الحذف', 'warning');

            // إظهار حالة التحميل
            const originalText = deleteBtn.innerHTML;
            deleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> جاري الحذف...';
            deleteBtn.disabled = true;

            // تنفيذ الحذف
            deleteDuplicateFiles();

            // استعادة حالة الزر
            setTimeout(() => {
                deleteBtn.innerHTML = originalText;
                deleteBtn.disabled = false;
            }, 1500);
        });
        log('✅ تم ربط زر الحذف بنجاح', 'success');
    } else {
        log('❌ لم يتم العثور على زر الحذف', 'error');
    }

    // محاكاة تحميل بيانات الملفات المكررة
    setTimeout(() => {
        const listDiv = document.getElementById('duplicateFilesList');
        listDiv.innerHTML = `
            <div class="alert alert-info">
                <i class="fas fa-info-circle me-2"></i>
                تم العثور على 3 ملفات مكررة وحفظها في التخزين المؤقت
            </div>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead class="table-warning">
                        <tr>
                            <th>اسم الملف</th>
                            <th>المجلد</th>
                            <th>الحجم</th>
                            <th>التاريخ</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><i class="fas fa-file text-success me-2"></i>duplicate_image_1.jpg</td>
                            <td><span class="badge bg-secondary">uploads/images</span></td>
                            <td>256 KB</td>
                            <td>${new Date().toLocaleString('ar-SA')}</td>
                        </tr>
                        <tr>
                            <td><i class="fas fa-file text-success me-2"></i>duplicate_doc_2.pdf</td>
                            <td><span class="badge bg-secondary">uploads/documents</span></td>
                            <td>1.2 MB</td>
                            <td>${new Date().toLocaleString('ar-SA')}</td>
                        </tr>
                        <tr>
                            <td><i class="fas fa-file text-success me-2"></i>duplicate_video_3.mp4</td>
                            <td><span class="badge bg-secondary">uploads/videos</span></td>
                            <td>5.8 MB</td>
                            <td>${new Date().toLocaleString('ar-SA')}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        `;
        log('📂 تم تحميل قائمة الملفات المكررة', 'success');
    }, 1000);

    log('🎯 جاهز للاختبار - افتح Modal واضغط على زر التنزيل', 'info');
});
</script>

</body>
</html>
