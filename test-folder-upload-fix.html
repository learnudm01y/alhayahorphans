<!DOCTYPE html>
<html>
<head>
    <title>Test Folder Upload Fix</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    <h1>Test Folder Upload After Fix</h1>
    <form id="folderUploadForm">
        <input type="file" id="folderInput" webkitdirectory multiple />
        <button type="submit">Upload Folder</button>
    </form>

    <div id="results"></div>

    <script>
        document.getElementById('folderUploadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const input = document.getElementById('folderInput');
            const files = input.files;

            if (files.length === 0) {
                document.getElementById('results').innerHTML = '<p style="color: red;">Please select a folder first</p>';
                return;
            }

            console.log('Selected files count:', files.length);
            console.log('First file:', files[0]);

            const formData = new FormData();

            // Add all files to FormData
            for (let i = 0; i < files.length; i++) {
                formData.append('files[]', files[i]);
                console.log('Added file:', files[i].name, 'Path:', files[i].webkitRelativePath);
            }

            // Add folder name from first file path
            const folderName = files[0].webkitRelativePath.split('/')[0];
            formData.append('folder_name', folderName);

            console.log('Uploading folder:', folderName);
            console.log('FormData entries:');
            for (let pair of formData.entries()) {
                console.log(pair[0], pair[1]);
            }

            // Get CSRF token
            const token = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

            fetch('http://localhost:8000/api/upload-folder', {
                method: 'POST',
                headers: {
                    'X-CSRF-TOKEN': token
                },
                body: formData
            })
            .then(response => {
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                return response.text();
            })
            .then(data => {
                console.log('Raw response:', data);
                try {
                    const jsonData = JSON.parse(data);
                    document.getElementById('results').innerHTML =
                        '<h3>Upload Result:</h3>' +
                        '<pre>' + JSON.stringify(jsonData, null, 2) + '</pre>';
                } catch (e) {
                    document.getElementById('results').innerHTML =
                        '<h3>Raw Response:</h3>' +
                        '<pre>' + data + '</pre>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('results').innerHTML =
                    '<p style="color: red;">Error: ' + error.message + '</p>';
            });
        });
    </script>
</body>
</html>
